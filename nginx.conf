# ═══════════════════════════════════════════════════════════════════════════
# 🔴🔴 LE PROTOCOLE DU VISITEUR N'EST PAS `$scheme` — corrige au lot 92.
# ═══════════════════════════════════════════════════════════════════════════
# CE QUE CA A COUTE : « Cross-site POST form submissions are forbidden », page
# blanche au clic sur « creer mon compte », en PRODUCTION seulement.
#
# `$scheme` decrit la connexion CLOUDFLARE -> NGINX, pas celle du visiteur.
# Ce serveur n'ecoute qu'en `listen 80` : Cloudflare lui parle donc en clair,
# et `$scheme` vaut TOUJOURS `http`. La ligne
#     proxy_set_header X-Forwarded-Proto $proto_visiteur;
# ne transmettait donc pas le protocole du visiteur : elle ECRASAIT par `http`
# le `https` que Cloudflare venait d'envoyer.
#
# Astro reconstruit l'URL avec ce protocole, obtient `http://veveprice.com`,
# le compare a l'`Origin` du navigateur (`https://veveprice.com`) et refuse.
# Deux origines identiques AU SCHEMA PRES.
#
# ⭐⭐⭐ UN EN-TETE NOMME « X-Forwarded-Proto » QU'ON REMPLIT AVEC LE PROTOCOLE
#   DU DERNIER SAUT NE TRANSMET RIEN : IL EFFACE. Le nom dit « transmis », le
#   contenu dit « local ». C'est le meme motif que `$host` ou `Referer` : une
#   valeur qui a l'air de decrire le visiteur et decrit le voisin.
#
# ⚠️ FAIRE CONFIANCE A CET EN-TETE EST SUR ICI, ET IL FAUT SAVOIR POURQUOI :
#   un NAVIGATEUR ne peut pas ajouter `X-Forwarded-Proto` (en-tete interdit aux
#   requetes fetch/XHR inter-sites). Or la protection CSRF ne protege QUE de ca
#   — un navigateur pilote depuis un autre site. Un client qui forge ses
#   en-tetes n'a aucun besoin de CSRF : il appelle l'API directement.
#
# ⭐ Le repli sur `$scheme` garde le comportement local juste : en developpement
#   et dans le garde-fou de demarrage (qui interroge nginx en http, sans
#   Cloudflare), aucun en-tete n'arrive et la connexion dit la verite.
# ⭐⭐ DEUX SIGNAUX, ET C'EST DELIBERE. Je ne peux pas verifier depuis
#   l'exterieur lequel Cloudflare envoie a CETTE origine — le seul endroit ou
#   ca se lit est le serveur lui-meme. Plutot que de parier sur l'un des deux
#   et de decouvrir au deploiement suivant que c'etait l'autre, on lit les
#   deux. `X-Forwarded-Proto` est le standard ; `CF-Visitor` est la forme
#   propre a Cloudflare, qu'il envoie meme quand un intermediaire a mange le
#   premier.
# ⭐ ET `/api/sante` REND DESORMAIS `origin` : si malgre tout le protocole
#   reste faux, ca se lit en UNE requete au lieu d'un lot de plus.
map $http_cf_visitor $proto_secours {
  default   $scheme;
  "~*https" https;
}
map $http_x_forwarded_proto $proto_visiteur {
  default    $proto_secours;
  "~*^https$" https;
  "~*^http$"  http;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  # ⭐⭐ PRECOMPRESSE AU BUILD, PAS A CHAQUE REQUETE.
  # `gzip on` seul compresse a la volee, au niveau 1 (le defaut, qu'on ne
  # declarait nulle part) : chaque visiteur, chaque robot, chaque passage sur
  # chacune des 8 500 pages refaisait le meme travail, mal. Le Dockerfile
  # produit desormais un `.gz` NIVEAU 9 a cote de chaque fichier compressible,
  # et `gzip_static` le sert tel quel : plus petit ET zero CPU.
  # `gzip on` reste en second rideau pour ce qui n'aurait pas ete precompresse.
  gzip_static on;
  # ⚠️ SANS `gzip_vary`, un cache intermediaire peut servir une reponse
  #    compressee a un client qui ne l'accepte pas — ou l'inverse. C'est
  #    l'en-tete qui dit au cache que la reponse depend d'Accept-Encoding.
  gzip_vary on;
  gzip on;
  # ⚠️ `text/html` n'a PAS à figurer ici : nginx le compresse toujours, quelle
  #    que soit cette liste. C'est une fausse alerte classique — vérifiée le
  #    27/07 avant de « corriger » quelque chose qui marchait.
  # ⭐ `application/xml` MANQUAIT, lui : le sitemap (21,9 Ko) partait en clair à
  #    chaque passage de robot, là où il tombe sous 3 Ko une fois compressé.
  gzip_types text/css application/javascript application/json image/svg+xml text/plain
             application/xml application/xml+rss text/xml;
  gzip_min_length 512;

  # Mesure d'audience servie par CE domaine (anti-empreinte) : le visiteur ne
  # voit que veveprice.com/stats/, jamais l'adresse du serveur de statistiques.
  #  - ^~ est OBLIGATOIRE : sans lui, la regle de cache des .js plus bas
  #    intercepterait /stats/script.js AVANT ce proxy et renverrait une 404.
  #  - le nom passe par une VARIABLE + resolver : nginx demarre meme si le
  #    serveur de stats est injoignable (sinon le SITE ENTIER refuserait de
  #    demarrer a cause d'un simple compteur de visites).
  location ^~ /stats/ {
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    set $umami_host stats.veveprice.com;
    rewrite ^/stats/(.*)$ /$1 break;
    proxy_pass https://$umami_host;
    proxy_ssl_server_name on;
    proxy_set_header Host $umami_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proto_visiteur;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
  }

  # HTML : toujours revalide (le site est reconstruit chaque jour).

  # ═════════════════════════════════════════════════════════════════════════
  # 🌍 LOT 120 — AUCUNE REDIRECTION DE LANGUE ICI, ET C'EST MESURÉ
  # ═════════════════════════════════════════════════════════════════════════
  # `nginx.conf` est la configuration du mode STATIQUE, c'est-à-dire celle de
  # `vevewiki` — qui publie TOUJOURS ses cinq langues (53 pages en `/fr/`,
  # 52 en `/es/`, 52 en `/de/`, 51 en `/it/`, mesurées au build).
  #
  # 🔴🔴🔴 J'AVAIS POSÉ LE BLOC DE REDIRECTION ICI AUSSI, « pour que les deux
  # configurations restent jumelles ». Il aurait renvoyé les 157 pages
  # localisées de vevewiki vers des adresses anglaises qui n'existent pas dans
  # sa structure. **Le site entier, cassé par une règle écrite pour l'autre.**
  # ⭐⭐⭐ C'est `test:langues` qui l'a vu, en jouant sur le SECOND SITE — celui
  # auquel je ne pensais pas. *La règle « le jouer sur les 2 sites » ne vaut
  # que si un banc l'applique à ma place : je l'avais écrite, et je ne l'ai pas
  # suivie.*
  # ⛔ NE PAS « harmoniser » les deux fichiers sur ce point : ils ne servent
  #    pas le même site. Les redirections vivent dans `nginx.server.conf`.
  location / {
    try_files $uri $uri/ $uri/index.html =404;

    # Sans cette ligne, le « =404 » ci-dessus rend la page par defaut de nginx :
    # fond blanc, aucun lien, le visiteur quitte le site. On sert la NOTRE.
    error_page 404 /404.html;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header X-Frame-Options SAMEORIGIN;
  }

  # Ressources statiques : cache long.
  # ⚠️⚠️ `add_header` NE S'HÉRITE PAS d'un bloc `location` à l'autre : dès qu'un
  #      bloc en déclare UN, il perd TOUS ceux du bloc parent. Chaque bloc doit
  #      donc redire la liste complète. Constaté le 27/07 : Referrer-Policy
  #      disparaissait sur les fichiers statiques et sur le sitemap.
  location ~* \.(css|js|svg|png|jpg|jpeg|webp|avif|woff2)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header X-Frame-Options SAMEORIGIN;
  }

  location = /sitemap.xml       { add_header Cache-Control "public, max-age=3600"; add_header X-Content-Type-Options nosniff; add_header Referrer-Policy strict-origin-when-cross-origin; }
  location = /robots.txt        { add_header Cache-Control "public, max-age=3600"; add_header X-Content-Type-Options nosniff; add_header Referrer-Policy strict-origin-when-cross-origin; }
  location = /search-index.json { add_header Cache-Control "public, max-age=3600"; add_header X-Content-Type-Options nosniff; add_header Referrer-Policy strict-origin-when-cross-origin; }
  # 🔎 LOT 155 — L'INDEX DES RAYONS, MÊME POLITIQUE QUE L'INDEX DE RECHERCHE.
  # 🔴 SANS CE BLOC, `/rayon-index/comics.json` tombait dans `location /`, donc
  #    en `max-age=0, must-revalidate` : 1 538 Ko REVALIDÉS à chaque ouverture de
  #    la barre, et jamais gardés au edge — chaque membre qui filtre réveillait
  #    le VPS (2 cœurs) pour un fichier identique d'un build à l'autre.
  #    ⭐ Mesuré sur le build du 17/08 : comics 1 575 023 o · collectibles
  #    395 632 o · sets 252 152 o.
  # ⚠️ `^~` ET NON `=` : il y a TROIS fichiers, un par corpus, et la liste vit
  #    dans `CORPUS` (rayon_index.mjs). Trois lignes `location =` seraient une
  #    quatrième liste à tenir à jour — `regle-circuit-ouvert`.
  # ⚠️⚠️ `add_header` NE S'HÉRITE PAS d'un bloc `location` à l'autre : cette
  #    ligne redit la liste complète. ⭐ Elle ajoute `X-Frame-Options`, que la
  #    ligne de `search-index.json` juste au-dessus n'a pas — un écart de l'audit
  #    du 11/08 qu'on ne recopie pas sous prétexte de symétrie.
  location ^~ /rayon-index/ { add_header Cache-Control "public, max-age=3600"; add_header X-Content-Type-Options nosniff; add_header Referrer-Policy strict-origin-when-cross-origin; add_header X-Frame-Options SAMEORIGIN; }
}
