server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  gzip_min_length 512;

  # HTML : toujours revalide (le site est reconstruit chaque jour)
  location / {
    try_files $uri $uri/ $uri/index.html =404;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
  }

  # Ressources statiques : cache long
  location ~* \.(css|js|svg|png|jpg|jpeg|webp|avif|woff2)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Content-Type-Options nosniff;
  }

  location = /sitemap.xml       { add_header Cache-Control "public, max-age=3600"; }
  location = /robots.txt        { add_header Cache-Control "public, max-age=3600"; }
  location = /search-index.json { add_header Cache-Control "public, max-age=3600"; }
}
