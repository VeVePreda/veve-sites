site:
  domain: veveprice.com
  brand: "VeVe Price"
  tagline: "Historique de prix et floor des collectibles VeVe"
  description: "Suivez le prix plancher et l'historique multi-annees de chaque collectible VeVe : evolution, plus hauts, plus bas, nombre d'offres."
  lang: fr

rendering: static          # static | server
features:
  search: pagefind
  comments: false
  database: false

identity:
  theme: aurora
  palette:
    primary: "#4f8cff"
    accent: "#22c55e"
    danger: "#f43f5e"
    bg: "#0b0e14"
    surface: "#141a24"
    text: "#e6edf7"
    muted: "#94a3b8"
  fonts:
    heading: "system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
    body: "system-ui, -apple-system, Segoe UI, Roboto, sans-serif"

seo:
  title_template: "%s | VeVe Price"

content:
  data_modules: [item_price_pages, collection_index, movers, rarity_index]
