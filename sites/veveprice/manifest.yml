  website_id: "f5e7b44c-bdc7-4793-b30e-1bc40fe7db87"

seo:
  title_template: "%s | VeVe Price"
  indexnow_key: "8f3c1b7a92d54e6fa0c7b5e214d83f60"   # cle publique IndexNow (Bing/Yandex)

content:
  data_modules: [item_price_pages, collection_index, movers]

# ═══════════════════════════════════════════════════════════════════════════
# VITRINE ÉDITORIALE — les blocs d'accueil
# ═══════════════════════════════════════════════════════════════════════════
# ⭐⭐ CE TEXTE VIT ICI, PAS DANS LE GABARIT. La maquette l'écrivait en dur dans
# la fonction de rendu — et c'est exactement la faute qui a sorti du français
# sur les pages anglaises pour les descriptions de paliers. Dans un dépôt
# multilingue, tout texte destiné à être lu est une carte par langue.
# ⭐ Bénéfice secondaire, et il compte : tu peux réécrire une réponse de FAQ
# sans qu'un développeur touche un fichier .astro.
vitrine:
  # ═══════════════════════════════════════════════════════════════════════════
  # « DÉBUTER SA COLLECTION » — une SÉRIE d'articles, pas une donnée
  # ═══════════════════════════════════════════════════════════════════════════
  # ⭐ La maquette la définit noir sur blanc (l. 2217 et 3294) : « une SÉRIE
  #    d'articles, pas une catégorie. Une série a un ordre, un début et une
  #    fin. » Le catalogue n'a effectivement aucune notion de série ordonnée —
  #    le BLOG en a une depuis toujours. La section se remplit donc depuis
  #    l'onglet `Blog` du Sheet, sans une ligne de code de plus.
  #
  # CE QU'IL FAUT ÉCRIRE DANS LE SHEET, PAR ÉPISODE :
  #   · `tags`  contient `debuter` (c'est ce que lit `serie.tag` ci-dessous) ;
  #   · `ordre` (colonne OPTIONNELLE) porte 1, 2, 3… si l'ordre de lecture
  #     n'est pas l'ordre de publication.
  # ⚠️ `ordre` est TOUT OU RIEN : tant que les épisodes ne l'ont pas TOUS,
  #    l'ordre retenu est la date croissante, et le build le dit.
  #
  # ⛔ ZÉRO ARTICLE PORTANT L'ÉTIQUETTE = LA SECTION N'EXISTE PAS. Pas de titre
  #    seul, pas de cadres factices : la maquette peut inventer cinq épisodes,
  #    l'accueil d'un site de cotes non. Retirer `tag:` désactive la section.
  serie:
    tag: debuter

  # Les quatre encarts « Ce que fait ce site ». `span` = colonnes sur 12.
  # ⚠️ Les hauteurs INÉGALES font la composition : quatre boîtes identiques
  # forment un tableau, pas une plaque.
  boites:
    - n: "001"
      span: 7
      rang: 3
      # ⛔ LA CADENCE A QUITTÉ CE TITRE (lot 77, demande de Preda : « ne précise
      # pas à quelle fréquence »). C'était la DERNIÈRE des trois mentions
      # visibles de « toutes les 30 minutes » — les deux autres étaient
      # l'accroche de l'en-tête (lot 74) et la description SEO des sets.
      # ⭐ Le texte dit maintenant CE QU'ON FAIT, pas À QUEL RYTHME : la
      # promesse tient sans donner un chiffre qu'un incident de cron rendrait
      # faux, et que personne ne penserait à corriger ce jour-là.
      t: { fr: "Le plancher,<br>relevé et daté", en: "The floor,<br>recorded and dated",
           es: "El mínimo,<br>registrado y fechado", de: "Der Bodenpreis,<br>erfasst und datiert" }
      d: { fr: "Relevé et horodaté. Aucune estimation, aucun modèle : ce que vous lisez a été constaté à une heure précise.",
           en: "Recorded and timestamped. No estimate, no model: what you read was observed at a precise time.",
           es: "Registrado y con hora. Sin estimaciones ni modelos: lo que lee fue observado a una hora precisa.",
           de: "Erfasst und mit Zeitstempel. Keine Schätzung, kein Modell: Was Sie lesen, wurde zu einer genauen Zeit beobachtet." }
    - n: "002"
      span: 5
      rang: 2
      # 🔴🔴 LOT 205 — LE CHIFFRE N'EST PLUS GRAVÉ. Ce titre a dit « 1 200
      # fiches publiées » pendant que le site en publiait 8 840 : la première
      # promesse de l'accueil était fausse d'un facteur sept, en quatre
      # langues. La leçon vivait déjà plus haut dans CE fichier (« un chiffre
      # écrit en dur se périme en silence ») — écrite, jamais armée. Elle est
      # armée : test:promesses §P refuse désormais tout chiffre gravé dans les
      # surfaces de promesse (ces boîtes, l'accroche).
      # ⭐ Home.astro remplace le jeton (le mot fiches entre accolades) par la
      # projection déposée au build — la même source que /market/ et le
      # tableau de bord. Le jour où le catalogue grandit, le titre suit.
      # ⭐ Si la projection manque, `t0` prend la place : une phrase SANS
      # chiffre, qui reste vraie. ⛔ Jamais « 0 fiche » — un zéro inventé est
      # un mensonge exact.
      # ⛔ « 86 % du catalogue » est parti sans remplaçant : le lecteur ne
      # pouvait pas savoir s'il qualifiait la part des comics ou la
      # couverture — un pourcentage ambigu trompe même quand il est juste.
      t: { fr: "{fiches} fiches<br>publiées", en: "{fiches} pages<br>published",
           es: "{fiches} fichas<br>publicadas", de: "{fiches} Seiten<br>veröffentlicht" }
      t0: { fr: "Les fiches,<br>publiées", en: "The pages,<br>published",
            es: "Las fichas,<br>publicadas", de: "Die Seiten,<br>veröffentlicht" }
      d: { fr: "Choisies sur la densité de leur historique, avec une part garantie aux comics.",
           en: "Chosen on the density of their history, with a guaranteed share for comics.",
           es: "Elegidas por la densidad de su historial, con una parte garantizada a los cómics.",
           de: "Nach der Dichte ihrer Historie gewählt, mit garantiertem Anteil für Comics." }
    # 🔴 LOT 102 — CETTE BOÎTE DÉCRIVAIT LA JAUGE, ET LA JAUGE NE SE REND PLUS.
    # « où se situe le prix du jour entre les deux » nommait exactement le
    # curseur retiré par le lot 101 — parce que sa POSITION rendait le plancher
    # à qui savait diviser. Le texte a donc survécu à la chose qu'il décrivait.
    # ⭐ Il dit maintenant ce que le site FAIT des extrêmes (il les date et les
    # garde), pas ce qu'il en MONTRE. C'est vrai, et c'est ce qui se vend.
    - n: "003"
      span: 5
      rang: 1
      t: { fr: "Les extrêmes", en: "The extremes", es: "Los extremos", de: "Die Extreme" }
      d: { fr: "Plus haut et plus bas historiques, datés au jour près, et conservés même quand la pièce n'intéresse plus personne.",
           en: "All-time high and low, dated to the day, and kept long after a piece stops drawing attention.",
           es: "Máximo y mínimo históricos, fechados al día, y conservados aunque la pieza deje de interesar.",
           de: "Allzeithoch und -tief, auf den Tag datiert, und behalten, auch wenn ein Stück niemanden mehr interessiert." }
    - n: "004"
      span: 12
      rang: 2
      t: { fr: "Ce que la<br>courbe cache", en: "What the<br>curve hides",
           es: "Lo que la<br>curva oculta", de: "Was die<br>Kurve verbirgt" }
      d: { fr: "Une offre isolée peut porter un plancher à elle seule. Quand c'est le cas, la fiche le dit — elle ne le masque jamais.",
           en: "A single listing can carry a floor on its own. When it does, the page says so — it never hides it.",
           es: "Una sola oferta puede sostener un mínimo. Cuando ocurre, la ficha lo dice: nunca lo oculta.",
           de: "Ein einzelnes Angebot kann einen Bodenpreis allein tragen. Dann sagt die Seite es — sie verbirgt es nie." }

  # ⛔ CHAQUE RÉPONSE DOIT ÊTRE VRAIE AUJOURD'HUI. La maquette parlait de StackR
  # et d'OMI — que ce site ne collecte pas encore. Une FAQ qui décrit une
  # fonctionnalité absente est un mensonge signé, et c'est la seule chose qu'un
  # site de cotes ne peut pas se permettre.
  faq:
    - q: { fr: "D'où viennent les prix ?", en: "Where do the prices come from?",
           es: "¿De dónde vienen los precios?", de: "Woher kommen die Preise?" }
      # 🔴🔴 LOT 102 — « TOUTES LES TRENTE MINUTES », QUATRIÈME OCCURRENCE.
      # Le lot 77 avait retiré cette cadence sur demande de Preda (« ne précise
      # pas à quelle fréquence ») et sa notice affirmait tenir « la DERNIÈRE des
      # trois mentions visibles ». Elle vivait ici aussi, dans QUATRE langues,
      # et elle y est restée dix jours.
      # ⭐⭐⭐ LA PARADE TENAIT EN UNE COMMANDE, ET C'EST TOUJOURS LA MÊME :
      # `grep -rn "trente minutes" .` AVANT de déclarer un retrait terminé.
      # Chercher la CHAÎNE, pas la cause — un texte se recopie, il ne s'importe pas.
      r: { fr: "Du marché VeVe : le plancher, c'est-à-dire l'offre la plus basse en vente, relevé et horodaté. Aucune estimation, aucun modèle.",
           en: "From the VeVe market: the floor — the lowest active listing — recorded and timestamped. No estimate, no model.",
           es: "Del mercado VeVe: el mínimo, es decir la oferta más baja activa, registrado y con hora. Sin estimaciones ni modelos.",
           de: "Vom VeVe-Markt: der Bodenpreis, also das niedrigste aktive Angebot, erfasst und mit Zeitstempel. Keine Schätzung." }
    # ⭐ LOT 102 — LA QUESTION PARLAIT DU PRIX « AFFICHÉ ». Il n'y en a plus.
    # Elle porte maintenant sur le prix SUIVI : la réponse, elle, ne change pas
    # d'un mot — c'est la mise en garde la plus importante du site, et elle vaut
    # exactement autant pour un abonné qui le voit que pour un visiteur qui non.
    - q: { fr: "Le prix plancher est-il un prix de vente ?", en: "Is the floor price a sale price?",
           es: "¿El precio mínimo es un precio de venta?", de: "Ist der Bodenpreis ein Verkaufspreis?" }
      r: { fr: "Non, et la nuance est essentielle. C'est le prix de l'offre la plus basse EN VENTE. Personne ne l'a forcément payé.",
           en: "No, and the distinction matters. It is the price of the lowest ACTIVE listing. Nobody has necessarily paid it.",
           es: "No, y el matiz es esencial. Es el precio de la oferta más baja ACTIVA. Nadie lo ha pagado necesariamente.",
           de: "Nein, und der Unterschied zählt. Es ist der Preis des niedrigsten AKTIVEN Angebots. Niemand hat ihn zwangsläufig bezahlt." }
    - q: { fr: "Que se passe-t-il quand une seule offre porte le plancher ?", en: "What if a single listing carries the floor?",
           es: "¿Y si una sola oferta sostiene el mínimo?", de: "Was, wenn ein einzelnes Angebot den Bodenpreis trägt?" }
      r: { fr: "La fiche le signale. Ce chiffre décrit alors un vendeur, pas un marché — et le dire vaut mieux que le masquer.",
           en: "The page flags it. That number then describes a seller, not a market — and saying so beats hiding it.",
           es: "La ficha lo señala. Ese número describe entonces a un vendedor, no a un mercado.",
           de: "Die Seite markiert es. Diese Zahl beschreibt dann einen Verkäufer, keinen Markt." }
    - q: { fr: "Faut-il connecter un portefeuille ?", en: "Do I need to connect a wallet?",
           es: "¿Hay que conectar una cartera?", de: "Muss ich eine Wallet verbinden?" }
      r: { fr: "Jamais. Ce site ne demande aucune clé, ne signe aucune transaction et n'a rien à connecter.",
           en: "Never. This site asks for no key, signs no transaction, and has nothing to connect.",
           es: "Nunca. Este sitio no pide ninguna clave, no firma ninguna transacción.",
           de: "Nie. Diese Website verlangt keinen Schlüssel und signiert keine Transaktion." }
