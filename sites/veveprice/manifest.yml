# --- Liens de l'équipe (visibles dès le départ) ----------------------------
links:
  team: []                 # - { label: "Discord", url: "https://..." }
  affiliate: []            # - { label: "...", url: "https://...", sponsored: true }

identity:
  # ⛔ PLUS `aurora`. aurora code ses filets en blanc semi-transparent
  # (#ffffff12) : ils existent sur fond sombre et DISPARAISSENT sur fond clair,
  # sans qu'aucun build ne s'en plaigne. `vitrine` ne pose que des variables,
  # donc il bascule par construction.
  theme: vitrine
  # 🌐 OÙ VIT LE SÉLECTEUR DE LANGUE : "entete" (défaut) | "pied" | "compte".
  # ⛔ La maquette l'a sorti de l'en-tête sur demande de Preda ; le moteur ne
  # l'avait jamais suivi. Les liens hreflang RESTENT dans le DOM — ils
  # changent de place, pas d'existence — sinon Google perd les traductions.
  # ⚠️ vevewiki ne déclare rien et garde donc sa barre dans l'en-tête, que son
  # thème `encyclopedie` style depuis toujours (8 règles).
  #
  # ⭐ "compte" — AJOUTÉ LE 06/08/2026, DEMANDE DE PREDA. Le réglage descend
  # dans l'espace compte, et le menu ne garde qu'un accès DISCRET (un globe qui
  # déplie la liste). ⛔⛔ LES LIENS NE QUITTENT PAS LE DOM, MÊME LÀ : c'est par
  # eux que Google découvre /fr/, /es/, /de/ ; les enfermer derrière un compte
  # ferait disparaître le multilingue des résultats, et personne ne le verrait
  # avant des mois. Ils sont repliés, jamais retirés.
  langues_dans: compte
  # ═══════════════════════════════════════════════════════════════════════
  # 🌍🔴🔴 LOT 139 — OÙ LE VISITEUR CHOISIT LA LANGUE DES **LIBELLÉS**.
  #   "compte" (défaut, comportement d'avant) | "entete"
  # ═══════════════════════════════════════════════════════════════════════
  # ⛔⛔ CE N'EST PAS `langues_dans` CI-DESSUS, ET LES CONFONDRE EST L'ERREUR
  # QUE CE LOT VIENT DE RATTRAPER. `langues_dans` place les liens vers les
  # autres ADRESSES. Ce site en a UNE SEULE (`languages.active: [en]`) : ce
  # réglage-là n'a donc rien à placer, et c'est pour ça que la mesure du
  # 11/08 trouve **0 sélecteur de langue sur les 147 pages construites**.
  # Celui-ci place le choix des LIBELLÉS, dont ce site a QUATRE jeux
  # (`languages.interface: [en, fr, es, de]`).
  #
  # 🔴 CE QU'IL RÉPARE, ET C'ÉTAIT UN CIRCUIT OUVERT DEPUIS LE LOT 120 :
  # les quatre traductions existaient, et le seul code du dépôt qui pose le
  # cookie `vp_langue` vivait sur /compte/, /connexion/ et /inscription/.
  # /compte/ redirige un anonyme vers /connexion/, et personne ne cherche un
  # sélecteur de langue sur une page de connexion. ⇒ quatre langues
  # traduites, aucune porte publique. *Deux écrivains, aucun lecteur.*
  #
  # ⚠️ « PUBLIQUE » N'EST PAS UNE LISTE DE CHEMINS : le bouton n'est émis que
  # sur les pages PRÉ-GÉNÉRÉES. /compte/, /market/, /favoris/ et /dashboard/
  # sont rendues à la demande — elles n'en ont donc pas, ce que Preda a
  # demandé, et sans qu'aucune liste de chemins ait été recopiée quelque part.
  # ⛔ vevewiki ne pose PAS cette clé : il a cinq vraies adresses et garde sa
  # `.langbar`. Le défaut vaut "compte" pour que son silence soit sûr.
  langue_interface_dans: entete
  # 🎨 OÙ VIT LA BASCULE JOUR/NUIT : "entete" (défaut) | "compte".
  # ⛔ Même dispositif, même raison : `encyclopedie` garde sa bascule dans
  # l'en-tête, veveprice la descend dans l'espace compte (demande de Preda du
  # 06/08). ⚠️ Le script qui RESTAURE le choix au chargement reste dans le
  # <head> dans tous les cas : déplacer la commande ne doit pas oublier le
  # visiteur qui a déjà choisi la nuit.
  theme_dans: compte
  # ✏️ L'ACCROCHE DE L'EN-TÊTE (sous le nom). Courte, une carte par langue.
  # ⛔ Ce n'est PAS `site.tagline` — celle-là est la description SEO.
  # ⭐ Sans chiffre : « 1 200 pièces » se périmerait en silence.
  # ⭐⭐ LOT 74 (05/08/2026) — LA DEVISE, ENFIN AU BON ENDROIT.
  # ═══════════════════════════════════════════════════════════════════════════
  # 🔴 TROISIÈME ENDROIT OÙ CETTE PHRASE VIVAIT, ET LE SEUL QUE PREDA VOYAIT.
  # Il a écrit « il y a toujours marqué "The record, every 30 minutes" dans le
  # HEADER ». J'ai corrigé deux fois AILLEURS :
  #   lot 71 → `home.record`, l'étiquette au-dessus du grand titre ;
  #   lot 73 → les deux repères en coin du premier écran (`hero__ref`).
  # La phrase qu'il voyait était `identity.accroche`, le sous-titre sous le
  # logotype — dans l'en-tête, présent sur les 1 200 pages, exactement là où il
  # l'avait dit.
  # ⭐⭐⭐ IL AVAIT NOMMÉ L'ENDROIT LES DEUX FOIS, ET LES DEUX FOIS J'AI CHERCHÉ
  # OÙ ÇA M'ARRANGEAIT. « Header » ne veut pas dire « haut de page » : c'est un
  # élément qui a un nom dans ce code. Quand quelqu'un répète un reproche mot
  # pour mot, c'est le mot qu'il faut relire, pas le code.
  # ⛔ Et la parade tenait en une commande : `grep -rn "every 30" .` — trois
  #    occurrences, trois lots. Chercher la CHAÎNE avant de chercher la cause.
  # ⭐ La devise ne se met pas en majuscules ici : le thème s'en charge.
  accroche:
    fr: "Traquez ce que vous aimez"
    en: "Track down what you love"
    es: "Rastree lo que ama"
    de: "Finden Sie, was Sie lieben"
    it: "Trova ciò che ami"

  # ⭐ LA PALETTE DE BASE EST LA SOMBRE — c'est l'identité de VeVe Price, et
  # c'est celle qui a été dessinée, mesurée et validée. Les gris viennent de
  # l'application VeVe d'origine, relevés à la pipette, pas approximés.
  palette:
    primary: "#10CEF2"   # le cyan VeVe — porte les LIENS et l'état actif
    accent:  "#3EC875"   # hausse
    danger:  "#ED9BA6"   # baisse
    bg:      "#1A1A1A"   # le gris VeVe d'époque
    surface: "#2C2C2C"
    text:    "#FFFFFF"
    muted:   "#B1B1B1"   # mesuré 5,42:1 sur #1A1A1A — passe AA en texte courant

  # Le pendant clair. ⚠️ CHAQUE valeur en dur d'un thème doit avoir son pendant,
  # sinon la bascule laisse des trous invisibles au build.
  # ⭐ Le vif de VeVe échoue en TEXTE sur clair (le cyan tombe à 1,38:1) mais
  # réussit en APLAT avec une encre sombre. C'est pourquoi `primary` s'assombrit
  # ici : il sert de couleur de lien, donc de texte.
  palette_nuit:
    primary: "#0A7A90"   # cyan assombri — 4,73:1 sur #FFFFFF
    accent:  "#096E38"
    danger:  "#B01F32"
    bg:      "#EFEFEF"
    surface: "#FFFFFF"
    text:    "#1A1A1A"
    muted:   "#5E5E5E"

  fonts:
    # ⛔ NE PAS charger depuis Google Fonts : deux resolutions DNS + deux TLS
    # dans le chemin critique, et fonts.gstatic.com transmet l'IP du visiteur.
    # La fonte est AUTO-HEBERGEE, declaree juste en dessous.
    heading: "'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    body:    "'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    # ⭐ UN SEUL FICHIER POUR TOUTES LES GRAISSES. Le theme en utilise quatre
    # (500, 600, 700, 800) plus le corps en 400 : en statique cela ferait cinq
    # fichiers et cinq requetes. La version variable en fait 34 Ko, une requete.
    # ⚠️ Sous-ensemble `latin` : il couvre 108 des 112 caracteres reellement
    # servis sur les 4 langues. Les 4 restants sont des symboles (→ ⌘ ▲ ▼) que
    # le navigateur ira chercher glyphe par glyphe dans la pile de repli — c'est
    # le comportement normal, pas un carre vide.
    # ⛔ NE PAS remplacer par `latin-ext` : ce sous-ensemble est COMPLEMENTAIRE
    # et ne couvre QUE les caracteres etendus — 1 caractere sur 112 ici.
    files:
      - famille: "Archivo"
        fichier: "/fonts/archivo-latin-wght.woff2"
        graisses: "100 900"     # plage variable, pas une valeur unique
      # ⛔⛔ LA DEUXIÈME FONTE, OUBLIÉE PENDANT TOUTE LA REFONTE — 31/07/2026.
      # Le thème déclare `--tech:'Space Grotesk',ui-monospace,…` et 58 règles
      # s'en servent : `.prix`, `.num`, `.stat__v`, `.rang`, `.delta`,
      # `.tarif__p`, `thead th`, `.hero__ref`, `.jauge__v`, `.holder__v`…
      # autrement dit TOUS LES CHIFFRES d'un site de prix. Rien ne l'apportait :
      # `fonts.files` ne listait qu'Archivo. Les 58 règles descendaient donc
      # jusqu'à `ui-monospace`, et le site affichait ses prix dans la fonte à
      # chasse fixe du système là où la maquette montre une grotesque.
      # ⭐ MÊME SIGNATURE QUE LE DÉFAUT D'ARCHIVO, À UN LOT D'ÉCART : on a
      # corrigé la fonte du CORPS et laissé celle des CHIFFRES derrière, parce
      # qu'on a vérifié « la fonte est-elle servie ? » au singulier. Une pile de
      # replis qui aboutit ne lève aucune erreur — c'est ce qui rend ce défaut
      # invisible au build ET à `css-mort.mjs`, qui ne cherchait que les
      # variables fantômes, jamais les familles jamais chargées. Garde-fou ajouté.
      # ⭐ Plage 300..700 et non 100..900 : c'est ce que le fichier contient
      # réellement. Annoncer 100..900 ferait synthétiser au navigateur des
      # graisses absentes, et les étiquettes en 800 sortiraient en faux-gras.
      - famille: "Space Grotesk"
        fichier: "/fonts/space-grotesk-latin-wght.woff2"
        graisses: "300 700"     # plage réelle du fichier variable (SIL OFL 1.1)

