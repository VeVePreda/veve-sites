# ⚠️ VeVePreda/veve-sites — sites/veveprice/manifest.yml
site:
  domain: veveprice.com
  brand: "VeVe Price"
  # ═══════════════════════════════════════════════════════════════════════
  # 🔴 LOT 102 (07/08/2026) — LA PROMESSE DU SITE A CHANGÉ DE NATURE
  # ═══════════════════════════════════════════════════════════════════════
  # AVANT : « Track the floor price and price history of every VeVe
  # collectible » — c'est-à-dire « venez VOIR le floor ». Depuis le lot 101,
  # aucune page publique ne l'affiche.
  # ⛔ UNE PAGE QUI PROMET UN PRIX QU'ELLE N'AFFICHE PLUS EST UNE PROMESSE
  # ROMPUE FAITE À UN MOTEUR. Le visiteur arrive par cette phrase, ne trouve
  # pas ce qu'elle annonce, et repart : Google appelle ça un « pogo-stick » et
  # le compte contre la page. Ce n'est pas une coquetterie éditoriale, c'est le
  # signal de qualité le plus direct qu'on puisse s'infliger.
  # ⭐⭐⭐ ON NE VEND PLUS « VOIR » LE FLOOR, ON VEND « LE SUIVRE ». La phrase
  # dit donc ce qui est LIBRE (le catalogue, la rareté, le tirage, le prix de
  # sortie) puis ce qui est SUIVI POUR LES MEMBRES (le plancher, son historique,
  # les extrêmes). Les deux moitiés sont vraies, et dans cet ordre.
  tagline:
    en: "The VeVe catalogue, with floor price tracking for members"
    fr: "Le catalogue VeVe, avec le suivi du plancher pour les membres"
    es: "El catálogo VeVe, con seguimiento del mínimo para los miembros"
    de: "Der VeVe-Katalog, mit Bodenpreis-Verfolgung für Mitglieder"
  description:
    en: "Every VeVe collectible: set, rarity, mintage and release price, free to browse. The floor price, its history and the all-time extremes are tracked for members."
    fr: "Tout le catalogue VeVe : set, rareté, tirage et prix de sortie, en accès libre. Le prix plancher, son historique et les extrêmes sont suivis pour les membres."
    es: "Todo el catálogo VeVe: set, rareza, tirada y precio de salida, en abierto. El precio mínimo, su historial y los extremos se siguen para los miembros."
    de: "Der ganze VeVe-Katalog: Set, Seltenheit, Auflage und Startpreis, frei zugänglich. Bodenpreis, Verlauf und Extremwerte werden für Mitglieder erfasst."

# --- Langues : anglais par defaut, les autres en sous-dossier (/fr/, /es/, /de/)
languages:
  # ═══════════════════════════════════════════════════════════════════════
  # 🌍 LOT 120 — LE CONTENU PASSE EN ANGLAIS, L'INTERFACE RESTE TRADUITE
  # ═══════════════════════════════════════════════════════════════════════
  # Preda, 10/08 : « le multilingue ne vaut pas son coût, car à part
  # l'interface et la description de l'item il n'y a rien à traduire ».
  # MESURÉ avant de couper : ~9 300 des 12 376 pages étaient des
  # localisations, pour 433 clés d'interface et un champ `description`.
  # Le même nom de pièce, la même rareté, le même tirage, le même prix.
  #
  # ⚠️ `it` N'A JAMAIS ÉTÉ ACTIF. Il a ses 433 clés et des articles de blog,
  # et zéro page générée. Ce genre d'écart entre ce qu'on croit publier et ce
  # qu'on publie ne se voit qu'en comptant les fichiers de `dist/`.
  default: en
  # LES LANGUES QUI ONT UNE ADRESSE. C'est cette liste, et elle seule, que
  # lisent les `getStaticPaths`, le sitemap et les `hreflang`.
  # 🔴 LES ~9 300 URL SUPPRIMÉES SONT REDIRIGÉES EN 301 par nginx, pas
  #    abandonnées en 404. Elles n'ont pas disparu : elles ont FUSIONNÉ avec
  #    leur équivalent anglais, qui portait déjà le même contenu — et le 301
  #    est la phrase qui dit exactement ça. ⛔ Rajouter une langue ici sans
  #    retirer sa règle de redirection créerait une boucle : nginx renverrait
  #    `/fr/x` vers `/x` pendant qu'Astro génère `/fr/x`.
  active: [en]
  # LES LANGUES DES LIBELLÉS. Aucune adresse, aucun `hreflang`, aucune page.
  # ⭐ Elles servent aux pages NÉGOCIÉES à la demande — connexion, inscription,
  #   compte — qui lisent `?lang=` ou `Accept-Language` et ne sont jamais mises
  #   en cache partagé. Un francophone garde son espace membre en français.
  # ⛔ CE QUE ÇA NE FAIT PAS, ET IL FAUT LE DIRE : les 12 000 pages PUBLIQUES
  #   sont pré-générées et servies depuis un cache — leur interface reste en
  #   anglais. Les traduire là demanderait soit une adresse par langue (ce
  #   qu'on vient de supprimer), soit de marquer 534 appels `t()` pour un
  #   remplacement côté navigateur. C'est un autre lot, et une autre décision.
  # 🌍 LOT 207 — `it` REJOINT L'INTERFACE, et c'est une CONSÉQUENCE MESURÉE de
  # l'arbitrage « blog en 5 langues » : des articles italiens sous un chrome
  # anglais, c'est la fuite que test:langues refuse (« articles annoncés,
  # interface absente »). Son dictionnaire a toujours été complet — la note
  # « it n'a jamais été actif » (plus haut) est donc DATÉE : vraie jusqu'au
  # 27/08/2026. ⚠️ Le registre italien est TU, assumé (voir test:cles §voix).
  interface: [en, fr, es, de, it]
  # LES LANGUES DES ARTICLES. Preda, 10/08 : « on peut garder les différentes
  # pages du blog dans différentes langues si c'est vraiment intéressant » —
  # et ses articles sont écrits ou relus en `en` et `fr`, pas dans les autres.
  # ⭐ C'est le SEUL endroit du réseau où le contenu diffère vraiment d'une
  #   langue à l'autre, donc le seul où une adresse par langue se justifie.
  # 🔴 `/fr/blog/` DOIT ÊTRE EXCLUE des redirections 301 de nginx : ces pages
  #   existent. C'est le piège de ce lot, et un banc le tient.
  # 🌍 LOT 207 — ARBITRAGE PREDA (26/08) : LE BLOG PASSE EN 5 LANGUES.
  # Le Sheet porte es/it/de complets depuis toujours ; seul ce manifeste les
  # taisait. ⚠️ Les exceptions nginx suivent (`/es/blog/`, `/de/blog/` en
  # `^~` avant les 301 de fusion) ; `/it/…` n'a JAMAIS eu de règle 301 — il
  # n'a pas besoin d'exception, et lui en écrire une serait du bruit.
  blog: [en, fr, es, de, it]

rendering: server          # static | server
features:
  search: internal
  comments: false
  database: false

# --- Vitrine publique : on ne publie QUE des pages utiles -------------------
publication:
  # Feuille des adresses de comics : rarity | name | issue-rarity
  #   rarity       -> /comics/alias-1-2001/secret-rare/
  #   name         -> /comics/<serie>/<nom de la couverture>/
  #   issue-rarity -> /comics/<serie>/<numero>/<rarete>/     <-- 28/07/2026
  # ⭐ `issue-rarity` est la hierarchie de VeVe lui-meme (celle qu'affichent
  # CollectScan et StackR) : une SERIE contient des NUMEROS, un numero existe
  # en plusieurs RARETES. Les deux modes a DEUX niveaux s'effondrent des que la
  # serie devient une vraie serie — mesure sur les 16 536 comics reels :
  #   serie + rarete          4 738 cles · 14 452 uuid en collision
  #   nom seul                4 253 cles · 16 142 en collision
  #   serie + numero + rarete 16 119 cles ·    726 en collision
  # En cas de collision (couvertures VARIANTES d'un meme numero), le nom de la
  # couverture est ajoute ; l'identifiant court n'arrive qu'en dernier recours.
  comic_leaf: issue-rarity
  # ⭐⭐ ARME LE 29/07/2026 — les adresses de ce site sont GELEES par
  # sites/veveprice/slugs.json (1 200 fiches, gelees le 29/07/2026). A partir
  # d'ici, un build qui PERDRAIT la table echoue au lieu de republier en
  # silence des adresses recalculees (engine/tools/test_renommage.mjs, appele
  # par le Dockerfile). Ne jamais repasser a false : ce serait rendre a
  # nouveau flottantes les 1 200 URL deja publiees.
  adresses_gelees: true
  min_price_points: 8      # relevés minimum AU TOTAL pour qu'une fiche mérite d'exister

  # ═══════════════════════════════════════════════════════════════════════
  # 🔴🔴 LOT 193 (25/08/2026) — LES PLANCHERS QU'ON N'AFFICHE PAS
  # ═══════════════════════════════════════════════════════════════════════
  # Preda, 25/08 : « les planchers (hors item 1/1) qui dépassent 5 000 et qui
  # n'ont pas plus de deux listings ne doivent pas être pris en compte ».
  #
  # ⭐ CES TROIS NOMBRES SONT ÉCRITS ICI, PAS DANS LE CODE, ET CE N'EST PAS DU
  # ZÈLE : le code porte les mêmes en repli (5000 / 2 / 20), donc sans ces
  # lignes le chemin « le manifeste décide » ne serait JAMAIS emprunté — et un
  # chemin jamais emprunté n'est pas sûr, il est non mesuré. Les poser ici les
  # rend réglables sans déploiement de code, et éprouvés à chaque build.
  #
  # ⚠️ EN DOLLARS, comme la colonne « Floor » de /market/ — le plancher VeVe.
  #    ⛔ Surtout pas le plancher StackR, qui est en OMI : ce sont deux marchés,
  #    et 5 000 n'y veut pas dire la même chose.
  outlier_price: 5000        # au-dessus de ce plancher en $, la pièce est examinée
  outlier_listings: 2        # ...si au plus ce nombre d'offres la porte (0 compris)
  # ⭐ LE TROISIÈME EST À MOI, ET IL EST LÀ POUR SAUVER DE VRAIES PIÈCES.
  # Mesuré le 25/08 sur 13 630 pièces : les deux règles ci-dessus SEULES
  # emportaient `Amazing Fantasy` (8 888 $, sa médiane depuis 592 relevés) et
  # `Marvel Comics` (5 900 $, 645 relevés). En dessous de ce nombre de relevés
  # — ou si le plancher dépasse `outlier_factor` fois la médiane — la pièce est
  # écartée ; au-dessus, son propre passé la défend.
  # 🔴 Il se compte sur le TOTAL des relevés, jamais sur l'historique public :
  #    celui-là est tronqué par le palier du lecteur.
  outlier_min_points: 20
  # ⚠️ `public_points_max` et `public_history_days` ont MIGRÉ vers `access:`
  # (voir plus bas) le 20/07/2026 : ce sont des réglages d'ACCÈS, pas de
  # publication. Un quota de vitrine décide QUELLES fiches existent ; un palier
  # décide CE QU'ON MONTRE d'une fiche qui existe. Les laisser ici en double
  # ferait échouer le build volontairement — c'est le garde-fou.

  # ⭐ TAILLE DE LA VITRINE, PAR TYPE (remplace l'ancien plafond global unique).
  # Ce plafond unique avait produit un angle mort mesuré en prod : les comics
  # sont 86 % du catalogue et représentaient 0 % du site, évincés par les
  # collectibles que le backfill densifie plus vite.
  # ⚠️ C'est une TAILLE CIBLE, pas un débit : les fiches déjà gelées comptent
  # dedans. L'ensemble publié est collant (slugs.json) -> relever ces nombres
  # est IRRÉVERSIBLE. Monter par paliers, en s'appuyant sur la Search Console.
  #
  # ═══════════════════════════════════════════════════════════════════════
  # 🔴🔴 LOT 153 (14/08/2026) — 2534 N'EST PAS UN CHIFFRE ROND, ET C'EST EXPRÈS
  # ═══════════════════════════════════════════════════════════════════════
  # C'est le nombre EXACT de collectibles éligibles mesuré le 14/08 sur le
  # catalogue réel : `[vitrine] eligibles {"collectible":2534,"comic":7647}`,
  # sur 2 743 collectibles au catalogue (les 209 autres sont sous le seuil de
  # `min_price_points`). ⇒ le quota cesse de limiter les collectibles ; le
  # SEUIL DE RELEVÉS redevient la seule porte, et c'est la bonne.
  #
  # ⛔⛔ NE PAS ÉCRIRE 2743 « pour être tranquille ». MESURÉ, build réel :
  #   collectible: 2743 -> `report 209` -> **609 comics publiés au lieu de 400**
  #   et 5 505 pages au lieu de 5 101. `quota_spillover: true` ne PLAFONNE pas,
  #   il REDISTRIBUE : un quota qui dépasse l'éligible déborde sur l'AUTRE type.
  # ⭐⭐⭐ Un quota n'est pas un plafond, c'est un BUDGET — et un budget non
  #   dépensé se dépense ailleurs. Le seul chiffre qui ne publie rien qu'on
  #   n'ait décidé est celui qui égale l'éligible.
  #
  # 📐 CE QUE CE PALIER PRODUIT, MESURÉ (2 builds réels, hors ligne exclu) :
  #   fiches 1 600 -> 2 534 (+934) · séries 1 111 -> 1 174 (**+63 seulement**,
  #   le réveil de séries SATURE) · comics 400 inchangés · pages 4 104 -> 5 101
  #   · sitemap 3 122 -> 4 119 · `/sets/` 1,04 -> 1,21 Mo brut (+16 %).
  #   27 bancs sur 27 verts sur le `dist/` réel, dont `test:titres`
  #   (5 100 titres tous distincts) et `test:renommage` (adresses gelées).
  # 🔴 Pic du build RÉEL : **2,17 à 2,27 Go** sur les 3 072 Mo du Dockerfile,
  #   et l'écart entre DEUX RUNS AU MÊME QUOTA (0,49 Go) dépasse l'écart entre
  #   les quotas. ⛔ La mesure hors ligne du 14/08 (« 749 Mo, 24 % du plafond »)
  #   SOUS-ESTIMAIT D'UN FACTEUR 3 : la marge réelle est ~0,8 Go, pas 2,3 Go.
  # ═══════════════════════════════════════════════════════════════════════
  # 🔴🔴 LOT COMICS (14/08/2026) — 5210 N'EST NI L'ELIGIBLE, NI UN CHIFFRE ROND
  # ═══════════════════════════════════════════════════════════════════════
  # Le 153 a appris qu'un quota est un BUDGET et qu'il faut ecrire l'ELIGIBLE
  # MESURE. Ici l'eligible vaut 7 647 — ET C'EST ENCORE LE MAUVAIS CHIFFRE.
  # MESURE, deux builds reels :
  #     comic: 7647 -> ecartes par le plafond de 12/serie : 2437 -> PUBLIE 5210
  #     comic: 5210 -> ecartes par le plafond de 12/serie : 2433 -> PUBLIE 5210
  #   Les deux rendent EXACTEMENT le meme site : 11 682 pages, sitemap 10 700.
  # ⭐⭐⭐ LE PLAFOND DES COMICS N'EST PAS LE QUOTA, C'EST `max_new_per_series`.
  #   Il n'ecarte AUCUN collectible (0 a tous les paliers) et il mord de plus en
  #   plus fort sur les comics : 0 -> 226 -> 1 345 -> 2 437 quand le quota monte.
  # ⛔⛔ ET LES 2 437 PLACES NON DEPENSEES NE DEBORDENT NULLE PART : les
  #   collectibles sont a 100 % de leur eligible, donc elles sont PERDUES EN
  #   SILENCE — et `report 0` ne le dit pas. Un manifeste a 7647 annoncerait
  #   7 647 comics pour 5 210 servis.
  # ⇒ UN SECOND PLAFOND PEUT RENDRE LE PREMIER INATTEIGNABLE. Le chiffre a
  #   ecrire n'est ni le rond, ni l'eligible : c'est CE QUE LE BUILD PUBLIE.
  #
  # 📐 CE QUE CE PALIER PRODUIT, MESURE (7 builds reels, hors ligne exclu) :
  #   comics 400 -> 5 210 · series /collection/ 1 174 -> 2 945 · pages
  #   5 101 -> 11 682 · sitemap 4 119 -> 10 700 · dist/ 200 -> 452 Mo.
  #   ⭐ Le reveil de series SATURE ici aussi : +1 007 series pour les 1 600
  #   premiers comics, +243 pour les 1 210 derniers.
  # ✅ PIC MEMOIRE : 1,73 a 2,32 Go a 11 682 pages — LA MEME BANDE QU'A 5 101
  #   PAGES (2,10 ; 2,17-2,27 mesures au 153). L'ecart entre deux runs au meme
  #   palier depasse l'ecart entre les paliers ⇒ le nombre de pages NE PILOTE
  #   PAS le pic, la marge ~0,8 Go tient. Idem la duree : 43 a 68 s de 5 101 a
  #   11 682 pages, aucun modele n'en sort.
  # 🔴 CE PALIER A EXIGE UN CORRECTIF DE TITRE (`Item.astro`) : `test:titres`
  #   rendait 24 doublons, tous des comics. Voir le bloc de ce fichier-la.
  #
  # ═══════════════════════════════════════════════════════════════════════
  # 🎯 PALIER A (14/08/2026, arbitrage Preda apres §M-183) — 5210 -> 6306
  # ═══════════════════════════════════════════════════════════════════════
  # ⛔⛔ CE N'EST PAS `max_new_per_series` QUI ETAIT LE VERROU. Les deux
  #   plafonds sont EN SERIE et le QUOTA MORD LE PREMIER (dataset.mjs L.736) :
  #       places[comic] = quotas.comic - deja geles = 5210 - 5210 = 0
  #   ⇒ relever `max_new_per_series` SEUL n'aurait publie ZERO fiche. On monte
  #   donc le quota, et on LAISSE le plafond de serie a 12.
  #
  # 📐 BASE MESUREE (sitemap servi x entrepot, 14/08, joint a 99,7 %) :
  #     eligibles 7609 · publies 5193 · RESTANTS 2445, repartis sur 836 series.
  #   Ce que le plafond de 12/serie laisse passer, par palier :
  #     12 -> +1113   16 -> +1293   20 -> +1444   24 -> +1567   0 -> +2445
  #   ⇒ a 12, le gisement atteignable est +1113, soit 45 % du total. C'est LUI
  #   qui fixe ce quota : 5193 + 1113 = 6306.
  #
  # 🔴 MARGE MINCE, ASSUMEE : le quota demande 1096 places (6306 - 5210) et le
  #   plafond de serie en offre 1113. **17 de marge (1,5 %).** Si le build
  #   annonce `PUBLIE` < 6306, ce n'est PAS un bug du quota : c'est le second
  #   plafond qui a mordu, et il faut relire `ecartes par le plafond de 12/serie`.
  #   ⛔ Ne PAS remonter le quota dans ce cas — monter `max_new_per_series`.
  #
  # 💶 FACTURE ANNONCEE, A VERIFIER SUR LE SITEMAP SERVI (poids : 10 mesures
  #   en production, fiche comic 32 129 o, page /collection/ 33 237 o, +45 % de
  #   precompression) :
  #     +1096 fiches · +138 pages /collection/ · +1234 pages · dist/ 453 -> ~511 Mo
  #     sitemap 10 700 -> 11 934   (comics 5210 -> 6306 · collection 2945 -> 3083)
  #   ⚠️ 1096, PAS 1113 : les places offertes valent 6306 - 5210 (les fiches DEJA
  #     GELEES consomment le quota), pas 6306 - 5193 (le joint du sitemap en
  #     laisse 17 de cote). Les 17 restants sont la marge, pas des fiches en plus.
  #   ⏱️ duree ~10 min 34 (+31 s) — 🟠 ESTIMATION, elasticite VPS du §M-179
  #   (+129 % de pages -> +62 % de duree). ⛔ Le bac a sable ne la predit pas.
  #
  # 🔐 APRES LE DEPLOIEMENT : `npm run slugs` (le gel passe de 7744 a 8978).
  #   (7744 + 1234 = 8978.) Le gel est IRREVERSIBLE A LA BAISSE — d'ou le palier, plutot que le
  #   plafond retire d'un coup.
  # ═══════════════════════════════════════════════════════════════════════
  # 🎯 PALIER B (03/09/2026, arbitrage Preda) — 8 840 ➜ 9 354 fiches
  # ═══════════════════════════════════════════════════════════════════════
  # 🔴🔴 CE QUI A ÉTÉ CORRIGÉ D'ABORD, ET C'ÉTAIT DANS MES NOTES, PAS DANS LE
  #   CODE : « 8 840 publiées sur 14 090 items qui ont un prix ⇒ 5 250 fiches
  #   en attente ». FAUX. « Avoir un prix » n'est pas « être éligible » : le
  #   seuil de relevés écarte 9 548 pièces du catalogue de 19 786.
  #   MESURÉ le 03/09 par un build RÉEL (entrepôt en ligne, pas l'échantillon) :
  #       éligibles — collectibles 2 565 · comics 7 673 · TOTAL 10 238
  #   ⇒ le gisement entier vaut +1 398 fiches, pas +5 250. Un facteur 3,8.
  #   ⭐ « Qui a un prix » et « qui mérite une fiche » sont deux populations, et
  #      la seconde se mesure — le build l'imprime à chaque fois.
  #
  # 📐 LE PLAFOND DE SÉRIE DÉCIDE DU RESTE, ET IL A ÉTÉ MESURÉ AUX 5 PALIERS.
  #   Quotas posés à l'éligible, un build de dataset par ligne :
  #       plafond 12 ➜ PUBLIE 9 354 (+514)   ·  écartés 884
  #       plafond 16 ➜ PUBLIE 9 457 (+617)   ·  écartés 781
  #       plafond 20 ➜ PUBLIE 9 546 (+706)   ·  écartés 692
  #       plafond 24 ➜ PUBLIE 9 623 (+783)   ·  écartés 615
  #       sans plafond ➜ PUBLIE 10 238 (+1 398)
  #   Arbitrage : on garde le plafond à 12, UNE SEULE VARIABLE CHANGE.
  #   ⚠️ Ce que le plafond achète, mesuré aussi : la plus grosse série passe de
  #      36 à 48 fiches à 12, à 60 à 24, et à **176** sans plafond (puis 171,
  #      135). Le retirer ferait pencher le site sur quelques grosses séries de
  #      comics — et le gel rendrait ce penchant définitif.
  #
  # ⭐⭐⭐ LE CHIFFRE ÉCRIT EST CE QUE LE BUILD PUBLIE, PAS L'ÉLIGIBLE — c'est la
  #   leçon du 14/08, et elle a été RE-VÉRIFIÉE ici plutôt que crue :
  #       quota comics à 7 673 ➜ PUBLIE 9 354, dont 6 789 comics
  #       quota comics à 6 789 ➜ PUBLIE 9 354, dont 6 789 comics
  #   Les deux rendent EXACTEMENT le même site. Écrire l'éligible annoncerait
  #   884 places que le plafond de série ne laissera jamais dépenser, et le
  #   report ne les récupère pas : les collectibles sont déjà à 100 % du leur.
  #   ⇒ 6 789 est le seul nombre qui ne promet rien qu'on ne serve.
  #
  # 🔵 LES COLLECTIBLES : 2 534 ➜ 2 565, soit +31, et c'est TOUT le gisement.
  #   Le quota du 14/08 valait déjà l'éligible d'alors ; le catalogue en a
  #   ajouté 31 depuis. ⛔ « Priorité aux collectibles » ne se joue donc PAS
  #   ici — le verrou des collectibles est le seuil de relevés, pas ce quota.
  #
  # 💶 FACTURE, MESURÉE SUR LE BUILD RÉEL DE CE LOT (pas estimée) — voir le
  #   jalon du 03/09 dans outputs/SUIVI.md pour les pages, le sitemap, le pic
  #   mémoire et la durée.
  #
  # 🔐 APRÈS LE DÉPLOIEMENT, LE GEL : les 514 adresses neuves restent
  #   flottantes jusqu'au passage du job hebdomadaire « Geler les adresses des
  #   fiches » (dimanche). ⭐ Il se déclenche aussi à la main, en un clic, et
  #   c'est un commit — donc un déploiement de plus. Le gel est IRRÉVERSIBLE À
  #   LA BAISSE : c'est ce qui impose le palier plutôt que le plafond retiré.
  quotas:
    collectible: 2565
    comic: 6789
  quota_spillover: true    # un type qui ne remplit pas sa part cède ses places à l'autre
  max_new_per_series: 12   # diversité : nouvelles fiches max par série (0 = pas de plafond)
  # 🔢 PLAFOND DU CLASSEMENT D'AMPLITUDE — lot 171 (21/08/2026)
  # Au-dela de ce rapport (plus-haut / plus-bas), un item sort du classement de
  # /analytics/ — la page dit combien elle en ecarte.
  # 🔴 MESURE DU 21/08 sur le catalogue reel : 42 items portent un `ath` au-dessus
  #   de 100 MILLIONS de gems (999 999 999 999, 888 888 888 888…). Ce sont des
  #   annonces farceuses, pas des prix. ⛔ Et ce n'est PAS un `atl` proche de zero :
  #   il n'existe pas un seul `atl` inferieur a 1 dans tout le catalogue.
  # A x1000 : 1 142 items ecartes (7,4 %), et la tete du classement redevient
  #   lisible. ⚠️ Ce plafond MASQUE, il ne repare pas — le chantier ATL/ATH est
  #   dans scrapeur-veve. `0` = aucun plafond (comportement d'avant le lot 171).
  amplitude_max: 1000

# --- Niveaux d'accès -------------------------------------------------------
# ⭐ LE PALIER EST UNE DONNÉE. Aucune page ne teste un palier, aucune page ne
# lit un plafond : tout passe par engine/lib/access.mjs. Un site 100 % gratuit,
# 100 % payant ou mixte, c'est le MÊME code — seul ce bloc change.
#
# Pour un site entièrement gratuit, il suffit d'écrire :
#     access:
#       tiers: [visitor]
# Les portes exigeant un palier absent se DÉSACTIVENT : plus aucune troncature,
# plus aucun appel à l'action fantôme, et pas une ligne de code conditionnel.
access:
  tiers: [visitor, member, crevette, langouste, whale]

  # ─────────────────────────────────────────────────────────────────────────
  # 🗑️ SESSION DE DÉMONSTRATION — RETIRÉE LE 24/08/2026 (LOT 161, demande `r`)
  # ─────────────────────────────────────────────────────────────────────────
  # Il y avait ici une ligne `demo:` et quarante lignes pour la défendre. Le
  # mécanisme entier est parti : `engine/lib/demo_session.mjs`,
  # `src/pages/api/demo.js`, la lecture dans `src/middleware.js`, le bloc de
  # `/compte/`, six clés dans les cinq dictionnaires, et le banc `test:demo`.
  #
  # ⭐ CE QU'ELLE AURA APPRIS, ET QUI RESTE VRAI SANS ELLE : une porte ouverte
  # « pour se montrer le produit » est une porte ouverte. Éteinte le 06/08,
  # elle servait la réserve — l'historique complet, celui qui s'achète — à qui
  # connaissait l'adresse, sans aucun cookie. « Démonstration » décrivait
  # l'INTENTION, jamais l'effet.
  #
  # ⛔ ÉCRIRE `demo:` ICI NE LA RALLUME PAS : `engine/lib/access.mjs` LÈVE une
  # erreur nommée. Un mécanisme retiré ne devient pas un silence.

  gates:
    # L'historique : 3 jours pour qui ne paie pas (arbitrage Preda du 30/07).
    price_history:
      tier: crevette
      public_max: 30       # relevés RÉELLEMENT exposés
      public_days: 3       # ⭐ 3 jours, pas 90 : c'est la profondeur qui se vend
      # ═══════════════════════════════════════════════════════════════════
      # 🔴 LOT 104 (07/08/2026) — LES PLAGES DU GRAPHIQUE, arbitrage Preda
      # ═══════════════════════════════════════════════════════════════════
      # « Un Membre voit le cadenas dès 7 J ; une Crevette seulement à
      # partir de 30 J. » ⭐ Langouste ouvre 30 J ET 90 J — les deux, pas
      # l'une : le tableau de Preda écrit « 30 J + 90 J » sur une seule
      # ligne, et le `+` est une conjonction, pas une plage de plus.
      #
      # ⛔ CETTE LISTE EST LA SEULE. `Item.astro` les écrivait EN DUR, sans
      # « 7 J » et avec un verrou décoratif identique pour tout le monde.
      # ⚠️ L'ORDRE DU TABLEAU EST L'ORDRE AFFICHÉ.
      # ⚠️ `jours: null` = sans borne. Ce n'est pas « inconnu » : c'est Max.
      # 🔴🔴 LOT 132 (10/08/2026) — `3j` PASSE DE `visitor` À `member`, arbitrage
      # Preda du jour : « 3j=membre / 7j=crevette / 30j+90j=langouste / Max=Whale ».
      # ⭐ Ce n'est pas un durcissement de plus : c'est la MÊME décision que le
      # lot 126 sur la cote (« le market doit être visible une fois qu'on est
      # membre »), appliquée à la profondeur. Le graphe ne s'ouvre de toute façon
      # qu'à qui a une session — `Cadran.astro` sort si `<html>` ne porte pas
      # `data-membre`, et `/api/cote/` exige une session. Laisser `visitor` ici
      # décrivait donc une ouverture qui n'existait NULLE PART dans le code.
      # ⛔ `public_days: 3` reste : il gouverne ce que la PAGE PRÉ-GÉNÉRÉE
      # contient, c'est-à-dire ce qu'un robot peut lire. Deux réglages, deux
      # questions — « qui peut demander la profondeur » n'est pas « ce qui est
      # écrit dans le fichier statique ». Les confondre rouvrirait la fuite du
      # lot 101 en croyant fermer une porte.
      # ═══════════════════════════════════════════════════════════════════
      # 🔴🔴🔴 LOT 217 (04/09/2026) — LA GRILLE DESCEND D'UN CRAN, ET `3j` SORT
      # ═══════════════════════════════════════════════════════════════════
      # Preda, 03/09 : « il faut qu'on se débrouille pour avoir sur chaque
      # item 7 j minimum d'historique, donc 7 j / 30 j / 90 j / Max ».
      #
      # ⭐⭐⭐ POURQUOI `3j` NE SE DÉFENDAIT PLUS, ET C'EST UNE MESURE.
      # `prices.csv.gz` est append-on-change : un point est un *changement*,
      # pas un jour. Mesuré le 04/09 sur les 9 354 fiches RÉELLEMENT PUBLIÉES
      # (⛔ pas sur les 14 090 du fichier de prix — ma première mesure comptait
      # la mauvaise population) : l'onglet « 3d » n'avait deux points que sur
      # 3 625 fiches, soit 38,8 %. Le palier d'entrée montrait donc un cadre
      # vide à six visiteurs sur dix. ⇒ Ce n'était pas un libellé à corriger,
      # c'était une promesse que la donnée ne pouvait pas tenir.
      #
      # ⭐ CE QUI LA REND TENABLE : la courbe EN ESCALIER (lot 217), prolongée
      # jusqu'à la dernière OBSERVATION (`vu`, cf. `reserve.mjs`). Un prix
      # inchangé est une donnée. 7 j en escalier couvre 5 995 fiches (64,1 %)
      # aujourd'hui, et ~100 % quand `floor-watch` relèvera toutes les pièces
      # publiées — 3 175 fiches publiées n'ont AUCUNE observation datée.
      #
      # 🔴 ARBITRAGE PREDA DU 04/09 : « 7 j au Membre, tout descend d'un cran ».
      # ⛔ CE N'EST PAS GRATUIT : Crevette était VENDU « sept jours d'historique ».
      # Sa description descend donc à trente jours, et Langouste à quatre-vingt-dix,
      # dans le même commit — sinon `/offre/` vend ce que le manifeste donne.
      # ⚠️ L'ORDRE DU TABLEAU EST L'ORDRE AFFICHÉ.
      # ⚠️ `jours: null` = sans borne. Ce n'est pas « inconnu » : c'est Max.
      # ⛔ `public_days: 3` NE BOUGE PAS. Il gouverne une AUTRE question — ce
      # que la page pré-générée contient, donc ce qu'un robot lit — et les
      # confondre rouvrirait la fuite du lot 101 en croyant aligner deux
      # chiffres qui n'ont jamais mesuré la même chose.
      plages:
        - { cle: '7j',  jours: 7,    tier: member    }
        - { cle: '30j', jours: 30,   tier: crevette  }
        - { cle: '90j', jours: 90,   tier: langouste }
        - { cle: 'max', jours: null, tier: whale     }
    # ═══════════════════════════════════════════════════════════════════════
    # 🔴🔴 LA COTE — LOT 101 (07/08/2026). Arbitrage Preda du 06/08 au soir :
    #     « on peut laisser le prix de drop mais pas le floor price actuel »
    # et du 07/08 : « ATL/ATH derrière le mur, les graphes sans échelle restent
    # publics ».
    # ═══════════════════════════════════════════════════════════════════════
    # CE QU'ELLE FERME, mot pour mot : `floor`, `ath`, `atl`, leurs dates,
    # `prixMedian` et `p95` — la liste vit dans `CHAMPS_COTE` (engine/lib/cote.mjs)
    # et NULLE PART AILLEURS.
    # CE QU'ELLE LAISSE : le prix de DROP (`store_price`), le tirage, la rareté,
    # la date de sortie, le nombre d'offres, les variations en %, et la courbe
    # publique — dont l'échelle a été retirée à la source.
    #
    # ⛔⛔ CETTE PORTE NE SE FRANCHIT PAS AU BUILD, ELLE RETIRE. Les ~8 500 pages
    # sont PRÉ-GÉNÉRÉES : un `<Gate>` y aurait laissé la donnée dans le HTML, dans
    # le JSON-LD et dans le cache de Google. La rendre publique à nouveau ne se
    # fait donc PAS en changeant `tier:` — il faut passer `tiers:` sans `crevette`,
    # ou commenter ce bloc ET relancer un build complet.
    # ═══════════════════════════════════════════════════════════════════════
    # 🔴🔴🔴 LOT 118 (10/08/2026) — OUVERTE AUX MEMBRES, ET C'EST PROVISOIRE
    # ═══════════════════════════════════════════════════════════════════════
    # LA MESURE QUI A FORCÉ CETTE LIGNE. `crevette` se gagne par
    # `abonne_jusqu_a > maintenant` (veveid, `src/avoirs.ts`). Or
    # `ajouterAbonnement()` n'est appelée par PERSONNE dans tout `veveid` — un
    # grep rend une seule ligne : sa propre définition. L'`/admin` ne fait que
    # la LIRE (SELECT). ⇒ AUCUN COMPTE AU MONDE NE POUVAIT DEVENIR CREVETTE, et
    # `/market/` était fermée à 100 % des humains comme à 100 % des robots.
    # ⭐⭐⭐ UNE PROTECTION QUI BLOQUE TOUT LE MONDE N'EST PAS STRICTE, ELLE EST
    # CASSÉE — de l'extérieur, les deux se ressemblent exactement. C'est le
    # circuit ouvert, dans sa forme la plus chère : le côté « qui accorde »
    # n'existait pas.
    #
    # ⛔⛔ CE N'EST PAS UN ARBITRAGE PRODUIT, C'EST UNE BÉQUILLE DATÉE. Preda,
    # 10/08 : ouvrir aux membres en attendant le paiement. Le vrai correctif
    # reste de câbler `ajouterAbonnement()` à l'admin de veveid.
    # ⭐ `provisoire:` N'EST PAS UN COMMENTAIRE, C'EST UNE DONNÉE. Un commentaire
    # ne se mesure pas ; `outils/etat_reel.py` et `test:promesses` lisent ce
    # champ. La démo « temporaire » du 01/08 est restée ouverte jusqu'à devenir
    # une fuite parce que personne ne pouvait la VOIR depuis un banc.
    # 🔴 `test:promesses` CASSE LE BUILD si une porte `provisoire` survit au
    #    jour où `offer.url` se remplit : on ne peut pas vendre un abonnement
    #    pendant qu'on donne ce qu'il achète.
    # ⚠️ `tier: member` ET NON `tiers:` SANS CREVETTE : la porte reste ACTIVE,
    #    donc `projeter()` continue de retirer les prix des 12 380 pages
    #    pré-générées. Changer `tiers:` les REPUBLIERAIT en clair.
    cote:
      binaire: true   # ouvre ou non — la cote ne se tronque pas, elle se donne ou non
      # 🔴🔴🔴 LOT 126 — LA LIGNE `provisoire:` EST RETIRÉE, ET CE N'EST PAS UN
      # NETTOYAGE : C'EST UNE DÉCISION QUI ENTRE DANS LA DONNÉE.
      # Preda, 10/08/2026 : « le market doit être visible une fois qu'on est
      # membre, pas besoin d'avoir un grade payant. »
      # ⭐⭐ `tier: member` n'était donc pas un pis-aller en attendant que
      # `accorderAbonnement()` soit câblée (elle l'est depuis le lot 122) : c'est
      # le réglage voulu. La ligne `provisoire:` affirmait le contraire — elle
      # envoyait « refermer a crevette » — et `test:promesses` la LIT à chaque
      # build. ⛔ Une note périmée qui se cite est pire qu'une note absente :
      # elle donne un ordre, avec l'autorité d'une donnée.
      tier: member
    # Les extrêmes et les modules d'analyse.
    extremes:
      binaire: true   # ouvre ou non — ni troncature ni plafond
      tier: crevette
    modules:
      binaire: true   # ouvre ou non — ni troncature ni plafond
      tier: crevette
    # Les alertes, avec leurs plafonds. 0 pour un membre : il voit le NOM du
    # module, jamais son contenu.
    alerts:
      binaire: true   # ouvre ou non — ni troncature ni plafond
      # 🔔 LOT 215 (03/09/2026) — LA PORTE DESCEND À `member`, ET LA GRILLE
      # CHANGE. Arbitrage Preda du 03/09, posé explicitement parce que la
      # grille 1/10/30/100 traînait dans MES notes sans venir de lui :
      # « passer à 1 / 10 / 30 / 100 ». Un membre gratuit peut donc surveiller
      # UNE pièce — de quoi goûter au produit. ⛔ « 0 alerte » ne vend rien, et
      # une page réservée qui n'autorise rien se lit comme une panne.
      tier: member
      # ⭐⭐ CE QUE CE PLAFOND COMPTE, ET C'EST PREDA QUI L'A NOMMÉ (02/09) :
      # « quand je parle d'une 1 alerte c'est 1 configuration d'alerte ».
      # ⇒ Une ligne de la table `alertes`, c'est-à-dire UNE PIÈCE SURVEILLÉE.
      # ⛔ Ce n'est PAS un nombre de déclenchements, ni un nombre de messages.
      # Le feed porte TOUS les déclenchements — il est tiré, jamais poussé,
      # donc il n'y a rien à y plafonner.
      # ⏳ LE SECOND QUOTA — combien de MESSAGES peuvent joindre quelqu'un —
      # n'existe pas : arbitrage ④ du 03/09, AUCUNE notification pour
      # l'instant. Il reviendra le jour où un canal existera.
      # ✅ LIVRÉ : `/alertes/` (le feed) et `/alertes/reglages/` existent, et
      # `offer.modules` porte `bientot: false`. `test:promesses` vérifie les
      # deux sens de cette affirmation.
      caps:
        member:    1
        crevette:  10
        langouste: 30
        whale:     100
    # Suivre le portefeuille de QUELQU'UN D'AUTRE — réservé au dernier palier.
    wallet_watch:
      binaire: true   # ouvre ou non — ni troncature ni plafond
      tier: whale


# ═══════════════════════════════════════════════════════════════════════════
# BLOG — Sheet dédié + peau vitrine   (03/08/2026, lot 37)
# ═══════════════════════════════════════════════════════════════════════════
# ⚠️ AVANT CE LOT, veveprice n'avait AUCUN bloc `editorial:`. `blog.mjs` le
# disait dans son propre en-tête : « un site sans onglet Blog (veveprice) ».
# Son unique article vient de sites/veveprice/blog/{fr,en}/*.md.
#
# ⭐ `pages: [blog]` NE CRÉE AUCUNE ROUTE. `SECTIONS` d'editorial_pages.mjs vaut
# [glossary, acronyms, annuaire, history, brands] — le blog en est absent
# exprès, « il a son rendu propre ». Cette clé ne pilote que la RÉCOLTE
# (editorial_pull.py) et le journal des langues.
#
# 🔴 ET ELLE NE BASCULE PAS L'ACCUEIL. `src/pages/index.astro` teste :
#     wiki = (content.home === 'editorial')
#         || (editorial.pages.length && !content.data_modules.length)
# veveprice a 3 `data_modules`, donc le second terme est FAUX. Vérifié au build,
# pas déduit : l'accueil reste `Home.astro`.
# ═══════════════════════════════════════════════════════════════════════════
# LE MENU — arbitrage Preda du 03/08/2026 (lot 38)
# ═══════════════════════════════════════════════════════════════════════════
# Dashboard / Marché / Analytics / Blog / Alertes / Vault / Abonnement.
#
# 🔴 QUATRE DE CES SEPT PAGES N'EXISTENT PAS ENCORE — mesuré, pas supposé :
#    /dashboard/, /analytics/, /alertes/, /vault/ ne sont produites par aucune
#    route. Seules /market/, /blog/ et /offre/ le sont.
#
# ⛔ UN LIEN VERS UNE PAGE NON ÉMISE EST UN 404 INVISIBLE AU BUILD : c'est un
#    lien, pas une route, donc rien ne le vérifie. Ce défaut a déjà été payé
#    DEUX FOIS sur ce fichier (le blog dans les langues sans article, /compte/
#    préfixé par `localize`).
#
# ⭐ D'où `pret:`. Une entrée `pret: false` est ÉCRITE ici — l'intention est
#    donc visible, et `etat_reel.py` peut la lire — mais elle n'est PAS émise
#    dans la nav. Le jour où la page existe, on bascule le drapeau : une ligne.
# ⭐⭐ ET `test:routes` REFUSE TOUTE ENTRÉE `pret: true` SANS PAGE PRODUITE.
#    Le 404 invisible devient impossible, au lieu d'être seulement déconseillé.
# ⭐ LOT 104 — `membre: true` : l'entrée est ÉMISE POUR TOUT LE MONDE, dans le
# HTML de toutes les pages, et masquée par `hidden`. Le cookie `vp_membre` la
# rouvre avant la première peinture (règle du <head> de Base.astro).
# ⛔ CE N'EST PAS UN DROIT, ET ÇA NE DOIT PAS EN AVOIR L'AIR. `vp_membre` ne
# porte que « 1 » et se pose à la main depuis la console. Il ne décide ici que
# d'un AFFICHAGE : la page, elle, lit `vp_session` (HttpOnly) côté serveur et
# refuse toute seule. Un lien visible vers une porte fermée ne l'ouvre pas.
nav:
  # 🔴 LOT 104 — L'ENTRÉE RESTE SUR `/`, ET ELLE CESSE DE MENTIR AUTREMENT.
  # Arbitrage Preda du 07/08 : « l'accueil DEVIENT le tableau de bord ». Le
  # commentaire d'origine — « l'accueil fait office de tableau de bord » —
  # n'était donc pas un mensonge, c'était une intention jamais réalisée.
  # ⭐ `membre: true` la rend invisible aux anonymes : un visiteur ne voit plus
  # « Tableau de bord » pointer vers une page d'accroche. Pour un membre, le
  # lien dit vrai — l'accueil affiche son tableau de bord.
  # ⛔ Le module `dashboard` reste `bientot: true` dans `offer.modules` : le
  # bloc existe, les widgets non, et c'est le widget qui se vend.
  # 🔴🔴 LOT 126 — L'ENTRÉE POINTE ENFIN SUR UNE PAGE QUI EXISTE.
  # Elle a pointé sur `/` pendant un mois, sous le commentaire « l'accueil
  # DEVIENT le tableau de bord » (07/08). L'accueil n'est pas devenu un tableau
  # de bord : c'est une page d'accroche, la même pour un membre et pour un
  # anonyme. ⭐⭐⭐ Une entrée de menu qui décrit une INTENTION se lit comme un
  # ÉTAT, et plus personne ne la revérifie — elle a l'air juste.
  - { cle: nav.dashboard, href: /dashboard/, pret: true, membre: true }
  # 🔴 LOT 104 — `nav.movers` REVIENT, réservée aux comptes.
  # Le lot 101 l'avait RETIRÉE (pas passée à `pret: false`) faute d'avoir la
  # nuance : Preda, 07/08 — « pas visible en public, mais quand tu deviens
  # membre du site tu dois la voir ». La voici, avec sa condition.
  - { cle: nav.movers,    href: /market/,    pret: true, membre: true }
  # 🔴 LOT 101 (07/08/2026) — `nav.movers` EST RETIREE, pas passee a `pret: false`.
  # ⭐ La nuance a un sens dans ce fichier : `pret: false` dit « la page arrive »,
  # et `etat_reel.py` le lit comme une intention en attente. Le Market ne revient
  # pas — Preda, 06/08 : « le market ne doit pas être visible en public ». Une
  # entree en attente aurait fait croire a un chantier, et quelqu'un l'aurait
  # rouverte de bonne foi. ⛔ La cle i18n `nav.movers` RESTE dans les cinq
  # dictionnaires : /offre/ et /compte/ nomment encore les modules, et
  # `test:cles` ne dirait le contraire qu'apres un build — c'est la panne du lot 34.
  # ⭐ LOT 68 (05/08/2026) — LES SETS ENTRENT AU MENU, demande de Preda.
  # La page existe depuis toujours (`/collections/`, `Collections.astro`) et
  # l'accueil y renvoyait déjà — elle n'était atteignable QUE par ce lien.
  # ⛔ L'adresse reste `/collections/` : elle est dans les 1 200 adresses
  #    GELÉES. Le libellé « Sets » vit dans `nav.collections` (i18n), le chemin
  #    dans le gel. Renommer le chemin pour qu'il ressemble au libellé casserait
  #    le SEO — c'est exactement ce que le gel protège.
  - { cle: nav.collections, href: /collections/, pret: true  }
  # ❤️ LOT 116 — LES FAVORIS ENTRENT AU MENU. 🔴 LOT 118 — ILS EN SORTENT.
  # Preda, 10/08 : « la page favoris ne doit pas être visible en public, ni se
  # trouver dans le menu ». `membre: true` masque le lien aux anonymes ET la
  # route passe dans ROUTES_COMPTE (astro_routes_compte.mjs) : le lien ET la
  # porte, pas l'un sans l'autre.
  # ⭐⭐⭐ CE QUE ÇA COÛTE, ET IL FAUT LE DIRE : une page rendue à la demande a
  # besoin du serveur. `/favoris/` NE MARCHERA PLUS HORS LIGNE — c'était sa
  # propriété la plus intéressante (lot 116 : statique, `localStorage`, lisible
  # dans un avion). Les favoris eux-mêmes restent dans le navigateur ; c'est
  # l'ACCÈS À LA PAGE qui devient une porte.
  # ⛔ Masquer le lien SANS fermer la route aurait été un AFFICHAGE, pas une
  # porte — la confusion exacte des filtres de sets, où les 910 lignes restent
  # dans le HTML public sous une barre grisée.
  - { cle: nav.favoris,   href: /favoris/,    pret: true, membre: true }
  - { cle: nav.analytics, href: /analytics/,  pret: true  }   # ✅ lot 39 — démo publique + partie abonnée
  - { cle: nav.blog,      href: /blog/,       pret: true  }
  # 🔔 LOT 215 — LES ALERTES ENTRENT AU MENU, ET DERRIÈRE LE MUR EN MÊME TEMPS.
  # `membre: true` masque le lien aux anonymes ET la route passe dans
  # ROUTES_COMPTE (astro_routes_compte.mjs) : le lien ET la porte, jamais l'un
  # sans l'autre. ⛔ Masquer le lien sans fermer la route serait un AFFICHAGE,
  # pas une porte — la confusion exacte des filtres de sets, où la barre est
  # grisée et les 910 lignes sont toujours dans le HTML public.
  # ⚠️ `/alertes/reglages/` N'ENTRE PAS AU MENU, ET C'EST L'ARBITRAGE ② : on
  # vient VOIR le feed ; on règle rarement, et on y arrive depuis le feed.
  - { cle: nav.alerts,    href: /alertes/,    pret: true, membre: true }
  # 📒 LOT 224 — LE CLASSEUR ENTRE AU MENU, ET DERRIÈRE LE MUR EN MÊME TEMPS.
  # `membre: true` masque le lien aux anonymes ET les deux routes passent dans
  # ROUTES_COMPTE : le lien ET la porte, jamais l'un sans l'autre. ⛔ Masquer
  # le lien sans fermer la route serait un AFFICHAGE, pas une porte.
  # ⚠️ DEUX ENTRÉES ET PAS UNE, contrairement à `/alertes/reglages/` qui reste
  # hors menu : ce ne sont pas une page et son réglage, ce sont DEUX produits.
  # On cherche un portefeuille OU un numéro, jamais l'un depuis l'autre.
  - { cle: nav.binder,    href: /classeur/,   pret: true, membre: true }
  - { cle: nav.mint,      href: /mint-hunter/, pret: true, membre: true }
  - { cle: nav.vault,     href: /vault/,      pret: false }   # ⏳ demande un compte
  - { cle: nav.offer,     href: /offre/,      pret: true  }

editorial:
  # ═══════════════════════════════════════════════════════════════════════════
  # 🔑 À REMPLIR PAR PREDA — l'id du Sheet éditorial de VeVePrice
  # ═══════════════════════════════════════════════════════════════════════════
  # L'id est dans l'URL du Sheet, ENTRE `/d/` et `/edit`.
  #
  # ⛔ ET IL NE SUFFIT PAS DE LE COLLER. L'accès passe par un SERVICE ACCOUNT,
  #    pas par le compte Google de Preda : ouvrir le secret GitHub
  #    `GOOGLE_SERVICE_ACCOUNT_JSON`, y lire `client_email` (de la forme
  #    `…@….iam.gserviceaccount.com`) et partager le Sheet avec cette adresse
  #    en LECTEUR. C'est l'étape qu'on oublie, et son symptôme est une récolte
  #    qui échoue tous les matins sans rien dire d'utile.
  #
  # ⚠️ FORME EXIGÉE : `sheet_id: "…"` en début de ligne, AVEC les guillemets.
  #    La garde du workflow (.github/workflows/vevewiki-editorial.yml) reconnaît
  #    cette forme-là ; sans guillemets, elle lira « absent » et sautera le site
  #    en silence apparent — elle le dira, mais dans un avertissement qu'il faut
  #    penser à lire.
  #
  # ⭐ ARBITRAGE PREDA DU 03/08/2026 : UN SHEET PAR SITE, onglets au NOM NU
  #    (`Blog`, `Glossary`…). C'est le défaut de `editorial_pull.py` : aucun
  #    `tabs:` à écrire ici. ⚠️ Le revers est connu et assumé — un partage avec
  #    le service account PAR SITE, et autant d'appels que de sites sur un quota
  #    Sheets PAR MINUTE partagé avec le daily, la réparation et la moisson.
  #    C'est pour ça que le workflow tourne en `max-parallel: 1`.
  #
  # ⛔ TANT QUE CETTE LIGNE EST COMMENTÉE, la récolte ne tourne pas et le blog
  #    reste alimenté par les seuls .md du dépôt. C'est un état SAIN, pas une
  #    panne : rien ne casse, rien n'est inventé, et le workflow le journalise.
  sheet_id: "1fiICkMWiW4OBid43vfSBKcErtYBkXcbRuY3fRv7Rwo0"   # Sheet éditorial veveprice (03/08)
  pages: [blog]
  # ⚠️ Même raison que sur vevewiki : tant que l'onglet Blog n'a aucune ligne,
  # une lecture vide ne doit pas faire échouer la récolte quotidienne.
  allow_empty: [blog]

  # ─────────────────────────────────────────────────────────────────────────
  # LA PEAU — pourquoi ce réglage existe (à lire avant d'y toucher)
  # ─────────────────────────────────────────────────────────────────────────
  # Le blog de la maquette emploie 35 classes. **31 n'existent QUE dans le
  # thème `vitrine`** (mesuré le 03/08) : boite, boites, bloc__os, etiq, carte,
  # sect-t, avec-aside, panneau, filtres, num-s… `encyclopedie` n'en a AUCUNE.
  # ⛔ Porter ce balisage dans le gabarit PARTAGÉ aurait rendu inerte le blog de
  #    vevewiki — 40 pages réelles — pour embellir celui-ci, qui a 1 article.
  # ⭐ `sobre` reste le défaut du réseau : un site qui ne déclare rien ne change
  #    pas de rendu. Seul veveprice demande la peau vitrine.
  blog_skin: vitrine

  labels:
    blog:
      title: { fr: "Blog", en: "Blog" }
      # ⚠️ 70 caractères minimum (audit SEO) : en dessous, Google fabrique son
      # propre extrait. Cf. DESC_MIN dans engine/lib/editorial_pages.mjs.
      description:
        fr: "Ce que les chiffres racontent quand on les regarde de près : chaque article s'appuie sur les relevés du site, avec ses sources."
        en: "What the numbers say when you look closely: every article is built on this site's own price records, sources included."

# ───────────────────────────────────────────────────────────────────────────
# BLOC 3 · REMPLACER le bloc `offer:` — les tarifs vivent ICI
# ───────────────────────────────────────────────────────────────────────────
# ⭐ UN TARIF ÉCRIT EN DUR DANS UN GABARIT EST UN TARIF QU'ON OUBLIERA DE
# CHANGER. Et deux tarifs différents sur deux pages ne coûtent pas une
# correction, ils coûtent un litige. `/offre/` lit ce bloc, jamais l'inverse.

offer:
  # ⛔ TANT QUE CETTE URL EST VIDE, AUCUN APPEL À L'ACTION N'EST AFFICHÉ.
  # C'est délibéré : /offre/ et /compte/ testent tous deux `offer.url` et
  # remplacent le bouton par « les abonnements ouvrent bientôt ».
  # Un bouton qui ne mène nulle part coûte plus cher en confiance qu'il ne
  # rapporte en promesse.
  # ✅ REMPLIE AU LOT 200 (25/08/2026) — LA CAISSE EXISTE.
  # Elle allume TROIS endroits d'un coup, et c'est ce qu'on voulait :
  # `Offre.astro` (les cartes), `BarreAcces.astro` (le bandeau) et
  # `Dashboard.astro` (`const caisse = Boolean(manifest().offer?.url)`).
  # ⛔ ELLE POINTE VERS `/compte/`, PAS VERS UNE PAGE `/caisse/`. Une route de
  #   compte se déclare à SEPT endroits dans ce réseau, dont un hors dépôt
  #   (Cloudflare) ; `/compte/` est déjà déclarée partout. L'ancre `#caisse`
  #   amène directement à la section d'achat.
  # ⚠️ LA CAISSE NE S'OUVRE PAS POUR AUTANT : la section exige EN PLUS que
  #   `CAISSE_ADRESSE` soit posée sur le serveur. Cette URL dit « il y a un
  #   endroit où payer », pas « le paiement fonctionne » — les deux se règlent
  #   séparément, et c'est voulu : le jour où l'adresse change, aucun fichier
  #   du dépôt ne bouge.
  url: "/compte/#caisse"

  # 🔴🔴 LOT 114 — LA REMISE FAIT 1/6, ET CE N'EST PAS UN CHIFFRE ESTHÉTIQUE.
  # Arbitrage Preda du 10/08 : « 5/15/30 $ est le prix ANNUEL, le plus bas doit
  # être 5 $/mois ». Les prix de `plans` ci-dessous sont donc l'ANNUEL
  # mensualisé ; le mensuel s'en déduit : `annuel / (1 - remise)`.
  #   remise 0,20 → mensuel 6,25 / 18,75 / 37,50  ⛔ trois décimales à afficher
  #   remise 1/6  → mensuel 6 / 18 / 36           ✅ rond des DEUX côtés
  # ⭐ On choisit la remise pour que les deux colonnes soient lisibles, pas
  # l'inverse. Un tarif à 18,75 $ se lit comme un piège ; 18 $ se lit.
  annual_discount: 0.16667   # ≈ −16,7 % à l'année (1/6) — 2 mois offerts sur 12

  # ⚠️ `cle` DOIT correspondre à un palier de `access.tiers`. Un plan dont le
  # palier n'existe pas serait vendu pour une porte qui ne s'ouvrira jamais :
  # /offre/ filtre donc sur `tiers`, et un plan orphelin disparaît en silence.
  # ⭐ C'est le bon comportement — mieux vaut ne pas vendre que mal vendre.
  # ⚠️ `d` EST UNE CARTE PAR LANGUE, comme `site.tagline` et `site.description`.
  # Une chaîne nue ici sortait du FRANÇAIS sur la page anglaise, en production,
  # et aucun banc ne le voyait. ⭐ Dans un dépôt multilingue, tout texte destiné
  # à être lu est soit une clé i18n, soit une carte par langue — jamais une
  # chaîne nue. ⭐ `nom` reste une chaîne : « Crevette » est un nom de MARQUE,
  # il ne se traduit pas. La distinction est éditoriale, pas grammaticale.
  plans:
    # ═══════════════════════════════════════════════════════════════════════
    # 🔴 LOT 104 (07/08/2026) — LES TARIFS PASSENT À 5 / 15 / 30 $
    # ═══════════════════════════════════════════════════════════════════════
    # Ils remplacent 15 / 35 / 50. ⛔ AUCUN N'EST ENCAISSABLE : `offer.url` est
    # vide, il n'y a pas de prestataire de paiement, et c'est tranché (« plus
    # tard, avec tes recommandations »). Ce bloc pose la GRILLE.
    # ⭐ Les descriptions ne décrivent QUE ce qui existe. Ce qui n'existe pas
    # est nommé dans `offer.modules` avec `bientot: true`, à un seul endroit —
    # une description libre qui promet un module absent échapperait au banc.
    - cle: member
      nom:
        fr: "Membre"
        en: "Member"
        es: "Miembro"
        de: "Mitglied"
        it: "Membro"
      prix: 0
      alertes: 1
      d:
        fr: "Sept jours d'historique, la page Market, les fiches complètes."
        en: "Seven days of history, the Market page, the full records."
        es: "Siete días de historial, la página Market, las fichas completas."
        de: "Sieben Tage Historie, die Market-Seite, die vollständigen Blätter."
        it: "Sette giorni di storico, la pagina Market, le schede complete."
    - cle: crevette
      nom:
        fr: "Crevette"
        en: "Shrimp"
        es: "Gamba"
        de: "Garnele"
        it: "Gambero"
      prix: 5
      alertes: 10
      d:
        fr: "Trente jours d'historique, le prix plancher, les extrêmes."
        en: "Thirty days of history, the floor price, the extremes."
        es: "Treinta días de historial, el precio mínimo, los extremos."
        de: "Dreißig Tage Historie, der Bodenpreis, die Extreme."
        it: "Trenta giorni di storico, il prezzo minimo, gli estremi."
    - cle: langouste
      nom:
        fr: "Langouste"
        en: "Lobster"
        es: "Langosta"
        de: "Languste"
        it: "Aragosta"
      prix: 15
      alertes: 30
      d:
        fr: "Quatre-vingt-dix jours d'historique, et trente alertes."
        en: "Ninety days of history, and thirty alerts."
        es: "Noventa días de historial, y treinta alertas."
        de: "Neunzig Tage Historie, und dreißig Warnungen."
        it: "Novanta giorni di storico, e trenta avvisi."
    - cle: whale
      nom:
        fr: "Whale"
        en: "Whale"
        es: "Ballena"
        de: "Wal"
        it: "Balena"
      prix: 30
      alertes: 100
      d:
        fr: "L'historique sans borne, cent alertes, le suivi de portefeuilles."
        en: "History with no limit, one hundred alerts, wallet watching."
        es: "El historial sin límite, cien alertas, el seguimiento de carteras."
        de: "Historie ohne Grenze, hundert Warnungen, Wallet-Beobachtung."
        it: "Storico senza limiti, cento avvisi, il monitoraggio dei portafogli."

  # ═════════════════════════════════════════════════════════════════════════
  # 🔴🔴 LE CATALOGUE DES MODULES — LOT 104, ET C'EST LE BLOC SENSIBLE
  # ═════════════════════════════════════════════════════════════════════════
  # ARBITRAGE PREDA DU 07/08 : la page d'offre annonce TOUS les modules, y
  # compris ceux qui n'existent pas, avec une pastille « bientôt ». Pris contre
  # mon avis, et appliqué — mon objection est celle de son propre brief : « un
  # palier qui promet un module absent est une promesse rompue PAYANTE ».
  #
  # ⭐ CE QUI LA DÉSAMORCE AUJOURD'HUI : `offer.url` est VIDE. Rien n'est
  # vendable, donc rien n'est promis contre de l'argent. Une feuille de route
  # affichée n'est pas une promesse rompue.
  # ⭐⭐⭐ CE QUI LA RÉARMERA : le jour où un prestataire est branché,
  # `offer.url` se remplit et la même page devient exactement ce que le brief
  # interdit — sans qu'une ligne ait changé ici. Un avertissement écrit ne
  # survit pas à ça (mesuré quatre fois sur ce dépôt).
  # ⇒ `npm run test:promesses` REFUSE le build si `offer.url` est renseigné
  #   alors qu'un module `bientot: true` est attribué à un palier PAYANT.
  #   Pour ouvrir la vente : livrer le module, ou le descendre à `member`, ou
  #   le retirer d'ici. Trois sorties, toutes honnêtes, aucune silencieuse.
  #
  # ⚠️ `porte:` et `palier:` s'excluent. `porte:` délègue à la matrice d'accès
  # (source unique, engine/lib/access.mjs) ; `palier:` sert aux modules qui ne
  # sont pas des portes du moteur. Déclarer les deux LÈVE au build.
  # ⚠️ `bientot: true` sans guillemets. `"false"` est une CHAÎNE, donc vrai en
  # JavaScript — `catalogueModules()` ne teste que `=== true` pour cette raison.
  modules:
    # ── CE QUI EXISTE ET TOURNE ──────────────────────────────────────────
    - { cle: price_history, porte: price_history, bientot: false }
    - { cle: cote,          porte: cote,          bientot: false }
    - { cle: extremes,      porte: extremes,      bientot: false }
    - { cle: modules,       porte: modules,       bientot: false }
    # ⭐ Le Market revient au lot 104, réservé aux comptes. Il EXISTE : sa page
    # est rendue à la demande et ses montants viennent de /api/cote/lot.
    - { cle: market,        palier: member,       bientot: false }
    - { cle: metadata,      palier: member,       bientot: false }
    # ── CE QUI N'EXISTE PAS — mesuré sur le dépôt le 07/08/2026 ───────────
    # ⛔ Chaque ligne ci-dessous est une page ou un moteur ABSENT. Elles sont
    # affichées sur /offre/ avec une pastille, sur décision de Preda, et le
    # banc les empêche de devenir vendables.
    # 🔴🔴 LOT 131 — DEUX LIGNES CHANGENT, ET AUCUNE N'EST UN AJUSTEMENT
    # D'HUMEUR : les deux étaient FAUSSES, et mesurées comme telles le 10/08.
    #
    # ① `dashboard` : `palier: crevette` ↔ le code dit `member`.
    #    `src/pages/dashboard/index.astro` teste `connecte()` SEUL — pas
    #    `franchit()` — depuis le lot 126, et le commentaire y explique
    #    pourquoi : « exiger un palier fermerait la page d'arrivée à un membre
    #    qui vient de s'inscrire ». Le manifeste annonçait donc, sur /offre/, un
    #    module payant que le site donne gratuitement. ⭐ Ce n'est pas une fuite,
    #    c'est pire commercialement : on FACTURE une chose qu'on offre déjà, et
    #    seul un lecteur des deux fichiers à la fois pouvait le voir.
    # ② `bientot` passe à `false` : les widgets EXISTENT depuis ce lot. Le
    #    commentaire « coquille livrée au 104, sans widget » était vrai et a
    #    cessé de l'être dans le même commit — *un commentaire qui décrit l'état
    #    d'avant se lit comme une spécification.*
    - { cle: dashboard,     palier: member,       bientot: false }
    # 🔔 LOT 215 — LIVRÉ. ⛔ `bientot: false` n'est PAS une déclaration
    #   d'intention : `test:promesses` §4 ouvre le disque et exige
    #   `src/pages/alertes/index.astro`. Il refuse aussi l'inverse — déclarer
    #   « en attente » un module dont la page existe.
    - { cle: alerts,        porte: alerts,        bientot: false }
    - { cle: wallet_watch,  porte: wallet_watch,  bientot: true }   # /vault/ absente
    # 🔴 LOT 131 — « rien nulle part » ÉTAIT VRAI AU 07/08, ET FAUX DEPUIS LE 119.
    # Mesuré : `/favoris/` a sa page (`src/pages/favoris/index.astro`), son
    # entrée dans `ROUTES_COMPTE`, sa `location` dans `nginx.server.conf` et un
    # banc qui la réclame (`test:pages`) — les trois endroits d'une route de
    # compte, plus le quatrième. Le cœur est sur 1 220 cartes depuis le 126.
    # ⭐⭐ Une note périmée qui se cite est pire qu'une note absente : celle-ci
    # affichait « bientôt » sur /offre/ à côté d'un module livré depuis trois
    # lots, et elle a survécu à onze lots parce que rien ne la MESURAIT.
    - { cle: favoris,       palier: member,       bientot: false }
    - { cle: mcp,           palier: crevette,     bientot: true }   # mcpPoints() existe, aucune page — et daily_mcp_points est connue FAUSSE
    - { cle: mint,          palier: crevette,     bientot: true }   # dépend de token_id, donc de la fin du scan (~08/08)
    - { cle: sanspub,       palier: crevette,     bientot: true }   # ⛔ aucun système de publicité : « sans pub » suppose d'en poser d'abord

