# ⚠️ VeVePreda/veve-sites — sites/veveprice/manifest.yml
site:
  domain: veveprice.com
  brand: "VeVe Price"
  tagline:
    en: "Price history and floor tracker for VeVe collectibles"
    fr: "Historique de prix et floor des collectibles VeVe"
    es: "Historial de precios y precio mínimo de los coleccionables VeVe"
    de: "Preisverlauf und Bodenpreise für VeVe-Sammelobjekte"
  description:
    en: "Track the floor price and price history of every VeVe collectible: moves, all-time highs and lows, number of listings."
    fr: "Suivez le prix plancher et l'historique des collectibles VeVe : évolution, plus hauts, plus bas, nombre d'offres."
    es: "Sigue el precio mínimo y el historial de los coleccionables VeVe: evolución, máximos, mínimos y ofertas."
    de: "Verfolge Bodenpreis und Preisverlauf jedes VeVe-Sammelobjekts: Entwicklung, Höchst- und Tiefststände, Angebote."

# --- Langues : anglais par defaut, les autres en sous-dossier (/fr/, /es/, /de/)
languages:
  default: en
  active: [en, fr, es, de]

rendering: server          # static | server
features:
  search: internal
  comments: false
  database: false

# --- Vitrine publique : on ne publie QUE des pages utiles -------------------
publication:
  # Feuille des adresses de comics : rarity | name | issue-rarity
  #   rarity       -> /comics/alias-1-2001/secret-rare/
  #   name         -> /comics/<serie>/<nom de la couverture>/
  #   issue-rarity -> /comics/<serie>/<numero>/<rarete>/     <-- 28/07/2026
  # ⭐ `issue-rarity` est la hierarchie de VeVe lui-meme (celle qu'affichent
  # CollectScan et StackR) : une SERIE contient des NUMEROS, un numero existe
  # en plusieurs RARETES. Les deux modes a DEUX niveaux s'effondrent des que la
  # serie devient une vraie serie — mesure sur les 16 536 comics reels :
  #   serie + rarete          4 738 cles · 14 452 uuid en collision
  #   nom seul                4 253 cles · 16 142 en collision
  #   serie + numero + rarete 16 119 cles ·    726 en collision
  # En cas de collision (couvertures VARIANTES d'un meme numero), le nom de la
  # couverture est ajoute ; l'identifiant court n'arrive qu'en dernier recours.
  comic_leaf: issue-rarity
  # ⭐⭐ ARME LE 29/07/2026 — les adresses de ce site sont GELEES par
  # sites/veveprice/slugs.json (1 200 fiches, gelees le 29/07/2026). A partir
  # d'ici, un build qui PERDRAIT la table echoue au lieu de republier en
  # silence des adresses recalculees (engine/tools/test_renommage.mjs, appele
  # par le Dockerfile). Ne jamais repasser a false : ce serait rendre a
  # nouveau flottantes les 1 200 URL deja publiees.
  adresses_gelees: true
  min_price_points: 8      # relevés minimum AU TOTAL pour qu'une fiche mérite d'exister
  # ⚠️ `public_points_max` et `public_history_days` ont MIGRÉ vers `access:`
  # (voir plus bas) le 20/07/2026 : ce sont des réglages d'ACCÈS, pas de
  # publication. Un quota de vitrine décide QUELLES fiches existent ; un palier
  # décide CE QU'ON MONTRE d'une fiche qui existe. Les laisser ici en double
  # ferait échouer le build volontairement — c'est le garde-fou.

  # ⭐ TAILLE DE LA VITRINE, PAR TYPE (remplace l'ancien plafond global unique).
  # Ce plafond unique avait produit un angle mort mesuré en prod : les comics
  # sont 86 % du catalogue et représentaient 0 % du site, évincés par les
  # collectibles que le backfill densifie plus vite.
  # ⚠️ C'est une TAILLE CIBLE, pas un débit : les fiches déjà gelées comptent
  # dedans. L'ensemble publié est collant (slugs.json) -> relever ces nombres
  # est IRRÉVERSIBLE. Monter par paliers, en s'appuyant sur la Search Console.
  quotas:
    collectible: 800
    comic: 400
  quota_spillover: true    # un type qui ne remplit pas sa part cède ses places à l'autre
  max_new_per_series: 12   # diversité : nouvelles fiches max par série (0 = pas de plafond)

# --- Niveaux d'accès -------------------------------------------------------
# ⭐ LE PALIER EST UNE DONNÉE. Aucune page ne teste un palier, aucune page ne
# lit un plafond : tout passe par engine/lib/access.mjs. Un site 100 % gratuit,
# 100 % payant ou mixte, c'est le MÊME code — seul ce bloc change.
#
# Pour un site entièrement gratuit, il suffit d'écrire :
#     access:
#       tiers: [visitor]
# Les portes exigeant un palier absent se DÉSACTIVENT : plus aucune troncature,
# plus aucun appel à l'action fantôme, et pas une ligne de code conditionnel.
access:
  tiers: [visitor, member, crevette, langouste, whale]
  gates:
    # L'historique : 3 jours pour qui ne paie pas (arbitrage Preda du 30/07).
    price_history:
      tier: crevette
      public_max: 30       # relevés RÉELLEMENT exposés
      public_days: 3       # ⭐ 3 jours, pas 90 : c'est la profondeur qui se vend
    # Les extrêmes et les modules d'analyse.
    extremes:
      tier: crevette
    modules:
      tier: crevette
    # Les alertes, avec leurs plafonds. 0 pour un membre : il voit le NOM du
    # module, jamais son contenu.
    alerts:
      tier: crevette
      caps:
        member:    0
        crevette:  2
        langouste: 10
        whale:     -1     # -1 = illimité
    # Suivre le portefeuille de QUELQU'UN D'AUTRE — réservé au dernier palier.
    wallet_watch:
      tier: whale


# ───────────────────────────────────────────────────────────────────────────
# BLOC 3 · REMPLACER le bloc `offer:` — les tarifs vivent ICI
# ───────────────────────────────────────────────────────────────────────────
# ⭐ UN TARIF ÉCRIT EN DUR DANS UN GABARIT EST UN TARIF QU'ON OUBLIERA DE
# CHANGER. Et deux tarifs différents sur deux pages ne coûtent pas une
# correction, ils coûtent un litige. `/offre/` lit ce bloc, jamais l'inverse.

offer:
  # ⛔ TANT QUE CETTE URL EST VIDE, AUCUN APPEL À L'ACTION N'EST AFFICHÉ.
  # C'est délibéré : /offre/ et /compte/ testent tous deux `offer.url` et
  # remplacent le bouton par « les abonnements ouvrent bientôt ».
  # Un bouton qui ne mène nulle part coûte plus cher en confiance qu'il ne
  # rapporte en promesse.
  url: ""            # <-- Discord, page d'attente, ou prestataire de paiement

  annual_discount: 0.20    # −20 % à l'année

  # ⚠️ `cle` DOIT correspondre à un palier de `access.tiers`. Un plan dont le
  # palier n'existe pas serait vendu pour une porte qui ne s'ouvrira jamais :
  # /offre/ filtre donc sur `tiers`, et un plan orphelin disparaît en silence.
  # ⭐ C'est le bon comportement — mieux vaut ne pas vendre que mal vendre.
  plans:
    - cle: member
      nom: "Membre"
      prix: 0
      alertes: 0
      d: "Le nom de chaque module, la vitrine libre, les trois derniers jours."
    - cle: crevette
      nom: "Crevette"
      prix: 15
      alertes: 2
      d: "L'historique complet, les extrêmes, les modules d'analyse."
    - cle: langouste
      nom: "Langouste"
      prix: 35
      alertes: 10
      d: "Tout Crevette, plus dix alertes et les exports."
    - cle: whale
      nom: "Whale"
      prix: 50
      alertes: -1        # ⚠️ -1 = ILLIMITÉ. Les gabarits le traduisent en « ∞ » :
                         # afficher « -1 alerte » sur une page de tarifs est le
                         # genre de bug qui se voit depuis la rue.
      d: "Alertes illimitées et suivi de portefeuilles tiers."

legal_info:
  contact: "contact@veveprice.com"   # <-- à activer via Cloudflare Email Routing (gratuit)
  host: "Hostinger International Ltd, 61 Lordou Vironos Street, 6023 Larnaca, Chypre"
  updated: "2026-07-18"

# --- Liens de l'équipe (visibles dès le départ) ----------------------------
links:
  team: []                 # - { label: "Discord", url: "https://..." }
  affiliate: []            # - { label: "...", url: "https://...", sponsored: true }

identity:
  # ⛔ PLUS `aurora`. aurora code ses filets en blanc semi-transparent
  # (#ffffff12) : ils existent sur fond sombre et DISPARAISSENT sur fond clair,
  # sans qu'aucun build ne s'en plaigne. `vitrine` ne pose que des variables,
  # donc il bascule par construction.
  theme: vitrine

  # ⭐ LA PALETTE DE BASE EST LA SOMBRE — c'est l'identité de VeVe Price, et
  # c'est celle qui a été dessinée, mesurée et validée. Les gris viennent de
  # l'application VeVe d'origine, relevés à la pipette, pas approximés.
  palette:
    primary: "#10CEF2"   # le cyan VeVe — porte les LIENS et l'état actif
    accent:  "#3EC875"   # hausse
    danger:  "#ED9BA6"   # baisse
    bg:      "#1A1A1A"   # le gris VeVe d'époque
    surface: "#2C2C2C"
    text:    "#FFFFFF"
    muted:   "#B1B1B1"   # mesuré 5,42:1 sur #1A1A1A — passe AA en texte courant

  # Le pendant clair. ⚠️ CHAQUE valeur en dur d'un thème doit avoir son pendant,
  # sinon la bascule laisse des trous invisibles au build.
  # ⭐ Le vif de VeVe échoue en TEXTE sur clair (le cyan tombe à 1,38:1) mais
  # réussit en APLAT avec une encre sombre. C'est pourquoi `primary` s'assombrit
  # ici : il sert de couleur de lien, donc de texte.
  palette_nuit:
    primary: "#0A7A90"   # cyan assombri — 4,73:1 sur #FFFFFF
    accent:  "#096E38"
    danger:  "#B01F32"
    bg:      "#EFEFEF"
    surface: "#FFFFFF"
    text:    "#1A1A1A"
    muted:   "#5E5E5E"

  fonts:
    # ⛔ NE PAS charger ces fontes depuis Google Fonts. Deux raisons :
    #   1. deux résolutions DNS + deux TLS dans le chemin critique du 1er rendu ;
    #   2. RGPD — fonts.gstatic.com transmet l'IP du visiteur à Google.
    # Elles doivent être auto-hébergées dans public/fonts/ (sous-ensemble latin,
    # woff2, preload, font-display:swap). Tant que ce n'est pas fait, le repli
    # système ci-dessous s'applique et le site reste correct.
    heading: "'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    body:    "'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"


# ───────────────────────────────────────────────────────────────────────────
# BLOC 2 · REMPLACER le bloc `access:` (lignes 80-86 au 30/07)
# ───────────────────────────────────────────────────────────────────────────
#
# ⭐ LE PALIER EST UNE DONNÉE. Aucune page ne teste un palier, aucune page ne
# lit un plafond : tout passe par engine/lib/access.mjs. C'est ce qui permet
# d'ajouter trois paliers sans toucher une ligne de gabarit.
#
# ⚠️⚠️ CE BLOC ARME DES PORTES QUI N'ONT PAS ENCORE DE PORTIER.
# Il n'existe aujourd'hui NI page d'inscription, NI page de connexion, NI
# paiement. Déclarer crevette/langouste/whale rend visibles des appels à
# l'action dont la destination n'existe pas.
# ⛔ Donc : `offer.url` doit pointer quelque part AVANT le déploiement. Tant
# qu'il est vide, mettre une page d'attente ou un lien Discord — un bouton qui
# ne mène nulle part coûte plus cher en confiance qu'il ne rapporte en promesse.

analytics:
  provider: umami
  website_id: "f5e7b44c-bdc7-4793-b30e-1bc40fe7db87"

seo:
  title_template: "%s | VeVe Price"
  indexnow_key: "8f3c1b7a92d54e6fa0c7b5e214d83f60"   # cle publique IndexNow (Bing/Yandex)

content:
  data_modules: [item_price_pages, collection_index, movers, rarity_index]
