site:
  domain: veveprice.com
  brand: "VeVe Price"
  tagline: "Historique de prix et floor des collectibles VeVe"
  description: "Suivez le prix plancher et l'historique des collectibles VeVe : évolution, plus hauts, plus bas, nombre d'offres."
  lang: fr

rendering: static          # static | server
features:
  search: internal
  comments: false
  database: false

# --- Vitrine publique : on ne publie QUE des pages utiles -------------------
publication:
  min_price_points: 8      # relevés minimum AU TOTAL pour qu'une fiche mérite d'exister
  public_points_max: 30    # nb de relevés RÉELLEMENT exposés (le reste = offre membre)
  public_history_days: 90  # plafond de date supplémentaire (ignoré s'il vide la courbe)
  max_items: 400           # taille de la vitrine (0 = illimité)

# --- Offre payante (l'historique complet, les alertes, le détail) ----------
offer:
  teaser: "historique complet, alertes et données détaillées"
  cta: "Accès membre"
  url: ""                  # <-- à compléter (lien Discord / page d'offre)

# --- Mentions obligatoires -------------------------------------------------
legal:
  not_affiliated: "Site indépendant, non affilié à VeVe / ECOMI."
  not_financial_advice: "Information à but documentaire. Ceci n'est pas un conseil en investissement."

# --- Liens de l'équipe (visibles dès le départ) ----------------------------
links:
  team: []                 # - { label: "Discord", url: "https://..." }
  affiliate: []            # - { label: "...", url: "https://...", sponsored: true }

identity:
  theme: aurora
  palette:
    primary: "#4f8cff"
    accent: "#22c55e"
    danger: "#f43f5e"
    bg: "#0b0e14"
    surface: "#141a24"
    text: "#e6edf7"
    muted: "#94a3b8"
  fonts:
    heading: "system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
    body: "system-ui, -apple-system, Segoe UI, Roboto, sans-serif"

seo:
  title_template: "%s | VeVe Price"

content:
  data_modules: [item_price_pages, collection_index, movers, rarity_index]
