# =============================================================================
#  Manifeste du site  VEVEWIKI  — l'encyclopédie VeVe indépendante.
#  ⚠️ VeVePreda/veve-sites — sites/vevewiki/manifest.yml
#
#  1er site à utiliser le CONSTRUCTEUR ÉDITORIAL générique (bloc `editorial:`).
#  100 % GRATUIT : `access.tiers: [visitor]`, aucune porte -> aucune troncature.
#  ⚠️ À CONFIRMER par Preda : `domain` (supposé vevewiki.com) et le `sheet_id`
#  (repris de bible/architecture-generateur-sites.md).
# =============================================================================
site:
  domain: vevewiki.com
  brand: "VeVe Wiki"
  # ⚠️ ES / IT / DE : le wiki n'y publie AUJOURD'HUI que le glossaire et les
  # acronymes (cf. bloc `languages`). Ces deux textes ne promettent donc PAS les
  # marques, les créateurs ni la chronologie — annoncer dans un extrait Google
  # une rubrique que la page ne porte pas est le meilleur moyen de faire
  # repartir un visiteur. Ils restent vrais le jour où les autres sections
  # arriveront : ils citent, ils n'énumèrent pas.
  tagline:
    en: "The independent VeVe reference wiki — collectibles, comics & community knowledge."
    fr: "Le wiki de référence indépendant de VeVe — collectibles, comics & savoir communautaire."
    es: "La enciclopedia VeVe independiente — el saber de los coleccionistas, verificado y fechado."
    it: "L'enciclopedia VeVe indipendente — il sapere dei collezionisti, verificato e datato."
    de: "Die unabhängige VeVe-Enzyklopädie — Sammlerwissen, geprüft und mit Datum."
  # --- DEVISE, traduite. Rendue par EditorialHome.astro sous le titre. -------
  # ⚠️ Volontairement ABSENTE de la barre du haut : sur un écran de 360 px elle
  # serait tronquée, et l'accueil est le seul endroit où une devise se lit.
  # Une langue sans devise n'affiche rien : on n'invente pas un repli anglais.
  devise:
    en: "Knowledge, connected"
    fr: "Le savoir, relié"
    es: "El saber, conectado"
    it: "Il sapere, collegato"
    de: "Wissen, verbunden"
  description:
    en: "The independent VeVe encyclopedia: glossary, acronyms, brands, creators and the full timeline of VeVe history."
    fr: "L'encyclopédie VeVe indépendante : glossaire, acronymes, marques, créateurs et toute la chronologie de VeVe."
    es: "La enciclopedia VeVe independiente: el glosario del coleccionista y las siglas de VeVe, definidos en claro y con su fuente."
    it: "L'enciclopedia VeVe indipendente: il glossario del collezionista e le sigle di VeVe, spiegati in modo chiaro e con la fonte."
    de: "Die unabhängige VeVe-Enzyklopädie: das Sammler-Glossar und die VeVe-Abkürzungen, klar erklärt und jeweils mit Quelle."

# --- Langues : EN pivot, les autres en sous-dossier (/fr/, /es/, /it/, /de/) ---
#
# ⭐⭐ `active` NE VEUT PAS DIRE « tout le site sort dans cette langue ».
# C'est la liste des langues CANDIDATES. Le moteur (engine/lib/langues.mjs)
# mesure, section par section, la part réellement traduite dans les snapshots
# du Sheet, et ne publie que ce qui atteint `seuil_traduction`. Au 28/07/2026 :
#     glossary  87/87  ·  acronyms  65/65   -> publiés en es, it, de
#     brands · history · annuaire · blog     -> en/fr seulement (0 % ailleurs)
# Il n'y a donc RIEN à changer ici le jour où une section est traduite : elle
# apparaîtra d'elle-même au build suivant, et le journal l'annoncera.
# ⛔ Ne PAS baisser le seuil pour « ouvrir » une langue : une page à moitié
# traduite est une page qui ment sur son `<html lang>`, et le repli anglais est
# invisible — c'est le défaut par repli du 27/07, en cinq langues cette fois.
languages:
  default: en
  active: [en, fr, es, it, de]
  seuil_traduction: 1

rendering: static           # un wiki = tout pré-généré, aucun serveur

features:
  # ✅ REPASSÉ À `internal` LE 30/07/2026 — exactement à la condition posée par
  # le commentaire d'origine, conservé ci-dessous parce qu'il dit POURQUOI la
  # valeur avait été mise à `none` :
  #
  #   « `internal` ANNONÇAIT une recherche qui n'existe pas ici : l'accueil
  #     éditorial ne rend aucune boîte, et `search-index.json` renvoie `[]` tant
  #     que le site n'a pas de prix — mais les 32 pages publiaient quand même un
  #     `SearchAction` dans leurs données structurées. On ne promet plus à Google
  #     une fonction absente. À repasser à `internal` le jour où l'index couvrira
  #     le contenu éditorial (glossaire, acronymes, marques, jalons, articles). »
  #
  # L'index couvre désormais l'éditorial : 1 074 entrées
  # (en 309 · fr 309 · es/it/de 152), 4,4 Ko gzippés.
  # ⛔ CETTE LIGNE NE TIENT PAS SEULE. Elle suppose quatre choses déjà posées :
  #   • src/pages/search-index.json.js indexe l'éditorial ;
  #   • engine/lib/features.mjs accepte une source éditoriale ;
  #   • src/components/pages/EditorialHome.astro rend la boîte ;
  #   • engine/i18n/*.json portent search.placeholderWiki / hint / noResult.
  # La remettre à `none` sans retirer la boîte est sans danger ; l'inverse
  # recrée le défaut du 27/07.
  search: internal
  comments: false
  database: false

# --- CONSTRUCTEUR ÉDITORIAL (le cœur de vevewiki) ---------------------------
# Ces pages sont générées depuis le Sheet éditorial (récolté par editorial_pull.py
# -> sites/vevewiki/editorial/*.json) puis rendues par engine/lib/editorial.mjs +
# src/components/pages/Editorial.astro. Un site n'active QUE ce qu'il liste ici.
editorial:
  sheet_id: "1TJLGK4i6a7-UPQYNdTqLPCAjyqQ5NdSxoA8gju8-DjI"   # Sheet éditorial vevewiki (27/07)
  pages: [glossary, acronyms, annuaire, history, brands, blog]
  # BLOG ACTIVÉ le 27/07/2026. Source HYBRIDE (engine/lib/blog.mjs) :
  #   • onglet `Blog` du Sheet  -> sites/vevewiki/editorial/blog.json (corps en
  #     Markdown dans la colonne `body`, une LIGNE PAR LANGUE, `Publish` = date
  #     de sortie : un article daté du futur sort tout seul le jour dit) ;
  #   • fichiers longs          -> sites/vevewiki/blog/<langue>/<slug>.md.
  # À (langue, slug) identique, le fichier .md du dépôt l'emporte sur le Sheet.
  # ⚠️ `allow_empty` : tant que l'onglet Blog n'a aucune ligne, une lecture vide
  # ne doit PAS faire échouer la récolte quotidienne (règle « vide = échec »
  # d'editorial_pull.py). À retirer quand le blog sera durablement alimenté.
  allow_empty: [blog]
  # publish_default: published            # défaut : publié sauf publie=FAUX
  labels:
    blog:
      title: { en: "Articles", fr: "Articles" }
      # ⚠️ 70 caractères minimum (audit SEO) : en dessous, Google n'affiche pas
      # la description et fabrique son propre extrait. Cf. DESC_MIN dans
      # engine/lib/editorial_pages.mjs — le build journalise tout écart.
      description:
        en: "Long-form articles on VeVe: the history of the platform, how drops and rarity work, the licences, and how to read the market without guessing."
        fr: "Les articles de fond sur VeVe : l'histoire de la plateforme, le fonctionnement des drops et de la rareté, les licences, et comment lire le marché."

# --- Vitrine : un wiki publie tout son contenu utile (pas de mur) -----------
publication:
  # Feuille des adresses de comics : rarity | name | issue-rarity
  #   rarity       -> /comics/alias-1-2001/secret-rare/
  #   name         -> /comics/<serie>/<nom de la couverture>/
  #   issue-rarity -> /comics/<serie>/<numero>/<rarete>/     <-- 28/07/2026
  # ⭐ `issue-rarity` est la hierarchie de VeVe lui-meme (celle qu'affichent
  # CollectScan et StackR) : une SERIE contient des NUMEROS, un numero existe
  # en plusieurs RARETES. Les deux modes a DEUX niveaux s'effondrent des que la
  # serie devient une vraie serie — mesure sur les 16 536 comics reels :
  #   serie + rarete          4 738 cles · 14 452 uuid en collision
  #   nom seul                4 253 cles · 16 142 en collision
  #   serie + numero + rarete 16 119 cles ·    726 en collision
  # En cas de collision (couvertures VARIANTES d'un meme numero), le nom de la
  # couverture est ajoute ; l'identifiant court n'arrive qu'en dernier recours.
  comic_leaf: issue-rarity
  # ⭐⭐ ARME LE 29/07/2026 — sites/vevewiki/slugs.json existe (1 200 fiches,
  # gelees le 29/07/2026). ⚠️ A LIRE AVANT DE S'EN ETONNER : vevewiki ne publie
  # AUCUNE page de prix (content.data_modules vide, cf. priceEnabled() dans
  # engine/lib/features.mjs), donc cette table ne sert AUJOURD'HUI a rien. Elle
  # est armee quand meme pour le jour ou le wiki publiera des fiches : les
  # adresses seront alors deja fixees, et identiques a celles de veveprice.
  adresses_gelees: true
  min_price_points: 8
  quotas:
    collectible: 800
    comic: 400
  quota_spillover: true
  max_new_per_series: 12

# --- Accès : 100 % GRATUIT. tiers=[visitor] + aucune porte => rien n'est tronqué.
access:
  tiers: [visitor]

offer:
  url: ""

legal_info:
  contact: "contact@vevewiki.com"     # <-- à activer (Cloudflare Email Routing, gratuit)
  host: "Hostinger International Ltd, 61 Lordou Vironos Street, 6023 Larnaca, Chypre"
  updated: "2026-07-27"

links:
  team: []
  affiliate: []

# --- Identité visuelle : THÈME CLAIR ENCYCLOPÉDIQUE, l'or en ACCENT ---------
# ⚠️ Bascule du 30/07/2026. La palette sombre argent/or n'est pas perdue : elle
# devient le thème NUIT, qui exige d'émettre deux palettes depuis Base.astro
# (une seule y est écrite, ligne 86) et donc de toucher les 15 sites. Lot à part.
identity:
  # ⛔ PAS `aurora`. aurora code en dur des filets en blanc semi-transparent
  # (#ffffff14) : sur fond clair ils sont ABSENTS, pas discrets — la page perd
  # toutes ses séparations sans qu'aucun build ne s'en plaigne. Le thème clair
  # est un fichier séparé, `themes/encyclopedie/theme.css`. aurora reste intact,
  # donc veveprice ne bouge pas.
  # 🔴 Une faute de frappe ici ne lève AUCUNE erreur : `themeFiles[…] ??
  # Object.values(themeFiles)[0]` retombe sur le premier thème du glob, donc sur
  # aurora. Build vert, site resté sombre. Signature à chercher dans dist/ :
  # `#ffffff14` n'existe que dans aurora.
  theme: encyclopedie
  palette:
    # ⚠️⚠️ `primary` N'EST PAS LA COULEUR DE MARQUE, C'EST CELLE DES LIENS.
    # Base.astro ligne 86 émet ces sept clés en variables CSS, et le thème fait
    # `a{color:var(--primary)}`. Y laisser l'or #d4af37 donnerait des liens à
    # 2,10:1 sur blanc — illisibles, sur toutes les pages, sans qu'aucun test ne
    # le voie. L'or descend dans `accent`, assombri pour être lisible.
    primary: "#3366cc"     # bleu de lien   — 5,37:1 sur blanc
    accent:  "#7a5f10"     # or LISIBLE     — 6,05:1
    danger:  "#b32424"     # rouge          — 6,57:1
    bg:      "#ffffff"     # papier
    surface: "#f8f9fa"     # encadrés, infobox, pied
    text:    "#202122"     # encre          — 16,13:1
    muted:   "#666b71"     # méta, dates    — 5,38:1 papier / 5,10:1 surface
    # ⚠️ `muted` n'est PAS #72777d (le gris de Wikipédia) : celui-là passe sur
    # blanc (4,52:1) mais ÉCHOUE sur `surface` (4,28:1) — or les méta vivent
    # justement dans les encadrés gris. Un contraste se valide contre le fond
    # RÉEL du bloc, jamais contre le blanc.
  # --- PALETTE NUIT : c'est EXACTEMENT la palette sombre d'origine ------------
  # Rien n'a été inventé ici. Ce sont les couleurs argent/or sur anthracite que
  # portait `identity.palette` jusqu'au 30/07 au matin — elles ne sont pas
  # jetées, elles deviennent le second thème.
  # ⚠️ MÊME RÈGLE QU'EN JOUR, INVERSÉE : `primary` est la couleur des LIENS.
  # #3366cc ne fait que 3,62:1 sur #0c0d10 — il échoue. Et symétriquement l'or
  # #d4af37, illisible de jour (2,10:1), atteint 9,24:1 la nuit : l'or A BESOIN
  # du fond sombre, c'est pour ça que la DA d'origine était sombre.
  # ⭐ Chaque encre existe donc en DEUX valeurs, et `accent` s'ÉCLAIRCIT la nuit
  # au lieu de s'assombrir. Une palette nuit qui garde les encres du jour passe
  # tous les builds et ne se lit pas.
  palette_nuit:
    primary: "#6699ff"     # bleu de lien     — 7,00:1 sur #0c0d10
    accent:  "#e2c65c"     # or LISIBLE       — 11,54:1
    danger:  "#e0555b"     # rouge d'origine
    bg:      "#0c0d10"     # anthracite
    surface: "#16181d"
    text:    "#e7e9ee"     # argent clair     — 16,00:1
    muted:   "#9aa0ab"     # méta             —  7,39:1
  fonts:
    heading: "Georgia, 'Times New Roman', serif"     # ton encyclopédique
    body: "system-ui, -apple-system, Segoe UI, Roboto, sans-serif"

analytics:
  provider: umami
  # ✅ Actif depuis le 27/07/2026 — site créé dans Umami par Preda.
  #
  # ⚠️ SEUL L'IDENTIFIANT EST REPRIS, PAS LA BALISE QUE DONNE UMAMI.
  # Umami propose `<script src="https://stats.veveprice.com/script.js" …>`.
  # On ne l'utilise PAS : le script est servi par le domaine du SITE, via le
  # proxy `location ^~ /stats/` de nginx.conf (il relaie script.js ET les envois
  # /api/send vers stats.veveprice.com). Deux raisons, toutes deux payées :
  #   • un domaine de statistiques tiers est bloqué par la moitié des
  #     navigateurs — on mesurerait la moitié du trafic en croyant tout voir ;
  #   • un seul domaine à déclarer côté vie privée.
  # ⚠️ L'identifiant est PROPRE À CHAQUE SITE : celui de veveprice
  #   (f5e7b44c-…) mesurerait vevewiki dans le tableau de bord de veveprice.
  website_id: "542b16f0-5520-4120-aaf7-e6121da5c915"   # vevewiki.com

seo:
  title_template: "%s | VeVe Wiki"
  # ⭐ TITRE DE L'ACCUEIL — sans cette clé, le gabarit retombait sur le libellé
  # RÉSEAU `title.home`, écrit pour veveprice : vevewiki.com titrait
  # « VeVe Wiki — VeVe price history & floor tracker » sur ses DEUX accueils.
  # Un wiki sans aucun prix se vendait en tracker de prix, sur sa page d'entrée.
  # Budget : « VeVe Wiki — » + ce texte ≤ 60 caractères (le build le contrôle).
  home_title:
    en: "the independent VeVe encyclopedia"
    fr: "l'encyclopédie VeVe indépendante"
    es: "la enciclopedia VeVe independiente"
    it: "l'enciclopedia VeVe indipendente"
    de: "die unabhängige VeVe-Enzyklopädie"
  indexnow_key: "a7f3c9e214d84b06b1e5c0f7d29a63b8"   # clé IndexNow (valeur arbitraire)

content:
  data_modules: []          # vevewiki ne publie pas de pages de prix : éditorial seul
  # Date du RELEVÉ des données d'entrepôt (pas celle du build). Elle part dans le
  # cartouche de toute figure générée à la volée : une image se partage sans sa
  # page, elle doit rester datable. ⚠️ À remonter quand une nouvelle récolte est
  # intégrée — jamais automatiquement, sinon la figure ment sur sa fraîcheur.
  entrepot_collecte: "2026-07-27"
