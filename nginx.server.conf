# CONFIGURATION DU MODE SERVEUR — nginx DEVANT Node.
#
# ⚠️ NE PAS CONFONDRE AVEC `nginx.conf`, qui reste la configuration du mode
# statique. Les deux existent parce que la regle de recherche des fichiers
# differe (`=404` d'un cote, repli vers Node de l'autre) ; TOUT LE RESTE DOIT
# RESTER IDENTIQUE entre les deux. Si tu modifies l'un, modifie l'autre.
# Le lanceur verifie au demarrage que le proxy /stats/ est bien present ici :
# c'est la protection minimale contre l'oubli.
#
# 🔴 POURQUOI nginx RESTE LA PORTE D'ENTREE. La premiere version du socle
# hybride remplacait nginx PAR Node. Or ce fichier ne sert pas que des
# fichiers : il porte le proxy /stats/ (anti-empreinte), le cache, les
# en-tetes de securite et gzip. Node n'en reprend rien. Basculer aurait tue la
# mesure d'audience en repondant 200 partout — « valide, seulement faux ».
# ═══════════════════════════════════════════════════════════════════════════
# 🔴🔴 LE PROTOCOLE DU VISITEUR N'EST PAS `$scheme` — corrige au lot 92.
# ═══════════════════════════════════════════════════════════════════════════
# CE QUE CA A COUTE : « Cross-site POST form submissions are forbidden », page
# blanche au clic sur « creer mon compte », en PRODUCTION seulement.
#
# `$scheme` decrit la connexion CLOUDFLARE -> NGINX, pas celle du visiteur.
# Ce serveur n'ecoute qu'en `listen 80` : Cloudflare lui parle donc en clair,
# et `$scheme` vaut TOUJOURS `http`. La ligne
#     proxy_set_header X-Forwarded-Proto $proto_visiteur;
# ne transmettait donc pas le protocole du visiteur : elle ECRASAIT par `http`
# le `https` que Cloudflare venait d'envoyer.
#
# Astro reconstruit l'URL avec ce protocole, obtient `http://veveprice.com`,
# le compare a l'`Origin` du navigateur (`https://veveprice.com`) et refuse.
# Deux origines identiques AU SCHEMA PRES.
#
# ⭐⭐⭐ UN EN-TETE NOMME « X-Forwarded-Proto » QU'ON REMPLIT AVEC LE PROTOCOLE
#   DU DERNIER SAUT NE TRANSMET RIEN : IL EFFACE. Le nom dit « transmis », le
#   contenu dit « local ». C'est le meme motif que `$host` ou `Referer` : une
#   valeur qui a l'air de decrire le visiteur et decrit le voisin.
#
# ⚠️ FAIRE CONFIANCE A CET EN-TETE EST SUR ICI, ET IL FAUT SAVOIR POURQUOI :
#   un NAVIGATEUR ne peut pas ajouter `X-Forwarded-Proto` (en-tete interdit aux
#   requetes fetch/XHR inter-sites). Or la protection CSRF ne protege QUE de ca
#   — un navigateur pilote depuis un autre site. Un client qui forge ses
#   en-tetes n'a aucun besoin de CSRF : il appelle l'API directement.
#
# ⭐ Le repli sur `$scheme` garde le comportement local juste : en developpement
#   et dans le garde-fou de demarrage (qui interroge nginx en http, sans
#   Cloudflare), aucun en-tete n'arrive et la connexion dit la verite.
# ⭐⭐ DEUX SIGNAUX, ET C'EST DELIBERE. Je ne peux pas verifier depuis
#   l'exterieur lequel Cloudflare envoie a CETTE origine — le seul endroit ou
#   ca se lit est le serveur lui-meme. Plutot que de parier sur l'un des deux
#   et de decouvrir au deploiement suivant que c'etait l'autre, on lit les
#   deux. `X-Forwarded-Proto` est le standard ; `CF-Visitor` est la forme
#   propre a Cloudflare, qu'il envoie meme quand un intermediaire a mange le
#   premier.
# ⭐ ET `/api/sante` REND DESORMAIS `origin` : si malgre tout le protocole
#   reste faux, ca se lit en UNE requete au lieu d'un lot de plus.
map $http_cf_visitor $proto_secours {
  default   $scheme;
  "~*https" https;
}
map $http_x_forwarded_proto $proto_visiteur {
  default    $proto_secours;
  "~*^https$" https;
  "~*^http$"  http;
}

server {
  listen 80;
  server_name _;
  # ⭐ MEME RACINE QUE LE MODE STATIQUE. Le lanceur fait pointer ce chemin vers
  # dist/ (statique) ou dist/client (serveur) par un lien symbolique. Les deux
  # configurations ne different donc QUE par ce qui doit differer : le bloc
  # /api/ et la delegation. Tout le reste est comparable ligne a ligne — c'est
  # ce que verifie engine/tools/test_nginx.py.
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  # ⭐⭐ PRECOMPRESSE AU BUILD, PAS A CHAQUE REQUETE.
  # `gzip on` seul compresse a la volee, au niveau 1 (le defaut, qu'on ne
  # declarait nulle part) : chaque visiteur, chaque robot, chaque passage sur
  # chacune des 8 500 pages refaisait le meme travail, mal. Le Dockerfile
  # produit desormais un `.gz` NIVEAU 9 a cote de chaque fichier compressible,
  # et `gzip_static` le sert tel quel : plus petit ET zero CPU.
  # `gzip on` reste en second rideau pour ce qui n'aurait pas ete precompresse.
  gzip_static on;
  # ⚠️ SANS `gzip_vary`, un cache intermediaire peut servir une reponse
  #    compressee a un client qui ne l'accepte pas — ou l'inverse. C'est
  #    l'en-tete qui dit au cache que la reponse depend d'Accept-Encoding.
  gzip_vary on;
  gzip on;
  # ⚠️ `text/html` n'a PAS à figurer ici : nginx le compresse toujours.
  # ⭐ `application/xml` manquait : le sitemap partait en clair.
  gzip_types text/css application/javascript application/json image/svg+xml text/plain
             application/xml application/xml+rss text/xml;
  gzip_min_length 512;

  # Mesure d'audience servie par CE domaine (anti-empreinte) : le visiteur ne
  # voit que veveprice.com/stats/, jamais l'adresse du serveur de statistiques.
  #  - ^~ est OBLIGATOIRE : sans lui, la regle de cache des .js plus bas
  #    intercepterait /stats/script.js AVANT ce proxy et renverrait une 404.
  #  - le nom passe par une VARIABLE + resolver : nginx demarre meme si le
  #    serveur de stats est injoignable (sinon le SITE ENTIER refuserait de
  #    demarrer a cause d'un simple compteur de visites).
  location ^~ /stats/ {
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    set $umami_host stats.veveprice.com;
    rewrite ^/stats/(.*)$ /$1 break;
    proxy_pass https://$umami_host;
    proxy_ssl_server_name on;
    proxy_set_header Host $umami_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proto_visiteur;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
  }

  # Routes CALCULEES a la demande : jamais de fichier, jamais de cache.
  # ^~ pour passer avant la regle de cache des extensions.
  location ^~ /api/ {
    proxy_pass http://127.0.0.1:4321;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proto_visiteur;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options nosniff;
  }

  # ═══════════════════════════════════════════════════════════════════════════
  # ⭐⭐ LES PAGES DE COMPTE — LE BLOC QUE CE FICHIER ANNONCAIT DEJA, ET QUI
  # N'A JAMAIS ETE ECRIT. C'est la panne mesuree en production le 06/08/2026.
  # ═══════════════════════════════════════════════════════════════════════════
  # CE QUI SE PASSAIT, ET POURQUOI PERSONNE NE POUVAIT LE VOIR.
  #   · le manifeste dit `rendering: server`      -> le mode etait bon ;
  #   · `veve:routes-compte` posait `prerender=false` sur /compte/, /connexion/
  #     et /inscription/                          -> l'integration marchait ;
  #   · Node servait bel et bien ces trois routes -> le build etait bon ;
  #   · le bloc ci-dessus ne delegue que `/api/`  -> nginx n'a JAMAIS demande.
  # Une route rendue a la demande n'ecrit AUCUN fichier dans dist/client. Le
  # `try_files … =404` du bloc `/` la trouvait donc absente et servait notre
  # propre 404.html — avec un code 404 parfaitement sincere, sur une page qui
  # existait a trois metres de la.
  #
  # ⭐⭐⭐ LES DEUX MOITIES DU RENDU A LA DEMANDE NE VIVENT PAS DANS LE MEME
  # DEPOT DE CONNAISSANCE : Astro decide QU'UNE ROUTE EST DYNAMIQUE, nginx
  # decide QUI LA SERT. Poser la premiere sans la seconde ne casse rien, ne
  # ralentit rien, ne fait echouer aucun banc — ca rend juste la page
  # introuvable. C'est le meme motif que « depose mais pas actif », d'un cran
  # plus bas : « rendu, mais jamais demande ».
  #
  # ⚠️ CE COMMENTAIRE ETAIT DEJA ECRIT, TREIZE LIGNES PLUS BAS :
  #   « Les futures pages de compte ajouteront leur propre bloc
  #     `location ^~ /compte/`. »
  # Il annoncait exactement la marche a suivre. Il n'a pas ete suivi, et rien
  # dans la chaine ne pouvait le rappeler. ⭐ Un commentaire n'est pas un
  # garde-fou : d'ou le controle ajoute a `engine/tools/test_nginx.py`, qui
  # lit la liste des routes dynamiques dans `astro_routes_compte.mjs` et exige
  # qu'une regle nginx les serve. Une 4e page de compte ne peut plus etre
  # oubliee ici en silence.
  #
  # ⚠️ UNE SEULE REGLE POUR LES TROIS, ET C'EST VOLONTAIRE. Trois blocs
  # identiques a un prefixe pres, c'est la condition « ecrite trois fois qui
  # diverge deux fois » que `features.mjs` nomme deja. La liste des prefixes
  # est ici, en un seul endroit, et le banc la compare a celle du moteur.
  #
  # ⛔ CE N'EST PAS UN REPLI ATTRAPE-TOUT. Les adresses inconnues continuent de
  # rendre un 404 nginx sans reveiller Node : seuls ces trois prefixes, nommes,
  # partent vers 4321. La regle du fichier ne change pas — rien n'est dynamique
  # tant qu'on ne l'a pas declare.
  #
  # ⚠️ PLACEE AVANT la regle de cache des extensions, qui est elle aussi une
  # regex : entre deux regex, nginx retient LA PREMIERE DECLAREE. Les blocs
  # `^~ /stats/` et `^~ /api/` gardent leur priorite dans tous les cas — un
  # prefixe `^~` bat toujours une regex.
  # 🔴 LOT 104 — `market` ENTRE DANS CETTE LISTE.
  # ⭐⭐⭐ ET C'EST LE BANC QUI L'A DIT, PAS MOI. J'avais inscrit les deux
  # routes dans `ROUTES_COMPTE`, vérifié qu'Astro les basculait bien « à la
  # demande », vu la trace dans le journal de build — et j'aurais livré un
  # `/market/` que Node rend parfaitement et que PERSONNE NE LUI DEMANDE :
  # nginx aurait servi un 404 sur une page qui existe.
  # ⭐ « Rendu, mais jamais demandé » — le commentaire trente lignes plus haut
  # décrit exactement cette panne, il annonçait la marche à suivre, et je ne
  # l'aurais pas suivi non plus. C'est la démonstration de ce qu'il dit :
  # UN COMMENTAIRE N'EST PAS UN GARDE-FOU. `test:nginx` lit `ROUTES_COMPTE` et
  # exige une règle ici ; sans lui, ce lot partait cassé, en silence.
  # ⚠️ `market` est aussi PRÉFIXÉ PAR LA LANGUE (`/fr/market/`) : la regex doit
  # accepter le préfixe optionnel, sinon les quatre variantes tombent dans le
  # bloc `/` et rendent 404 — un défaut qui n'apparaîtrait que sur trois
  # langues sur quatre, donc jamais en test manuel.
  # 🔴🔴 ET PAS `[a-z]{2}` — LE PIÈGE COÛTE LA CONFIGURATION ENTIÈRE.
  # nginx lit `{` comme l'OUVERTURE D'UN BLOC, pas comme un quantificateur : la
  # ligne `location ~ ^/([a-z]{2}/)?…` ouvre donc un bloc à l'accolade du
  # quantificateur et toute la suite part de travers. Mesuré ici : le bloc a
  # disparu du parse, et `/compte/` `/connexion/` `/inscription/` — qui
  # marchaient depuis trois semaines — sont tombés AVEC les deux routes neuves.
  # ⭐⭐⭐ UNE RÈGLE ÉLARGIE PEUT EMPORTER CE QU'ELLE ÉTENDAIT. Le symptôme
  # n'aurait pas ressemblé au lot 104 : trois pages sans rapport, cassées.
  # (La sortie propre existe — guillemeter la regex — mais `[a-z][a-z-]*` se
  # lit sans connaître ce piège, et c'est ce qui compte pour le prochain.)
  # ⚠️ `[a-z][a-z-]*` et pas `[a-z][a-z]` : le banc éprouve la route dynamique
  # sous la forme `/x/market/`, un segment d'UNE lettre. Une regex calée sur
  # deux caractères aurait laissé passer les vraies langues et échoué sur le
  # banc — on aurait alors corrigé le BANC, qui avait raison.
  # ═══════════════════════════════════════════════════════════════════════
  # 🔴🔴🔴 CETTE LISTE EST LA MOITIÉ D'UN CONTRAT — L'AUTRE EST DANS LE MOTEUR
  # ═══════════════════════════════════════════════════════════════════════
  # `engine/lib/astro_routes_compte.mjs` décide quelles routes Node REND ;
  # cette ligne décide lesquelles nginx lui DEMANDE. Les deux doivent dire la
  # même chose, et elles vivent dans deux fichiers, deux langages, deux dépôts
  # mentaux différents.
  # 🔴 MESURÉ EN PRODUCTION LE 10/08, LOT 118 : `/favoris/` est passée dans
  #    ROUTES_COMPTE et pas ici. La page a donc quitté `dist/`, nginx ne l'a
  #    jamais demandée à Node, et `try_files … =404` a servi un **404** — sur
  #    une page dont le lien venait d'être posé au menu des membres.
  # ⭐⭐⭐ `test:nginx` §6 (« tout ce que Node REND, nginx le DEMANDE ») L'AVAIT
  #    VU, exactement, et depuis le premier build. Il était MUET chez moi :
  #    `crossplane` n'était pas installé dans le bac à sable, et il n'est pas
  #    dans le Dockerfile (il enchaîne trois builds). *Le banc qui aurait tout
  #    dit se taisait faute d'une dépendance* — l'avertissement était même
  #    écrit dans ma mémoire, et lu sans être suivi.
  # ⛔ AJOUTER UNE ROUTE DE PAGE DANS `ROUTES_COMPTE` SANS L'AJOUTER ICI DONNE
  #    UN 404 EN PRODUCTION, sur un build vert et un déploiement vert.
  #    ⇒ `npm run test:nginx` avant tout dépôt qui touche ROUTES_COMPTE.
  location ~ ^/([a-z][a-z-]*/)?(compte|connexion|inscription|market|favoris)/ {
    proxy_pass http://127.0.0.1:4321;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proto_visiteur;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    # 🔴 `no-store`, ET PAS `max-age=0, must-revalidate` COMME LE BLOC `/`.
    # Ces pages dependent d'un COOKIE DE SESSION : une seule reponse mise en
    # cache par un intermediaire, et un visiteur lit l'espace membre d'un
    # abonne. « Doit etre revalide » autorise le stockage ; « no-store »
    # l'interdit. C'est la seule difference qui compte avec une page publique.
    add_header Cache-Control "private, no-store";
    # ⚠️⚠️ `add_header` NE S'HERITE PAS d'un bloc `location` a l'autre : des
    #      qu'un bloc en declare UN, il perd TOUS ceux du parent. La liste
    #      complete est donc redite ici, comme dans chaque autre bloc.
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header X-Frame-Options SAMEORIGIN;
  }

  # ⭐ L'ADRESSE SANS BARRE FINALE. Le site ne lie que `/compte/`, mais un
  # visiteur qui TAPE `/compte` tomberait dans le bloc `/` — donc sur un 404,
  # a un caractere pres. Pour les pages pre-generees, `try_files $uri/` fait
  # cette redirection toute seule parce que le REPERTOIRE existe sur le disque ;
  # une route dynamique n'a pas de repertoire, il n'y a donc personne pour la
  # faire. Un `=` (correspondance exacte) est prioritaire sur tout le reste et
  # ne coute rien.
  # 🔴🔴 LOT 121 — CES CINQ-LÀ PARTAIENT AUSSI EN CLAIR, ET DEPUIS BIEN PLUS
  # LONGTEMPS QUE LES REDIRECTIONS DE LANGUE. Un `return 301 /compte/` laisse
  # nginx composer l'absolu avec `$scheme`, qui vaut TOUJOURS `http` derrière
  # Cloudflare (ce serveur n'écoute qu'en `listen 80`). Quiconque tapait
  # `veveprice.com/compte` faisait donc un aller en clair avant d'être remis en
  # `https` par un second saut.
  # ⭐⭐⭐ Je ne l'ai vu qu'en mesurant MA propre redirection de langue, une
  # heure après l'avoir déployée. *Un défaut ancien ne se découvre pas parce
  # qu'on le cherche : il se découvre parce qu'on vient d'en fabriquer un
  # semblable et qu'on regarde enfin cet endroit-là.*
  # ⛔ `test:nginx` refuse désormais tout `return 30x` dont l'adresse ne
  #    commence pas par `$proto_visiteur` : la règle ne tient plus à ce que
  #    quelqu'un s'en souvienne.
  location = /compte      { return 301 $proto_visiteur://$host/compte/; }
  location = /connexion   { return 301 $proto_visiteur://$host/connexion/; }
  location = /inscription { return 301 $proto_visiteur://$host/inscription/; }
  # 🔴 LOT 104 — même redirection pour la route neuve. ⛔ Sans elle, quelqu'un
  # qui TAPE `/market` tombe dans le bloc `/` et lit un 404, à un caractère
  # près, sur une page qui existe et qu'il vient de payer.
  location = /market      { return 301 $proto_visiteur://$host/market/; }
  # ❤️ LOT 119 — `/favoris/`, même raison exactement. Une route dynamique n'a
  # pas de répertoire sur le disque : personne ne fait la redirection à sa
  # place, et `/favoris` (sans barre) tomberait dans le bloc `/`, donc sur un
  # 404 — à un caractère près, sur une page réservée qui existe.
  location = /favoris     { return 301 $proto_visiteur://$host/favoris/; }


  # ═════════════════════════════════════════════════════════════════════════
  # 🌍 LOT 120 — LES ~9 300 ADRESSES LOCALISÉES FUSIONNENT AVEC L'ANGLAIS
  # ═════════════════════════════════════════════════════════════════════════
  # Décision de Preda, 10/08 : le contenu passe en anglais, l'interface reste
  # traduite. `languages.active` ne vaut plus que `[en]`, donc `/fr/…`,
  # `/es/…` et `/de/…` ne sont plus générées.
  #
  # ⭐⭐⭐ 301 ET PAS 404, ET CE N'EST PAS UN PANSEMENT : ces pages n'ont pas
  # disparu, elles ont FUSIONNÉ avec leur équivalent anglais, qui portait déjà
  # le même nom de pièce, la même rareté, le même tirage et le même prix. Le
  # 301 est la phrase qui dit exactement ça, et c'est la seule qui transfère
  # le signal accumulé. Un 404 le jetterait, et casserait les liens entrants.
  #
  # 🔴🔴 L'EXCEPTION QUI FAIT TOUT LE PIÈGE DE CE LOT : `/fr/blog/`.
  # Le blog GARDE ses deux langues (`languages.blog: [en, fr]`) — c'est le seul
  # endroit du réseau où le contenu diffère vraiment d'une langue à l'autre.
  # Ces pages EXISTENT, elles sont générées, elles sont au plan du site.
  # ⛔ Une règle qui redirigerait tout `/fr/…` les enverrait vers `/blog/…`,
  #    c'est-à-dire vers l'article ANGLAIS — en annonçant un 301 « permanent »
  #    sur une page vivante. Google désindexerait le blog français, et le
  #    sitemap continuerait de l'annoncer : deux signaux contradictoires.
  # ⇒ Le bloc `= exact` du blog est déclaré AVANT, et nginx donne la priorité
  #    aux préfixes `^~` sur les regex — c'est ce qui rend l'exception sûre.
  #
  # ⚠️ `it` N'EST PAS DANS LA LISTE, et c'est mesuré : il n'a jamais été actif
  #    (dictionnaires présents, ZÉRO page générée). Rediriger `/it/…` serait
  #    inventer un passé qui n'a pas existé.
  # ⚠️ `permanent` = 301 et non 302 : un 302 dit « revenez demain », et Google
  #    ne transfère alors rien du tout. C'est le seul mot qui compte ici.

  # ① L'EXCEPTION D'ABORD — `^~` bat les regex, quel que soit l'ordre du fichier.
  location ^~ /fr/blog/ { try_files $uri $uri/ $uri/index.html =404; }

  # ② TOUT LE RESTE FUSIONNE VERS L'ANGLAIS.
  #    ⚠️ `$2` et pas `$uri` : `$uri` est décodé, un nom de pièce contenant un
  #    caractère encodé repartirait déformé dans l'en-tête `Location`.
  #
  # 🔴🔴🔴 L'ADRESSE EST ABSOLUE, ET `$proto_visiteur` — PAS `$scheme`, PAS UN
  # CHEMIN RELATIF. MESURÉ EN PRODUCTION le 10/08, une heure après le lot 120 :
  #     GET https://veveprice.com/fr/  →  301  http://veveprice.com/
  # Un `return 301 /chemin` laisse nginx reconstruire l'URL absolue avec
  # `$scheme`. Or **ce serveur n'écoute qu'en `listen 80`** : Cloudflare lui
  # parle en clair, `$scheme` vaut TOUJOURS `http`, et chaque redirection
  # renvoyait le visiteur en CLAIR avant qu'un second saut le remette en
  # `https`. Deux redirections là où une suffit, sur ~9 300 URL.
  # ⭐⭐⭐ L'AVERTISSEMENT ÉTAIT ÉCRIT TRENTE LIGNES PLUS HAUT, dans ce fichier
  # (« DERRIÈRE CLOUDFLARE, `$scheme` MENT »), et la variable `$proto_visiteur`
  # existait DÉJÀ, calculée exactement pour ça. Je l'avais appliquée au CSRF et
  # je ne l'ai pas transposée aux redirections que je venais d'écrire.
  # *Une règle apprise sur un symptôme ne se transpose pas toute seule au
  # suivant : elle reste attachée à l'endroit où elle a fait mal.*
  # ⚠️ `$host` et non `server_name` : ce bloc sert `_`, il n'a pas de nom.
  location ~ ^/(fr|es|de)/(.*)$ { return 301 $proto_visiteur://$host/$2$is_args$args; }
  #    Les accueils localisés : `/fr/` et `/fr` tombent tous deux sur `/`.
  location ~ ^/(fr|es|de)/?$   { return 301 $proto_visiteur://$host/; }

  # HTML : STRICTEMENT LA MEME REGLE QU'EN MODE STATIQUE, « =404 » compris.
  #
  # ⚠️ MA PREMIERE VERSION SE TERMINAIT PAR « @node » : toute adresse sans
  # fichier partait vers Node. Deux consequences que je n'avais pas voulues :
  #  1. les 404 changeaient de page — nginx les sert aujourd'hui, Astro les
  #     aurait servies. Or « un 404 propre » est une decision de ce projet ;
  #  2. le moindre robot balayant des adresses au hasard reveillait Node, alors
  #     que la vitrine fait 8 514 pages et que Node n'a rien a y faire.
  # ⭐ Le routage vers Node est donc EXPLICITE, prefixe par prefixe (voir /api/
  # et les pages de compte plus haut). Meme principe que `prerender = false` :
  # rien n'est dynamique tant qu'on ne l'a pas declare.
  # ⚠️ AJOUTER UNE ROUTE `prerender = false` DANS `astro_routes_compte.mjs` NE
  # SUFFIT PAS : sans regle nginx, elle est rendue par Node et demandee par
  # personne. `npm run test:nginx` refuse desormais ce cas — il lit la liste
  # des routes dynamiques dans le moteur et exige qu'une regle les serve.
  location / {
    try_files $uri $uri/ $uri/index.html =404;

    # Sans cette ligne, le « =404 » ci-dessus rend la page par defaut de nginx :
    # fond blanc, aucun lien, le visiteur quitte le site. On sert la NOTRE.
    error_page 404 /404.html;
    add_header Cache-Control "public, max-age=0, must-revalidate";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header X-Frame-Options SAMEORIGIN;
  }

  # Ressources statiques : cache long.
  location ~* \.(css|js|svg|png|jpg|jpeg|webp|avif|woff2)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Content-Type-Options nosniff;
    # ⚠️⚠️ `add_header` NE S'HÉRITE PAS entre blocs `location` : chaque bloc
    #      doit redire la liste complète, sinon il perd celles du parent.
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header X-Frame-Options SAMEORIGIN;
  }

  location = /sitemap.xml       { add_header Cache-Control "public, max-age=3600"; add_header X-Content-Type-Options nosniff; add_header Referrer-Policy strict-origin-when-cross-origin; }
  location = /robots.txt        { add_header Cache-Control "public, max-age=3600"; add_header X-Content-Type-Options nosniff; add_header Referrer-Policy strict-origin-when-cross-origin; }
  location = /search-index.json { add_header Cache-Control "public, max-age=3600"; add_header X-Content-Type-Options nosniff; add_header Referrer-Policy strict-origin-when-cross-origin; }
}
