# =============================================================================
#  LOT 1 — vevewiki : thème clair « encyclopedie » + recherche interne
#  Fichier à modifier : sites/vevewiki/manifest.yml
#
#  ⚠️ NE PAS ÉCRASER LE MANIFESTE ENTIER. Trois modifications ciblées :
#  remplacer `identity:`, ajouter `devise:` sous `site:`, remplacer `features:`.
#  Raison : le miroir local `github/` avait 751 minutes de retard au moment de
#  la rédaction — un manifeste complet livré depuis une copie périmée écrase en
#  silence tout ce qui a été commité entre-temps.
# =============================================================================


# ─────────────────────────────────────────────────────────────────────────────
#  1) BLOC `identity:` — REMPLACER INTÉGRALEMENT
# ─────────────────────────────────────────────────────────────────────────────
#
#  AVANT (thème sombre) :
#      identity:
#        theme: aurora
#        palette:
#          primary: "#d4af37"
#          accent:  "#c0c5ce"
#          danger:  "#e0555b"
#          bg:      "#0c0d10"
#          surface: "#16181d"
#          text:    "#e7e9ee"
#          muted:   "#9aa0ab"
#
#  APRÈS :

identity:
  # ⛔ PAS `aurora`. aurora code en dur des filets en blanc semi-transparent
  # (#ffffff14) : sur fond clair ils sont ABSENTS, pas discrets — la page perd
  # toutes ses séparations sans qu'aucun build ne s'en plaigne. Le thème clair
  # est un FICHIER SÉPARÉ, `themes/encyclopedie/theme.css`. aurora reste intact,
  # donc veveprice ne bouge pas.
  theme: encyclopedie

  palette:
    # ⚠️⚠️ `primary` N'EST PAS LA COULEUR DE MARQUE, C'EST LA COULEUR DES LIENS.
    # src/layouts/Base.astro ligne 86 émet ces sept clés en variables CSS, et le
    # thème fait `a{color:var(--primary)}`. Y mettre l'or #d4af37 donnerait des
    # liens à 2,10:1 sur blanc — illisibles, sur toutes les pages, sans qu'aucun
    # test ne le voie. L'or descend donc dans `accent`, où il sert de décor et de
    # texte doré assombri.
    primary: "#3366cc"     # bleu de lien      — 5,37:1 sur blanc
    accent:  "#7a5f10"     # or LISIBLE        — 6,05:1 (l'or brut est en dur
                           #                     dans le thème, pour le décor)
    danger:  "#b32424"     # rouge             — 6,57:1
    bg:      "#ffffff"     # papier
    surface: "#f8f9fa"     # encadrés, infobox, pied
    text:    "#202122"     # encre            — 16,13:1
    muted:   "#666b71"     # méta, dates      — 5,38:1 blanc / 5,10:1 surface
    #
    # ⚠️ `muted` n'est PAS #72777d (le gris de Wikipédia). Celui-là passe sur
    # blanc (4,52:1) mais ÉCHOUE sur `surface` (4,28:1) — or les méta vivent
    # justement dans les encadrés gris. Un contraste se valide contre le fond
    # RÉEL du bloc, jamais contre le blanc.

  fonts:
    heading: "Georgia, 'Times New Roman', serif"     # ton encyclopédique
    body: "system-ui, -apple-system, Segoe UI, Roboto, sans-serif"

# Effets automatiques de ce changement, rien à câbler :
#   • <meta name="theme-color"> suit `bg` → barre d'adresse Android claire ;
#   • `color-scheme` est déduit de la luminance de `bg` (Base.astro ligne 85) :
#     luminance(#ffffff) = 1 > 0,18 → `light`. Les champs de formulaire et les
#     ascenseurs natifs basculent en clair d'eux-mêmes ;
#   • engine/lib/figures.mjs relit `identity.palette` : les figures générées
#     sortiront sur fond clair au prochain build, sans intervention.


# ─────────────────────────────────────────────────────────────────────────────
#  2) NOUVELLE CLÉ `devise:` — À AJOUTER dans le bloc `site:`,
#     juste après `tagline:`
# ─────────────────────────────────────────────────────────────────────────────
#
#  Traduite dans les cinq langues, comme `tagline` et `description`. Une devise
#  en anglais au-dessus de cinq langues ne veut rien dire.
#  ⚠️ Elle n'a PAS sa place dans la barre du haut : sur un écran de 360 px elle
#  serait tronquée, et l'accueil est le seul endroit où une devise se lit.

  devise:
    en: "Knowledge, connected"
    fr: "Le savoir, relié"
    es: "El saber, conectado"
    it: "Il sapere, collegato"
    de: "Wissen, verbunden"


# ─────────────────────────────────────────────────────────────────────────────
#  3) CE QUI NE CHANGE PAS DANS CE LOT — et pourquoi
# ─────────────────────────────────────────────────────────────────────────────
#
#  • `src/layouts/Base.astro`, `engine/lib/manifest.mjs`, `themes/aurora` :
#    INTACTS. Le mode nuit, lui, EXIGE de modifier Base.astro (une seule palette
#    y est émise, ligne 86) : il attend un lot dédié, après vérification du jour
#    en production.
#
#  • `identity.logo` n'est pas ajouté : le PNG n'existe pas encore. Le thème
#    stylise déjà `.brand img` (30 × 30) pour l'accueillir sans retouche.


# ─────────────────────────────────────────────────────────────────────────────
#  4) BLOC `features:` — ACTIVER LA RECHERCHE
# ─────────────────────────────────────────────────────────────────────────────
#
#  AVANT :
#      features:
#        search: none
#        comments: false
#        database: false
#
#  APRÈS :

features:
  # ✅ Réactivé le 30/07/2026 — et cette fois la fonction existe.
  # L'audit du 27/07 avait mis `none` pour une bonne raison : le manifeste
  # annonçait `internal`, donc les 32 pages publiaient un `SearchAction` vers
  # `/?q=…`, alors que l'accueil éditorial ne rendait AUCUNE boîte et que
  # `search-index.json` renvoyait `[]`. On promettait à Google une fonction
  # inexistante.
  # Ce qui a changé, et qui doit être posé EN MÊME TEMPS que cette ligne :
  #   • src/pages/search-index.json.js indexe l'éditorial (1 074 entrées) ;
  #   • engine/lib/features.mjs accepte une source éditoriale ;
  #   • src/components/pages/EditorialHome.astro rend la boîte ;
  #   • engine/i18n/*.json portent les 3 nouvelles clés.
  # ⛔ Poser cette ligne SEULE recrée exactement le défaut du 27/07.
  search: internal
  comments: false
  database: false
