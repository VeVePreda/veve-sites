# ⚠️ DEPOT : VeVePreda/veve-sites
#
# A7 BIS — LES 17 BANCS TOURNENT ENFIN QUELQUE PART (30/07/2026).
#
# LE DEFAUT. `npm test` enchaine 17 bancs, tous verts, et AUCUN des trois
# workflows du depot ne l'appelait : ni `rebuild-daily`, ni `freeze-slugs`, ni
# `vevewiki-editorial`. Le Dockerfile joue bien quelques bancs un par un, mais
# pas `test:dockerfile`, `test:gabarits`, `test:slugs`, `test:nginx`,
# `test:entrepot`, `test:adresses` ni `test:indexnow`.
# ⭐ Meme forme que chez jetonveve (« aucun workflow n'appelle pytest ») : un
# banc vert que RIEN ne declenche. Ecrire le banc est la moitie du travail.
#
# ⭐⭐ POURQUOI UN WORKFLOW SEPARE, ET PAS DANS `rebuild-daily` (choix de Preda,
# 30/07). Mettre les 17 bancs devant le deploiement quotidien, c'est donner a
# chacun le pouvoir d'empecher le site de se reconstruire. On a deja vu un banc
# devenir capricieux : `test:lastmod` echouait si toutes les fiches partageaient
# une date — faux sur un site dont aucun prix n'a bouge, et il a fallu le
# desarmer le jour meme. Un banc statistique n'a rien a faire devant une porte
# bloquante.
# ➡️ Ici les bancs gardent le CODE (a chaque push), pas la PRODUCTION. Un banc
# rouge arrete une livraison, jamais la reconstruction du site.
#
# ⛔ CE WORKFLOW NE DEPLOIE RIEN, N'ECRIT RIEN, NE TOUCHE AUCUNE RELEASE.
#    Il lit le depot et lance des bancs hors reseau. Il ne peut rien casser.

name: Bancs (npm test)

on:
  push:
    branches: [main]
    # ⭐ On ne relance pas les 17 bancs pour un README ou une image. Ce filtre
    # n'est PAS une optimisation : un workflow qui tourne pour rien finit par
    # etre ignore, et un banc qu'on ignore ne protege plus.
    paths:
      - 'engine/**'
      - 'src/**'
      - 'sites/**'
      - 'themes/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - 'nginx*.conf'
      - 'astro.config.mjs'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bancs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bancs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # ═════════════════════════════════════════════════════════════════════════
    # 🔴🔴 LOT 102 (07/08/2026) — CE WORKFLOW NE TESTAIT QU'UN SEUL SITE, ET
    # DANS LE MAUVAIS MODE. Mesure, pas soupçon :
    #   · ni `SITE` ni `RENDERING` n'étaient posés ;
    #   · `manifest.mjs` fait `SITE = process.env.SITE || 'veveprice'`
    #     ⇒ **vevewiki n'a JAMAIS été testé ici**, alors que « corrigé sur un
    #        site ≠ corrigé » est une règle écrite de ce dépôt ;
    #   · `astro.config.mjs` fait `mode = process.env.RENDERING || 'static'`
    #     ⇒ veveprice, dont le manifeste dit `rendering: server`, était
    #        construit et vérifié **en static**. Les routes de compte restaient
    #        pré-générées, le middleware ne tournait pas, et les bancs
    #        rendaient leur verdict sur un build que la production ne fabrique
    #        jamais.
    #
    # ⭐⭐⭐ CE N'ÉTAIT PAS UN TROU DE COUVERTURE, C'ÉTAIT UN INSTRUMENT BRANCHÉ
    # AILLEURS. 354 assertions vertes sur une configuration qui n'existe pas.
    # C'est la même famille que le miroir périmé d'`etat_reel.py` et que
    # `languesDuSite()` dans `test:routes` : ce qu'on mesure n'est pas ce qu'on
    # livre, et rien ne le dit.
    #
    # ⭐ `fail-fast: false` : si veveprice casse, on veut quand même savoir où
    # en est vevewiki. Un seul verdict pour deux sites, c'est retomber dans le
    # défaut qu'on vient de corriger.
    strategy:
      fail-fast: false
      matrix:
        site: [veveprice, vevewiki]
    name: bancs (${{ matrix.site }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # ⭐ `npm ci` STRICT, sans `|| npm install`. Le repli est precisement ce
      # qui a masque un lock desaccorde pendant des jours : `npm ci` refusait de
      # tourner, `npm install` reparait en silence, et le verrou de versions ne
      # verrouillait plus rien en CI sans que rien ne le dise.
      # Un `npm ci` strict est un CAPTEUR.
      - name: Installer (npm ci strict — c'est un capteur)
        run: npm ci --no-audit --no-fund

      # `test:slugs`, `test:nginx` et `test:indexnow` sont en Python.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ⭐⭐ CORRIGE APRES LE PREMIER RUN (30/07/2026) — et c'est le workflow
      # lui-meme qui a trouve le trou, a son premier passage.
      #
      # `test:nginx` importe `crossplane` (l'analyseur officiel de NGINX Inc.).
      # J'avais installe les dependances Node (`npm ci`) et OUBLIE celles de
      # Python : `crossplane est absent : pip install crossplane` -> exit 1, et
      # la chaine s'est arretee la, sans jamais atteindre `test:indexnow`.
      #
      # ⭐ Pourquoi personne ne l'avait vu : ce banc n'avait JAMAIS ete joue par
      # une automatisation. Le Dockerfile installe `python3` mais ne lance pas
      # `test:nginx`. Une dependance manquante reste invisible aussi longtemps
      # que rien n'execute le banc — c'est exactement la raison d'etre d'A7bis,
      # et ca s'est demontre en un run.
      #
      # ⭐ A saluer : `test_nginx.py` fait `sys.exit("crossplane est absent")`
      # au lieu de sauter le controle. Un banc qui refuse de tourner vaut mille
      # fois mieux qu'un banc qui se declare vert sans rien verifier.
      - name: Dependances Python des bancs (crossplane pour test:nginx)
        run: pip install crossplane

      # ⭐⭐ LE MODE DE RENDU SE LIT DANS LE MANIFESTE DU SITE, JAMAIS ICI.
      # Un mode ecrit en dur dans ce fichier serait une SECONDE verite a cote de
      # `sites/<site>/manifest.yml` — et le jour ou les deux divergent, c'est la
      # CI qui aurait raison contre la production. C'est exactement la technique
      # deja employee par `rebuild-daily.yml`, on n'en invente pas une seconde.
      - name: Le mode de rendu vient du manifeste
        run: |
          set -eu
          MODE=$(sed -n 's/^rendering:[[:space:]]*\([a-zA-Z]*\).*/\1/p' \
                 "sites/${{ matrix.site }}/manifest.yml" | head -1)
          MODE=${MODE:-static}
          echo "site ${{ matrix.site }} -> rendering=$MODE"
          echo "RENDERING=$MODE" >> "$GITHUB_ENV"

      # ═════════════════════════════════════════════════════════════════════
      # 🔴 ON CONSTRUIT AVANT DE TESTER, ET C'EST UNE CORRECTION EN SOI.
      # ═════════════════════════════════════════════════════════════════════
      # Quatre bancs lisent `dist/` : `test:cles`, `test:routes`, `test:fuite`,
      # et `audit_seo`. Aucun ne le construisait. Ils lisaient donc le `dist/`
      # laisse par `test:slugs`, qui tourne plus tot dans la chaine et enchaine
      # ses propres builds pour ses propres besoins.
      # ⛔ UN BANC QUI LIT L'ARTEFACT D'UN AUTRE BANC MESURE L'AUTRE BANC.
      # Il suffisait que `test:slugs` change d'ordre, de mode, ou qu'il sorte
      # tot — ce qu'il fait desormais sur vevewiki — pour que quatre controles
      # se mettent a juger un `dist/` absent ou etranger, sans que rien ne
      # l'annonce.
      - name: Construire le dist que les bancs vont lire
        env:
          SITE: ${{ matrix.site }}
          WAREHOUSE_OFFLINE: '1'
        run: npm run build

      # ⭐ WAREHOUSE_OFFLINE=1 : les bancs ne doivent joindre AUCUNE source.
      # Un banc qui appelle le reseau ne prouve rien le jour ou le reseau tombe,
      # c'est-a-dire le seul jour ou le code de repli sert.
      - name: npm test (la chaine complete, hors reseau)
        env:
          SITE: ${{ matrix.site }}
          WAREHOUSE_OFFLINE: '1'
        run: npm test

      # ⭐⭐ LE GARDE-FOU DU GARDE-FOU, ET IL VIT DEHORS DE CE QU'IL SURVEILLE.
      # Sans lui, retirer une etape de la chaine `test` rendrait ce workflow
      # VERT plus vite — un controle qui se croit arme parce qu'il ne dit rien.
      # C'est exactement la forme du build rouge du 29/07 (un garde-fou loge
      # dans le `RUN` qui ne parse pas).
      - name: La chaine `test` n'a pas maigri
        if: always()
        run: |
          set -u
          n=$(node -e "process.stdout.write(String(require('./package.json').scripts.test.split(' && ').length))")
          echo "chaine test : $n banc(s)"
          # 🔴 LOT 102 — PLANCHER RELEVE DE 17 A 24. Il valait 17 depuis le
          # 30/07 ; la chaine en compte 24 depuis le lot 102. Un plancher qu'on
          # oublie de relever autorise silencieusement sept suppressions — c'est
          # un garde-fou qui se desarme tout seul, par le simple passage du temps.
          # ⛔ Le relever fait partie de tout lot qui ajoute un banc.
          [ "$n" -ge 24 ] || {
            echo "ERREUR: la chaine est tombee a $n bancs (plancher 24)."
            echo "Un banc retire de \`npm test\` disparait SANS RIEN CASSER :"
            echo "ce plancher est la seule chose qui s'en plaigne."
            exit 1
          }
