# ⚠️ DEPOT : VeVePreda/veve-sites
#
# 🔴🔴🔴 CE FICHIER EST UNE FUSION — NE PAS LE REMPLACER PAR UNE VERSION PARTIELLE.
# ═══════════════════════════════════════════════════════════════════════════
# Le 07/08 à 09 h 16, une session parallèle a produit un `tests.yml` qui ajoutait
# l'alerte Discord — bâti sur la version d'AVANT le lot 102. Le déposer aurait
# effacé, en silence, la matrice `SITE` / `RENDERING` et le build préalable
# déposés quarante minutes plus tôt : la CI serait retournée tester UN site dans
# le MAUVAIS mode, et rien ne l'aurait dit.
# ⭐⭐⭐ DEUX SESSIONS QUI TOUCHENT LE MÊME FICHIER NE SE CONTREDISENT PAS : LA
# DERNIÈRE DÉPOSÉE GAGNE, ET L'AUTRE DISPARAÎT SANS ERREUR. C'est le mode de
# panne le plus silencieux de ce projet — un réglage posé à un endroit,
# silencieusement écrasé par un autre.
# ⛔ AVANT DE DÉPOSER UN WORKFLOW : le diff contre le dépôt, pas contre sa
# mémoire. Ce qui compte n'est pas ce qu'on ajoute, c'est ce qu'on RETIRE sans
# le vouloir.
# ⭐ Cette version porte LES DEUX : la matrice du lot 102 ET l'alerte du canal
# de pannes.
#
#
# A7 BIS — LES 17 BANCS TOURNENT ENFIN QUELQUE PART (30/07/2026).
#
# LE DEFAUT. `npm test` enchaine 17 bancs, tous verts, et AUCUN des trois
# workflows du depot ne l'appelait : ni `rebuild-daily`, ni `freeze-slugs`, ni
# `vevewiki-editorial`. Le Dockerfile joue bien quelques bancs un par un, mais
# pas `test:dockerfile`, `test:gabarits`, `test:slugs`, `test:nginx`,
# `test:entrepot`, `test:adresses` ni `test:indexnow`.
# ⭐ Meme forme que chez jetonveve (« aucun workflow n'appelle pytest ») : un
# banc vert que RIEN ne declenche. Ecrire le banc est la moitie du travail.
#
# ⭐⭐ POURQUOI UN WORKFLOW SEPARE, ET PAS DANS `rebuild-daily` (choix de Preda,
# 30/07). Mettre les 17 bancs devant le deploiement quotidien, c'est donner a
# chacun le pouvoir d'empecher le site de se reconstruire. On a deja vu un banc
# devenir capricieux : `test:lastmod` echouait si toutes les fiches partageaient
# une date — faux sur un site dont aucun prix n'a bouge, et il a fallu le
# desarmer le jour meme. Un banc statistique n'a rien a faire devant une porte
# bloquante.
# ➡️ Ici les bancs gardent le CODE (a chaque push), pas la PRODUCTION. Un banc
# rouge arrete une livraison, jamais la reconstruction du site.
#
# ⛔ CE WORKFLOW NE DEPLOIE RIEN, N'ECRIT RIEN, NE TOUCHE AUCUNE RELEASE.
#    Il lit le depot et lance des bancs hors reseau. Il ne peut rien casser.

name: Bancs (npm test)

on:
  push:
    branches: [main]
    # ⭐ On ne relance pas les 17 bancs pour un README ou une image. Ce filtre
    # n'est PAS une optimisation : un workflow qui tourne pour rien finit par
    # etre ignore, et un banc qu'on ignore ne protege plus.
    paths:
      - 'engine/**'
      - 'src/**'
      - 'sites/**'
      - 'themes/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - 'nginx*.conf'
      - 'astro.config.mjs'
      - '.github/workflows/tests.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bancs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bancs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # ═════════════════════════════════════════════════════════════════════════
    # 🔴🔴 LOT 102 (07/08/2026) — CE WORKFLOW NE TESTAIT QU'UN SEUL SITE, ET
    # DANS LE MAUVAIS MODE. Mesure, pas soupçon :
    #   · ni `SITE` ni `RENDERING` n'étaient posés ;
    #   · `manifest.mjs` fait `SITE = process.env.SITE || 'veveprice'`
    #     ⇒ **vevewiki n'a JAMAIS été testé ici**, alors que « corrigé sur un
    #        site ≠ corrigé » est une règle écrite de ce dépôt ;
    #   · `astro.config.mjs` fait `mode = process.env.RENDERING || 'static'`
    #     ⇒ veveprice, dont le manifeste dit `rendering: server`, était
    #        construit et vérifié **en static**. Les routes de compte restaient
    #        pré-générées, le middleware ne tournait pas, et les bancs
    #        rendaient leur verdict sur un build que la production ne fabrique
    #        jamais.
    #
    # ⭐⭐⭐ CE N'ÉTAIT PAS UN TROU DE COUVERTURE, C'ÉTAIT UN INSTRUMENT BRANCHÉ
    # AILLEURS. 354 assertions vertes sur une configuration qui n'existe pas.
    # C'est la même famille que le miroir périmé d'`etat_reel.py` et que
    # `languesDuSite()` dans `test:routes` : ce qu'on mesure n'est pas ce qu'on
    # livre, et rien ne le dit.
    #
    # ⭐ `fail-fast: false` : si veveprice casse, on veut quand même savoir où
    # en est vevewiki. Un seul verdict pour deux sites, c'est retomber dans le
    # défaut qu'on vient de corriger.
    strategy:
      fail-fast: false
      matrix:
        site: [veveprice, vevewiki]
    name: bancs (${{ matrix.site }})
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # ⭐ `npm ci` STRICT, sans `|| npm install`. Le repli est precisement ce
      # qui a masque un lock desaccorde pendant des jours : `npm ci` refusait de
      # tourner, `npm install` reparait en silence, et le verrou de versions ne
      # verrouillait plus rien en CI sans que rien ne le dise.
      # Un `npm ci` strict est un CAPTEUR.
      - name: Installer (npm ci strict — c'est un capteur)
        run: npm ci --no-audit --no-fund

      # 🔒 LOT 209 — LES ALERTES DE SECURITE SE SURVEILLENT ICI, ET NULLE PART
      # AILLEURS. Le 27/08 le depot portait 3 alertes (js-yaml et nanoid en
      # HIGH, postcss en MODERATE) sans que rien ne les dise : les CINQ appels
      # a npm du depot passent `--no-audit`, et c'est VOULU — un build qui
      # interroge le registre npm devient un build qui depend du reseau.
      # ⛔ CETTE ETAPE N'A DONC RIEN A FAIRE DANS LE DOCKERFILE : elle exige le
      #    reseau, et le Dockerfile ne doit porter aucun controle indecidable
      #    hors ligne. La CI, elle, a le reseau — et elle CONSTATE sans
      #    empecher : un rouge ici ne bloque aucun deploiement, il previent.
      # ⭐ `--audit-level=high` et pas moins : une alerte `low` publiee un
      #    dimanche rendrait ce capteur rouge en permanence, et un capteur
      #    toujours rouge ne se lit plus. On ne surveille que ce sur quoi on
      #    agirait le jour meme.
      # ⚠️ Ce controle rougit sans qu'aucune ligne du depot ait bouge — c'est
      #    sa raison d'etre. La reparation habituelle est `npm audit fix`, qui
      #    ne touche que `package-lock.json` ; toute correction du lock oblige
      #    a rejouer la chaine complete du Dockerfile avant de deposer.
      - name: Alertes de securite des dependances (constat, pas barrage)
        run: npm audit --audit-level=high

      # `test:slugs`, `test:nginx` et `test:indexnow` sont en Python.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ⭐⭐ CORRIGE APRES LE PREMIER RUN (30/07/2026) — et c'est le workflow
      # lui-meme qui a trouve le trou, a son premier passage.
      #
      # `test:nginx` importe `crossplane` (l'analyseur officiel de NGINX Inc.).
      # J'avais installe les dependances Node (`npm ci`) et OUBLIE celles de
      # Python : `crossplane est absent : pip install crossplane` -> exit 1, et
      # la chaine s'est arretee la, sans jamais atteindre `test:indexnow`.
      #
      # ⭐ Pourquoi personne ne l'avait vu : ce banc n'avait JAMAIS ete joue par
      # une automatisation. Une dependance manquante reste invisible aussi
      # longtemps que rien n'execute le banc — la raison d'etre d'A7bis.
      #
      # 🔴🔴 LOT 126 — LES TROIS LIGNES CI-DESSUS ETAIENT FAUSSES SUR UN POINT.
      # Elles disaient « le Dockerfile installe python3 ». Verifie le 10/08 : le
      # stage de build n'avait AUCUN `apk add`, et il ne lancait pas
      # `test:nginx`. Une phrase fausse dans un commentaire se lit comme un etat
      # et dispense d'aller voir — elle a survecu onze jours.
      # ⭐⭐ Et ce workflow tourne sur `push: main` : APRES le depot, EN MEME
      # TEMPS que le deploiement Coolify. Il CONSTATE, il n'EMPECHE pas. Le
      # Dockerfile, lui, est la porte que le deploiement respecte — `test:nginx`
      # y est desormais, avec python3 et crossplane, avant tous les autres.
      # ⇒ Ici il reste un second filet, et c'est bien : ce workflow joue les
      #   DEUX sites, la ou un build Docker n'en construit qu'un a la fois.
      #
      # ⭐ A saluer : `test_nginx.py` fait `sys.exit("crossplane est absent")`
      # au lieu de sauter le controle. Un banc qui refuse de tourner vaut mille
      # fois mieux qu'un banc qui se declare vert sans rien verifier.
      - name: Dependances Python des bancs (crossplane pour test:nginx)
        run: pip install crossplane

      # ⭐⭐ LE MODE DE RENDU SE LIT DANS LE MANIFESTE DU SITE, JAMAIS ICI.
      # Un mode ecrit en dur dans ce fichier serait une SECONDE verite a cote de
      # `sites/<site>/manifest.yml` — et le jour ou les deux divergent, c'est la
      # CI qui aurait raison contre la production. C'est exactement la technique
      # deja employee par `rebuild-daily.yml`, on n'en invente pas une seconde.
      - name: Le mode de rendu vient du manifeste
        run: |
          set -eu
          MODE=$(sed -n 's/^rendering:[[:space:]]*\([a-zA-Z]*\).*/\1/p' \
                 "sites/${{ matrix.site }}/manifest.yml" | head -1)
          MODE=${MODE:-static}
          echo "site ${{ matrix.site }} -> rendering=$MODE"
          echo "RENDERING=$MODE" >> "$GITHUB_ENV"

      # ═════════════════════════════════════════════════════════════════════
      # 🔴 ON CONSTRUIT AVANT DE TESTER, ET C'EST UNE CORRECTION EN SOI.
      # ═════════════════════════════════════════════════════════════════════
      # Quatre bancs lisent `dist/` : `test:cles`, `test:routes`, `test:fuite`,
      # et `audit_seo`. Aucun ne le construisait. Ils lisaient donc le `dist/`
      # laisse par `test:slugs`, qui tourne plus tot dans la chaine et enchaine
      # ses propres builds pour ses propres besoins.
      # ⛔ UN BANC QUI LIT L'ARTEFACT D'UN AUTRE BANC MESURE L'AUTRE BANC.
      # Il suffisait que `test:slugs` change d'ordre, de mode, ou qu'il sorte
      # tot — ce qu'il fait desormais sur vevewiki — pour que quatre controles
      # se mettent a juger un `dist/` absent ou etranger, sans que rien ne
      # l'annonce.
      - name: Construire le dist que les bancs vont lire
        env:
          SITE: ${{ matrix.site }}
          WAREHOUSE_OFFLINE: '1'
          # 🔴 LOT 135B (P32) — LA CI CONSTRUISAIT SANS CE MARQUAGE, donc
          # `test:i18n` sortait INDECIDABLE depuis le lot 130. Le Dockerfile de
          # PRODUCTION le pose : sans lui ici, la CI ne teste pas la condition
          # dans laquelle le site est reellement construit.
          I18N_MARQUAGE: '1'
        run: npm run build

      # ⛔⛔ L'ORDRE EXACT DU DOCKERFILE, ET IL N'EST PAS NEGOCIABLE :
      #   `I18N_MARQUAGE=1 npm run build` PUIS `npm run marquer:i18n`.
      # Le build DEPOSE des marqueurs invisibles ; cette etape les ECHANGE
      # contre les libelles. Construire sans echanger laisserait un `dist/`
      # marque que les autres bancs liraient de travers — c'est ce defaut qui a
      # fait couper les `<title>` trop tot (P28) et avaler 64 `<head>` au 129.
      - name: Echanger les marqueurs i18n (comme le Dockerfile)
        env:
          SITE: ${{ matrix.site }}
        run: npm run marquer:i18n

      # ⭐ WAREHOUSE_OFFLINE=1 : les bancs ne doivent joindre AUCUNE source.
      # Un banc qui appelle le reseau ne prouve rien le jour ou le reseau tombe,
      # c'est-a-dire le seul jour ou le code de repli sert.
      - name: npm test (la chaine complete, hors reseau)
        env:
          SITE: ${{ matrix.site }}
          WAREHOUSE_OFFLINE: '1'
          I18N_MARQUAGE: '1'
        run: npm test

      # ⭐⭐ LE GARDE-FOU DU GARDE-FOU, ET IL VIT DEHORS DE CE QU'IL SURVEILLE.
      # Sans lui, retirer une etape de la chaine `test` rendrait ce workflow
      # VERT plus vite — un controle qui se croit arme parce qu'il ne dit rien.
      # C'est exactement la forme du build rouge du 29/07 (un garde-fou loge
      # dans le `RUN` qui ne parse pas).
      - name: La chaine `test` n'a pas maigri
        if: always()
        run: |
          set -u
          n=$(node -e "process.stdout.write(String(require('./package.json').scripts.test.split(' && ').length))")
          echo "chaine test : $n banc(s)"
          # 🔴🔴 LOT 134 — PLANCHER RELEVE DE 25 A 40, ET LE RETARD ETAIT DE
          # QUINZE. Il valait 17 au 30/07, releve a 25 au lot 103, puis PLUS
          # JAMAIS — pendant que la chaine passait de 25 a 40 bancs (lots 104 a
          # 134). Le garde-fou autorisait donc **quinze suppressions en
          # silence** : on pouvait retirer test:plages, test:series,
          # test:tableau, test:tuiles, test:i18n, test:membre, test:marche… et
          # ce workflow serait reste VERT, plus vite qu'avant.
          # ⭐⭐⭐ UN PLANCHER QU'ON OUBLIE DE RELEVER NE SE PLAINT PAS : il se
          # desarme tout seul, par le simple passage du temps, et il continue
          # d'AFFICHER qu'il garde quelque chose. C'est la forme la plus
          # discrete du « pose et jamais lu » — pose, lu, et devenu faux.
          # ⛔ LE RELEVER FAIT PARTIE DE TOUT LOT QUI AJOUTE UN BANC. Ce n'est
          # pas une formalite : c'est la seule ligne du depot qui remarque
          # qu'un banc a disparu.
          # ⚠️ Ce fichier NE VOYAGE PAS EN ZIP (`.github/workflows/*`) : il se
          # colle a la main, PUIS on `diff` contre le depot.
          #
          # 🔴🔴 RELEVE DE 40 A 41 LE 11/08/2026, ET LE RETARD ETAIT DEJA LA.
          # `test:tiroir` a ete ajoute par le lot 139 : la chaine comptait donc
          # 41 bancs pendant que ce plancher en reclamait 40. MESURE, pas relu —
          # une note du dossier affirmait « plancher = 41 », elle avait tort.
          # ⭐⭐⭐ LA MEME MALADIE QUE LE PLANCHER HSTS, LE MEME JOUR : un plancher
          # se desarme par le simple passage du temps, et il continue d'AFFICHER
          # qu'il garde quelque chose. Les deux ont ete releves dans le meme lot,
          # et ce n'est pas une coincidence — c'est une classe de defaut.
          # ⛔ SE VERIFIE, NE SE SUPPOSE PAS :
          #      node -e "console.log(require('./package.json').scripts.test.split(' && ').length)"
          #
          # 🔴🔴 RELEVE DE 41 A 44 LE 18/08/2026 (lot 154-B), ET LE RETARD ETAIT
          # DE DEUX. La chaine comptait 43 bancs pendant que ce plancher en
          # reclamait 41 : deux suppressions passaient donc en silence. Le lot
          # 154-B ajoute `test:prefs` (44e), et RELEVE LE PLANCHER DANS LE MEME
          # DEPOT — c'est la troisieme fois qu'on constate le retard apres coup.
          # ⭐⭐⭐ MESURE, PAS RELU (la note du 11/08 disait deja qu'une note du
          #   dossier affirmait « plancher = 41 » et avait tort) :
          #      node -e "console.log(require('./package.json').scripts.test.split(' && ').length)"
          #      → 44
          # 🔴 LOT 168 — QUATRIEME RETARD CONSTATE APRES COUP. Mesure du
          #   20/08/2026 : `package.json` chaine **45** bancs, ce plancher en
          #   reclamait **44** ⇒ une suppression passait deja en silence.
          #   ⭐⭐⭐ Un plancher qu'on oublie de relever ne se plaint pas : il se
          #   desarme tout seul par le simple passage du temps, en continuant
          #   d'AFFICHER qu'il garde quelque chose. Le relever fait partie du
          #   lot qui ajoute un banc — jamais du lot suivant.
          # 🔴 LOT 171 — RELEVE DE 45 A 47 **DANS LE LOT QUI AJOUTE LES BANCS**,
          #   et pas dans le suivant. Les quatre releves precedents (25->40->41
          #   ->44->45) ont TOUS ete constates apres coup, avec un retard de 1 a
          #   15 bancs : pendant tout ce temps, ce plancher affichait qu'il
          #   gardait quelque chose et ne gardait rien.
          #   Les deux ajouts : `test:offres` (la courbe des offres, point `v`)
          #   et `test:memoire` (la sonde du build). MESURE, pas relu :
          #      node -e "console.log(require('./package.json').scripts.test.split(' && ').length)"
          #      → 47
          # 🔴🔴 LOT 183 — 47 → 46, ET C'EST UN ABAISSEMENT **DELIBERE**.
          #   Le lot 161 a supprime la Demonstration : `test:demo` est sorti de
          #   `npm test` avec `demo_session.mjs`, `api/demo.js` et
          #   `test_demo.mjs`. La chaine est passee de 47 a 46 POUR UNE BONNE
          #   RAISON — mais le plancher, lui, est reste a 47, et il a fait
          #   echouer la CI a chaque run depuis (mesure : run 32730657074,
          #   « chaine test : 46 banc(s) », les DEUX sites).
          #   ⭐⭐⭐ Le commentaire ci-dessus dit « le relever fait partie du lot
          #   qui ajoute un banc ». La reciproque manquait, et elle est aussi
          #   vraie : **l'ABAISSER fait partie du lot qui retire un banc.**
          #   Un plancher au-dessus du reel ne garde rien : il rougit tout le
          #   temps, donc plus personne ne le lit — c'est la meme mort que le
          #   plancher trop bas, par l'autre bout.
          # 🔴 ET J'AI MIS UNE HEURE A LE VOIR : le run du 11 h 56 portait
          #   TROIS etapes rouges, j'ai lu la premiere (`test:acces`, les
          #   fichiers de demo non supprimes) et conclu. Les 7 fichiers
          #   supprimes, celle-ci restait — cause DIFFERENTE, meme rouge.
          #   ⛔ Lire TOUTES les etapes en echec, jamais la premiere seule.
          # MESURE, pas relu :
          #   node -e "console.log(require('./package.json').scripts.test.split(' && ').length)"
          #   → 46
          [ "$n" -ge 46 ] || {
            echo "ERREUR: la chaine est tombee a $n bancs (plancher 46)."
            echo "Un banc retire de \`npm test\` disparait SANS RIEN CASSER :"
            echo "ce plancher est la seule chose qui s'en plaigne."
            exit 1
          }

      # 🔐 LOT 135B — LES EN-TETES DE SECURITE, ET CE BANC EST HORS DE `npm test`.
      # ═══════════════════════════════════════════════════════════════════════
      # 🔴🔴 POURQUOI IL N'EST PAS DANS LA CHAINE. `npm test` est declaree « la
      # chaine complete, HORS RESEAU » et tourne sous `WAREHOUSE_OFFLINE=1` :
      # aucun de ses bancs ne joint quoi que ce soit. Celui-ci interroge
      # Cloudflare. Or `npm test` est une chaine `&&` : un banc qui sort en 2
      # ARRETE tout ce qui suit. L'y mettre ferait echouer les 40 autres des
      # que le reseau manque — un banc qui rougit pour une raison qui n'est pas
      # la sienne, et le contraire de ce qu'on cherche.
      # ⇒ Il vit dans cette etape, qui EST ce qui le reclame : supprimez le
      #   script `test:entetes` de `package.json`, et cette etape echoue. Le
      #   circuit est ferme sans passer par le plancher.
      # ⛔ CE BANC-CI NE COMPTE PAS DANS LE PLANCHER, et c'est tout ce que ce
      #   paragraphe voulait dire. ⚠️ Les deux phrases qui suivaient (« le
      #   plancher reste donc a 40 », « la chaine compte toujours 40 bancs »)
      #   ont ete RETIREES le 18/08/2026 : elles etaient fausses depuis le lot
      #   139 et se citaient elles-memes. La chaine compte 44 bancs, le plancher
      #   est a 44, et les deux se lisent trois lignes plus haut.
      # ⭐⭐⭐ *Un commentaire qui survit a sa cause devient un mensonge qui se
      #   cite* — meme maladie que le plancher qu'il decrivait.
      # ⛔ ET IL N'EST PAS DANS LE DOCKERFILE : un hoquet Cloudflare ne doit
      #   jamais empecher un deploiement.
      # ⭐ `if: always()` — un ecart d'en-tete doit se voir MEME quand un autre
      #   banc a deja echoue. C'est justement les jours ou tout va mal qu'on
      #   verifie le moins.
      # 🔴 Trois verdicts : conforme (0) · ecart (1) · INDECIDABLE (2). Reseau
      #   muet ⇒ 2, JAMAIS 0. Un vert obtenu sans mesure serait un mensonge.
      # ⚠️ AUCUN `env:` ICI, ET C'EST DELIBERE : cette etape a besoin du reseau.
      - name: Les en-tetes de securite sont-ils toujours poses ?
        if: always()
        run: npm run test:entetes

      # 🔥 LOT 136 — LE CACHE, ET CETTE ETAPE EXISTE AVANT LA REGLE CLOUDFLARE.
      # ═══════════════════════════════════════════════════════════════════════
      # ⛔⛔ L'ORDRE EST LE DISPOSITIF : le banc, PUIS la Cache Rule. Une page de
      #   compte servie depuis le bord est la fuite la plus chere de ce reseau —
      #   elle ne casse rien, ne rougit nulle part, et se decouvre par un membre
      #   qui voit le compte d'un autre. Un banc ecrit APRES la regle ne mesure
      #   plus le passage dangereux : il constate un etat deja installe.
      #
      # 🔴🔴 MEME RAISON QUE `test:entetes` DE NE PAS ETRE DANS LA CHAINE.
      #   `npm test` est une chaine `&&` declaree HORS RESEAU
      #   (`WAREHOUSE_OFFLINE=1`) ; ce banc interroge Cloudflare. Un banc qui en
      #   sort en 2 y arreterait les 40 autres.
      # ⛔ LE PLANCHER RESTE A 40 ET IL EST JUSTE. La chaine `test` compte
      #   toujours 40 bancs ; `test:entetes` et `test:cache` vivent DEHORS, dans
      #   leur etape. Ne le montez ni a 41 ni a 42 — il rougirait a tort.
      # ⭐⭐ Ce qui RECLAME ce banc n'est pas le plancher, c'est cette etape :
      #   supprimez `test:cache` de `package.json` et elle echoue. Le circuit
      #   reste ferme, il passe par une autre porte.
      #
      # ⛔ ET IL N'EST PAS DANS LE DOCKERFILE : un hoquet Cloudflare ne doit
      #   jamais empecher un deploiement.
      # ⭐ `if: always()` — une fuite de cache doit se voir MEME quand un autre
      #   banc a deja echoue. C'est les jours ou tout va mal qu'on verifie le
      #   moins, et c'est ces jours-la qu'on pose des rustines au bord.
      # 🔴 Trois verdicts : conforme (0) · ecart (1) · INDECIDABLE (2). Reseau
      #   muet ⇒ 2, JAMAIS 0.
      # ⚠️ PAS DE `WAREHOUSE_OFFLINE` ICI, ET C'EST DELIBERE : cette etape a
      #   besoin du reseau. Le SEUL `env:` permis est l'horodate du commit.
      #
      # 🔴🔴🔴 LOT 179 — `HORODATE_COMMIT` EST CE QUI EMPECHE CE BANC DE JUGER LA
      #   VERSION PRECEDENTE. Mesure du 24/08 sur le run `de7c596` : le banc
      #   frappait la production a 06:54 alors qu'elle servait encore le build de
      #   06:14 ; le nouveau conteneur n'a bascule qu'a 07:02. Deux alertes
      #   Discord sont parties pour un defaut qui n'existait plus.
      #   ⇒ Le banc ATTEND desormais que les deux zones servent un build
      #     posterieur au commit, puis mesure. Sans cette ligne il attend zero
      #     seconde et mesure ce qui traine.
      # ⭐ `github.event.head_commit.timestamp` est vide sur `workflow_dispatch`
      #   — c'est voulu : un lancement a la main n'a aucun deploiement en vol.
      #   C'est exactement le choix que fait deja `purge-cache.yml`.
      - name: Le cache ne sert-il aucune page privee ?
        if: always()
        env:
          HORODATE_COMMIT: ${{ github.event.head_commit.timestamp }}
        run: npm run test:cache

      # 🔊 AJOUTÉ LE 07/08/2026 — MUTUALISATION DU CANAL DE PANNES.
      # ⭐⭐⭐ Un échec qui n'arrive nulle part n'est pas une alerte, c'est une
      # archive. Mesuré ce jour-là : 4 workflows sur 50 alertaient. Le ledger
      # est resté gelé deux semaines derrière un run rouge que personne ne
      # regardait. ⛔ Tout workflow écrit ou modifié repart avec cette étape.
      - name: Alerter sur Discord en cas d'echec
        if: failure() && github.event_name != 'pull_request'
        env:
          DISCORD_ALERTE_TECH_WEBHOOK: ${{ secrets.DISCORD_ALERTE_TECH_WEBHOOK }}
        run: |
          set -u
          if [ -z "${DISCORD_ALERTE_TECH_WEBHOOK:-}" ]; then
            echo "⚠️ DISCORD_ALERTE_TECH_WEBHOOK absent — alerte NON envoyee."
            exit 0
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # ⚠️ LE NOM DU SITE EST DANS LE MESSAGE, ET CE N'EST PAS UN DETAIL.
          # Depuis le lot 102 ce job tourne en MATRICE sur les deux sites : sans
          # lui, deux echecs produisent deux alertes rigoureusement identiques,
          # et on ne sait pas laquelle relire. Une alerte qu'on ne sait pas
          # attribuer coute le temps qu'elle pretendait faire gagner.
          payload=$(printf '{"content":"🔴 **veve-sites / %s** : les bancs sont tombés sur `main`.\\nLe prochain build part sur du code non gardé.\\n%s"}' "${{ matrix.site }}" "$run_url")
          curl -sS -X POST -H 'Content-Type: application/json' \
               -d "$payload" "${DISCORD_ALERTE_TECH_WEBHOOK}" || true
