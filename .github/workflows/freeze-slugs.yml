# ⚠️ DEPOT : VeVePreda/veve-sites
# ⚠️ CHEMIN : .github/workflows/freeze-slugs.yml
# ⚠️ S'INSTALLE PAR LE CRAYON « Edit », PAS par glisser-deposer : le
#    glisser-deposer GitHub ignore `.github/workflows/` EN SILENCE (paye le
#    27/07/2026 sur vevewiki-editorial.yml).

name: Geler les adresses des fiches

# Une fiche publiee doit garder son URL a vie. Ce job ajoute les nouvelles
# fiches a la table et la committe : les adresses existantes ne bougent jamais.
#
# 🔴 DEFAUT CORRIGE LE 28/07/2026 — ce workflow ne posait AUCUNE variable
# `SITE`. Or `engine/lib/manifest.mjs` fait `SITE = process.env.SITE ||
# 'veveprice'` : le gel ne couvrait donc QU'UN SEUL site sur les 15, et rien ne
# le disait. Les autres sites croyaient leurs adresses gelees ; elles ne
# l'etaient pas. On decouvre la liste des sites depuis `sites/` — un site
# nouveau est gele sans qu'on ait a toucher a ce fichier.

on:
  schedule:
    - cron: '23 6 * * 0'
  workflow_dispatch:
    inputs:
      site:
        description: "Un seul site (vide = tous les sites de sites/)"
        required: false
        default: ""

jobs:
  # Etape 1 : la liste des sites, lue sur le disque, pas ecrite en dur.
  sites:
    runs-on: ubuntu-latest
    outputs:
      liste: ${{ steps.trouver.outputs.liste }}
    steps:
      - uses: actions/checkout@v4
      - id: trouver
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.site }}" ]; then
            liste=$(printf '["%s"]' "${{ github.event.inputs.site }}")
          else
            liste=$(ls -1 sites | jq -R . | jq -s -c .)
          fi
          echo "Sites a geler : $liste"
          # Garde-fou : une liste vide passerait en silence et ne gelerait RIEN.
          [ "$liste" != "[]" ] || { echo "Aucun site trouve dans sites/."; exit 1; }
          echo "liste=$liste" >> "$GITHUB_OUTPUT"

  freeze:
    needs: sites
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      # ⚠️ Un seul job a la fois : chaque site committe dans le MEME depot.
      # En parallele, les push se marchent dessus et des gels sont perdus.
      max-parallel: 1
      fail-fast: false
      matrix:
        site: ${{ fromJson(needs.sites.outputs.liste) }}
    steps:
      - uses: actions/checkout@v4
      - name: Etat le plus recent (anti-checkout perime)
        run: git pull --rebase origin main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dependances
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: "Mettre a jour la table des adresses — ${{ matrix.site }}"
        env:
          SITE: ${{ matrix.site }}
        # ⚠️ `pipefail` est INDISPENSABLE : sans lui, le code de sortie du
        # pipeline est celui de `tee` (0), et un `npm run slugs` en echec
        # (entrepot injoignable, table vide refusee) passerait pour un succes.
        run: |
          set -euo pipefail
          npm run slugs 2>&1 | tee gel.log

      # 🔴 DEFAUT CORRIGE LE 29/07/2026 — le gel est IRREVERSIBLE : il fixe a vie
      # l'identite presente au moment ou il s'execute. Or `warehouse.mjs` (l. 80)
      # se replie EN SILENCE sur la release N-1 `catalogue-prev` si la release
      # `catalogue` est injoignable — et `catalogue-prev` porte l'identite
      # d'AVANT l'uniformisation. Un repli non vu gelerait donc a vie les
      # anciennes adresses, avec un run vert. On refuse de commiter dans ce cas.
      - name: "Refuser de geler sur le catalogue N-1"
        run: |
          set -u
          if grep -q 'catalogue-prev' gel.log; then
            echo "::error::Le catalogue frais etait injoignable : les adresses ont ete calculees sur catalogue-prev (identite d'AVANT l'uniformisation). On ne gele PAS."
            exit 1
          fi
          grep -E '^\[entrepot\] catalogue:' gel.log || true

      - name: Committer si la table a change
        run: |
          set -u
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          # ⚠️ DEFAUT CORRIGE LE 29/07/2026 — `git diff --quiet -- sites/` est
          # AVEUGLE aux fichiers non suivis. Au tout premier gel, `slugs.json`
          # n'existe encore dans aucun site : le test ne voyait rien, le job
          # sortait « aucune nouvelle adresse » en VERT, et la table n'etait
          # jamais commitee. On indexe donc AVANT de comparer.
          git add -A sites/
          if git diff --cached --quiet; then
            echo "Aucune nouvelle adresse a figer pour ${{ matrix.site }}."
            exit 0
          fi
          git commit -m "Gel des adresses (${{ matrix.site }}) : nouvelles fiches"
          # ⚠️ DEFAUT CORRIGE LE 29/07/2026 — la boucle se terminait sur `sleep`,
          # qui rend 0 : trois push en echec sortaient donc en VERT, table non
          # publiee. On exige desormais une reussite explicite.
          pousse=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then pousse=1; break; fi
            sleep $((i * 5))
          done
          if [ "$pousse" -ne 1 ]; then
            echo "::error::Table gelee mais JAMAIS poussee pour ${{ matrix.site }} (3 tentatives)."
            exit 1
          fi
          echo "Table gelee et poussee pour ${{ matrix.site }}."
