name: Geler les adresses des fiches

# Une fiche publiee doit garder son URL a vie. Ce job ajoute les nouvelles
# fiches a la table et la committe : les adresses existantes ne bougent jamais.
on:
  schedule:
    - cron: '23 6 * * 0'
  workflow_dispatch:

jobs:
  freeze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dependances
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Mettre a jour la table des adresses
        run: npm run slugs
      - name: Committer si la table a change
        run: |
          set -u
          if git diff --quiet -- sites/; then
            echo "Aucune nouvelle adresse a figer."
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add sites/
          git commit -m "Gel des adresses : nouvelles fiches"
          git push
