name: Reconstruction quotidienne

on:
  schedule:
    - cron: '41 7 * * *'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Declencher le deploiement Coolify
        run: |
          set -u
          code=$(curl -sS -o /tmp/deploy.out -w '%{http_code}' \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_DEPLOY_URL}")
          echo "Reponse HTTP : $code"
          cat /tmp/deploy.out || true
          echo
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "Le declenchement du deploiement a echoue."
            exit 1
          fi
        env:
          COOLIFY_DEPLOY_URL: ${{ secrets.COOLIFY_DEPLOY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}

      - name: Attendre puis verifier que le site est frais
        run: |
          set -u
          today=$(date -u +%d/%m/%Y)
          echo "Date attendue sur le site : $today"
          ok=0
          for i in $(seq 1 20); do
            sleep 45
            html=$(curl -sS "https://veveprice.com/?cb=$(date +%s)" || true)
            if printf '%s' "$html" | grep -q "$today"; then
              echo "Site a jour (tentative $i)."
              ok=1
              break
            fi
            echo "Pas encore a jour (tentative $i)..."
          done
          if [ "$ok" != "1" ]; then
            echo "Le site n'affiche toujours pas la date du jour apres 15 minutes."
            exit 1
          fi

      - name: Alerter sur Discord en cas d'echec
        if: failure()
        run: |
          set -u
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          payload=$(printf '{"content":"🔴 **VeVePrice** : la reconstruction quotidienne a échoué.\\nLe site sert des données périmées.\\n%s"}' "$run_url")
          curl -sS -X POST -H 'Content-Type: application/json' -d "$payload" "${DISCORD_WEBHOOK}" || true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
